<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi Row Pattern Analysis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    padding:20px;
  }
  h2{
    text-align:center;
    margin-bottom:10px;
  }
  .box{
    background:#fff;
    max-width:700px;
    margin:0 auto;
    padding:15px;
    border-radius:6px;
    box-shadow:0 0 6px rgba(0,0,0,0.2);
  }
  textarea{
    width:100%;
    height:80px;
    padding:8px;
    margin-bottom:10px;
  }
  button{
    width:100%;
    padding:10px;
    background:#007bff;
    color:#fff;
    border:none;
    cursor:pointer;
    font-size:16px;
  }
  table{
    margin:20px auto;
    border-collapse:collapse;
    background:#fff;
  }
  th,td{
    border:1px solid #000;
    padding:8px;
    text-align:center;
    min-width:50px;
    font-weight:bold;
  }
  th{
    background:#ddd;
  }
  .green{ background:#90ee90; }
  .red{ background:#f08080; }
  canvas{
    display:block;
    margin:10px auto 30px auto;
  }
</style>
</head>

<body>

<h2>Multi-Row Old vs New Pattern (Line / ❌)</h2>

<div class="box">
  <p><b>Format (har line = 1 row)</b></p>
  <p>Example:</p>
  <p><code>33,38,83,30</code></p>
  <p><code>49,16,71,07</code></p>

  <label><b>Old Records</b></label>
  <textarea id="oldData">33,38,83,30
49,16,71,07
18,83,30,07</textarea>

  <label><b>New Records</b></label>
  <textarea id="newData">31,16,61,10
49,17,08,72
19,84,31,09</textarea>

  <button onclick="analyze()">Check Full Pattern</button>
</div>

<div id="result"></div>

<script>
function sameFamily(a,b){
  return Math.abs(a-b)%5===0;
}

function analyze(){
  const oldLines = document.getElementById("oldData").value.trim().split("\n");
  const newLines = document.getElementById("newData").value.trim().split("\n");
  const result = document.getElementById("result");
  result.innerHTML = "";

  for(let r=0;r<newLines.length;r++){
    const oldArr = oldLines[r].split(",").map(Number);
    const newArr = newLines[r].split(",").map(Number);

    const table = document.createElement("table");
    const row = document.createElement("tr");

    for(let i=0;i<newArr.length;i++){
      const td = document.createElement("td");
      if(sameFamily(oldArr[i],newArr[i])){
        td.className="green";
        td.innerText=newArr[i];
      }else{
        td.className="red";
        td.innerText=newArr[i]+" ❌";
      }
      row.appendChild(td);
    }
    table.appendChild(row);
    result.appendChild(table);

    // CANVAS
    const canvas=document.createElement("canvas");
    canvas.width=70*newArr.length;
    canvas.height=60;
    const ctx=canvas.getContext("2d");

    let x=35;
    let y=30;
    for(let i=0;i<newArr.length-1;i++){
      if(sameFamily(oldArr[i],newArr[i])){
        ctx.strokeStyle="green";
        ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(x,y);
        ctx.lineTo(x+70,y);
        ctx.stroke();
      }else{
        ctx.strokeStyle="red";
        ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(x-10,y-15);
        ctx.lineTo(x+10,y+15);
        ctx.moveTo(x-10,y+15);
        ctx.lineTo(x+10,y-15);
        ctx.stroke();
      }
      x+=70;
    }
    result.appendChild(canvas);
  }
}
</script>

</body>
</html>
