<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔮 Jodi Suggestion Analyzer (AI + Day Logic)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f2d28b}
h2{text-align:center;margin:10px}
#top{text-align:center;padding:10px;background:#eac46b}
button{padding:6px 12px;margin:4px;font-weight:bold;cursor:pointer}

#wrap{display:flex;gap:10px;padding:10px}
#tableWrap{
  width:65%;background:#fff;border:3px solid #000;
  overflow:auto;max-height:80vh
}
#right{
  width:35%;background:#fff;border:3px solid #000;
  padding:10px;max-height:80vh;overflow:auto
}

table{border-collapse:collapse;width:100%}
td,th{border:1px solid #999;padding:4px;text-align:center;font-size:13px}
td[contenteditable]{background:#fff6c7}

.suggest{border-bottom:1px solid #ccc;padding:8px 0}
.family{color:#b40000;font-weight:bold}
.score{font-size:12px;color:#444}
.ai{font-size:12px;color:#1b4f72;margin-top:4px}
.day{font-size:12px;color:#006400;font-weight:bold}
</style>
</head>

<body>

<h2>🔮 Jodi Suggestion Analyzer (AI + Day-wise)</h2>

<div id="top">
  <input type="file" id="csv">
  <button onclick="addRow()">➕ Add Row</button>
  <button onclick="analyze()">Analyze & Suggest</button>
  <button onclick="clearAll()">Clear</button>
</div>

<div id="wrap">
  <div id="tableWrap">
    <table id="tbl"></table>
  </div>
  <div id="right">
    <h3>📌 Last Jodi</h3>
    <div id="last">—</div>
    <h3>🔥 Top 4 Suggested Jodi</h3>
    <div id="result"></div>
  </div>
</div>

<script>
let headers=[], grid=[];

/* ===== FAMILY / PALTI ===== */
function family(j){
  let a=parseInt(j[0]), b=parseInt(j[1]);
  if(isNaN(a)||isNaN(b)) return [];
  let m=n=>(n+10)%10;
  return [
    `${a}${b}`,
    `${b}${a}`,
    `${m(a+5)}${m(b+5)}`,
    `${m(b+5)}${m(a+5)}`
  ];
}

/* ===== LOAD / SAVE ===== */
window.onload=()=>{
  let s=localStorage.getItem("jodiCSV");
  if(s) loadCSV(s);
};

csv.onchange=e=>{
  let r=new FileReader();
  r.onload=()=>{
    localStorage.setItem("jodiCSV",r.result);
    loadCSV(r.result);
  };
  r.readAsText(e.target.files[0]);
};

function loadCSV(txt){
  let lines=txt.trim().split("\n");
  headers=lines.shift().split(",");
  grid=lines.map(l=>l.split(","));
  renderTable();
}

function save(){
  let t=headers.join(",")+"\n"+grid.map(r=>r.join(",")).join("\n");
  localStorage.setItem("jodiCSV",t);
}

/* ===== TABLE ===== */
function renderTable(){
  let h="<tr>";
  headers.forEach(x=>h+=`<th>${x}</th>`);
  h+="</tr>";
  grid.forEach((r,i)=>{
    h+="<tr>";
    r.forEach((v,j)=>{
      h+=`<td contenteditable onblur="edit(${i},${j},this.innerText)">${v}</td>`;
    });
    h+="</tr>";
  });
  tbl.innerHTML=h;
}

function edit(r,c,v){
  grid[r][c]=v.trim();
  save();
}

function addRow(){
  if(!headers.length) return alert("Upload CSV first");
  grid.push(headers.map(()=>"--"));
  save(); renderTable();
}

/* ===== ANALYSIS (DAY + AI) ===== */
function analyze(){
  let freq={}, dayFreq={};
  let lastJodi=null, lastDay=null;

  grid.forEach(row=>{
    row.forEach((v,i)=>{
      if(/^\d{2}$/.test(v)){
        freq[v]=(freq[v]||0)+1;
        let d=headers[i];
        dayFreq[d]=dayFreq[d]||{};
        dayFreq[d][v]=(dayFreq[d][v]||0)+1;
        lastJodi=v;
        lastDay=d;
      }
    });
  });

  if(!lastJodi) return;

  document.getElementById("last").innerHTML=
    `<b>${lastJodi}</b> <div class="day">Day: ${lastDay}</div>`;

  let famLast=family(lastJodi);
  let score={};

  Object.keys(freq).forEach(j=>{
    let s=freq[j];
    let reason=[];

    if(famLast.includes(j)){
      s+=5;
      reason.push("family/palti match with last jodi");
    }

    if(dayFreq[lastDay] && dayFreq[lastDay][j]){
      s+=dayFreq[lastDay][j]*3;
      reason.push(`same day (${lastDay}) repetition`);
    }

    family(j).forEach(x=>{
      if(freq[x]){
        s+=freq[x];
        reason.push(`family strength from ${x}`);
      }
    });

    score[j]={val:s, why:[...new Set(reason)]};
  });

  let top=Object.entries(score)
    .sort((a,b)=>b[1].val-a[1].val)
    .slice(0,4);

  let out="";
  top.forEach(([j,o],i)=>{
    out+=`
    <div class="suggest">
      <b>${i+1}. ${j}</b><br>
      <span class="family">Family:</span> ${family(j).join(", ")}<br>
      <span class="score">Score: ${o.val}</span>
      <div class="ai">🤖 AI Logic: ${o.why.join("; ") || "frequency based pattern"}</div>
    </div>`;
  });
  result.innerHTML=out;
}

/* ===== CLEAR ===== */
function clearAll(){
  if(!confirm("Clear all data?"))return;
  localStorage.removeItem("jodiCSV");
  headers=[];grid=[];
  tbl.innerHTML="";result.innerHTML="";last.innerHTML="—";
}
</script>

</body>
</html>
