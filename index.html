<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#111827;color:#fff;text-align:center}
.hidden{display:none}
button{padding:12px 30px;font-size:18px;margin-top:20px}
</style>
</head>

<body>

<div id="home">
  <h1>HOME</h1>
  <button id="enterBtn">Enter</button>
</div>

<div id="login" class="hidden">
  <h2>Login</h2>
  <input type="password" id="pass" placeholder="1234">
  <br>
  <button id="loginBtn">Login</button>
  <p id="err" style="color:red"></p>
</div>

<div id="dash" class="hidden">
  <h1>✅ DASHBOARD OPEN</h1>
</div>

<script>
document.getElementById("enterBtn").onclick=function(){
  document.getElementById("home").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
};

document.getElementById("loginBtn").onclick=function(){
  if(document.getElementById("pass").value==="1234"){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("dash").classList.remove("hidden");
  }else{
    document.getElementById("err").innerText="Wrong password";
  }
};
</script>

</body>
</html>
