<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jodi Pattern Catch – ULTRA PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- html2canvas + jszip -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#020617;color:#fff;text-align:center}
textarea{width:94%;height:160px;margin-top:10px;padding:10px}
button,input,select{padding:8px 14px;margin:6px;border-radius:6px}
.card{background:#111827;padding:14px;border-radius:10px;margin:12px}
table{border-collapse:collapse;margin:10px auto;background:#fff;color:#000}
td{border:1px solid #000;width:46px;height:38px;font-weight:bold;position:relative;cursor:pointer}
.current{background:#2563eb;color:#fff}
.circle::after{content:"⭕";position:absolute;right:2px;bottom:2px;font-size:14px}
.section{margin:14px auto;width:95%;max-width:980px;background:#111827;padding:12px;border-radius:12px}
h3{color:#38bdf8;margin:6px 0}
.bar{height:14px;background:#22c55e;margin:4px 0;border-radius:6px}
.fullscreen{
  position:fixed;inset:0;background:#020617;z-index:9999;
  overflow:auto;padding:10px
}
</style>
</head>

<body>

<h2>👑 ULTRA PRO Jodi Pattern Catch</h2>

<textarea id="record">
2024-01-01 12 34 56 78
2024-01-02 22 55 57 90
2024-01-03 11 56 44 78
2024-01-04 56 23 99 10
2024-01-05 34 55 56 88
</textarea>

<div class="card">
  <button onclick="build()">Load Record</button>
  <label><input type="checkbox" id="posOnly"> Exact Position</label>
  <select id="limit">
    <option value="3">Top 3</option>
    <option value="2">Top 2</option>
    <option value="1">Top 1</option>
    <option value="999">All</option>
  </select>
  <button onclick="toggleFull()">🔍 Full Screen</button>
  <button onclick="zipExport()">📦 ZIP Export</button>
</div>

<div id="summary" class="card"></div>
<div id="columnStrength" class="card"></div>
<div id="result"></div>

<script>
let rows=[], dates=[], current=null, images=[];

/* LOAD */
function build(){
  const raw=record.value.trim().split("\n");
  rows=[]; dates=[];
  raw.forEach(r=>{
    const p=r.trim().split(/[\s,]+/);
    dates.push(p[0]); rows.push(p.slice(1).map(Number));
  });
  const last=rows[rows.length-1];
  selectJodi(last[last.length-1]);
}

/* ANALYZE */
function selectJodi(j){
  current=j;
  analyze();
}

function analyze(){
  if(current===null) return;
  const range=[current-1,current,current+1];
  const posOnly=document.getElementById("posOnly").checked;
  const limit=parseInt(document.getElementById("limit").value,10);

  result.innerHTML=""; images=[];

  let hits=[], colCount=[0,0,0,0];

  rows.forEach((r,ri)=>{
    let ok=false,pos=-1;
    r.forEach((n,ci)=>{
      if(range.includes(n)){
        if(!posOnly){ok=true;pos=ci;}
        else if(n===current){ok=true;pos=ci;}
      }
    });
    if(ok){
      hits.push({row:r,idx:ri,pos});
      if(pos>=0) colCount[pos]++;
    }
  });

  /* SUMMARY */
  summary.innerHTML=`
    <h3>📌 Strongest Summary</h3>
    <p>Selected Jodi: <b>${current}</b></p>
    <p>Total Pattern Occurrences: <b>${hits.length}</b></p>
  `;

  /* COLUMN STRENGTH */
  columnStrength.innerHTML="<h3>📊 Column Strength</h3>";
  colCount.forEach((c,i)=>{
    const div=document.createElement("div");
    div.innerHTML=`Column ${i+1}: ${c}`;
    const bar=document.createElement("div");
    bar.className="bar"; bar.style.width=(c*20)+"px";
    columnStrength.appendChild(div);
    columnStrength.appendChild(bar);
  });

  /* OCCURRENCES */
  hits.slice(0,limit).forEach((h,i)=>{
    const sec=document.createElement("div");
    sec.className="section";
    sec.innerHTML=`<h3>Occurrence ${i+1} <small>${dates[h.idx]}</small></h3>`;
    const t=document.createElement("table");
    const tr=document.createElement("tr");

    h.row.forEach((n,ci)=>{
      const td=document.createElement("td");
      td.innerText=n;
      if(n===current) td.classList.add("current","circle");
      else if(range.includes(n)&&(!posOnly||ci===h.pos)) td.classList.add("circle");
      tr.appendChild(td);
    });

    t.appendChild(tr); sec.appendChild(t);

    const btn=document.createElement("button");
    btn.innerText="📸 Save";
    btn.onclick=()=>html2canvas(sec).then(c=>{
      const img=c.toDataURL();
      images.push(img);
      const a=document.createElement("a");
      a.download=`occurrence_${i+1}.png`;
      a.href=img; a.click();
    });

    sec.appendChild(btn);
    result.appendChild(sec);
  });
}

/* FULL SCREEN */
function toggleFull(){
  result.classList.toggle("fullscreen");
}

/* ZIP EXPORT */
function zipExport(){
  if(images.length===0){alert("No images yet");return;}
  const zip=new JSZip();
  images.forEach((img,i)=>{
    zip.file(`occurrence_${i+1}.png`, img.split(",")[1], {base64:true});
  });
  zip.generateAsync({type:"blob"}).then(b=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download="pattern_images.zip";
    a.click();
  });
}
</script>

</body>
</html>
