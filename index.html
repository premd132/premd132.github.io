<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Last Jodi Based AI Suggestion (FINAL)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f3d58f}
h2{text-align:center;margin:10px}
#top{text-align:center;padding:8px}
button{padding:6px 10px;margin:4px;font-size:14px}
table{border-collapse:collapse;width:100%;background:#fff}
td,th{border:1px solid #999;padding:4px;text-align:center;font-size:13px}
#wrapper{display:flex;gap:10px;padding:10px}
#left{width:65%;overflow:auto;height:75vh;border:3px solid #000}
#right{width:35%;border:3px solid #000;background:#fff;padding:8px}
.box{border:2px solid #000;padding:6px;margin:6px 0}
.sug{font-size:15px;font-weight:bold;color:#b00000}
.small{font-size:12px;color:#333}
</style>
</head>

<body>

<h2>🔮 Last Jodi Based AI Suggestion (FINAL)</h2>

<div id="top">
<input type="file" id="csv">
<button onclick="addRow()">➕ Add Row</button>
<button onclick="analyze()">🔍 Analyze</button>
<button onclick="clearAll()">🗑️ Clear</button>
</div>

<div id="wrapper">
<div id="left">
<table id="table"></table>
</div>

<div id="right">
<div class="box">
<b>Last Jodi</b>
<div id="lastJodi">–</div>
</div>

<div class="box">
<b>AI Suggested 8 Jodi</b>
<div id="result">Upload record</div>
</div>
</div>
</div>

<script>
let headers=[], data=[];

/* ---------- FAMILY LOGIC ---------- */
function family(j){
  let a=parseInt(j[0]), b=parseInt(j[1]);
  const m=n=>(n+10)%10;
  return Array.from(new Set([
    `${a}${b}`, `${b}${a}`,
    `${m(a+5)}${m(b+5)}`,
    `${m(b+5)}${m(a+5)}`,
    `${m(a-5)}${m(b-5)}`,
    `${m(b-5)}${m(a-5)}`,
    `${a}${m(b+5)}`,
    `${m(a+5)}${b}`
  ]));
}

/* ---------- LOAD CSV ---------- */
csv.onchange=e=>{
  let r=new FileReader();
  r.onload=()=>loadCSV(r.result);
  r.readAsText(e.target.files[0]);
};

function loadCSV(txt){
  let rows=txt.trim().split("\n").map(r=>r.split(","));
  headers=rows.shift();
  data=rows;
  save();
  render();
}

/* ---------- SAVE ---------- */
function save(){
  localStorage.setItem("jodiData",JSON.stringify({headers,data}));
}
function loadSaved(){
  let s=localStorage.getItem("jodiData");
  if(!s) return;
  let o=JSON.parse(s);
  headers=o.headers; data=o.data;
  render();
}
window.onload=loadSaved;

/* ---------- TABLE ---------- */
function render(){
  let h="<tr>";
  headers.forEach(x=>h+=`<th>${x}</th>`);
  h+="</tr>";
  data.forEach(r=>{
    h+="<tr>";
    headers.forEach((_,i)=>{
      h+=`<td contenteditable onblur="edit(this)">${r[i]||""}</td>`;
    });
    h+="</tr>";
  });
  table.innerHTML=h;
}

function edit(td){
  let r=td.parentNode.rowIndex-1;
  let c=td.cellIndex;
  data[r][c]=td.innerText.trim();
  save();
}

function addRow(){
  data.push(headers.map(()=> ""));
  save(); render();
}

function clearAll(){
  if(!confirm("Clear all data?"))return;
  localStorage.clear();
  headers=[]; data=[];
  table.innerHTML="";
  result.innerHTML="Upload record";
  lastJodi.innerText="–";
}

/* ---------- ANALYSIS ---------- */
function analyze(){
  let last=null, lastDay=null, prev=null;

  for(let r=data.length-1;r>=0;r--){
    for(let c=headers.length-1;c>=0;c--){
      let v=(data[r][c]||"").trim();
      if(/^\d{2}$/.test(v)){
        if(!last){ last=v; lastDay=c; }
        else{ prev=v; break; }
      }
    }
    if(prev) break;
  }

  if(!last){
    result.innerHTML="No valid jodi";
    return;
  }

  lastJodi.innerText=last+" ("+headers[lastDay]+")";

  let fam=family(last);
  let singleCount={};

  data.forEach(row=>{
    let v=row[lastDay];
    if(fam.includes(v)){
      let next=row[lastDay+1];
      if(/^\d{2}$/.test(next)){
        singleCount[next[0]]=(singleCount[next[0]]||0)+1;
        singleCount[next[1]]=(singleCount[next[1]]||0)+1;
      }
    }
  });

  let topSingles=Object.entries(singleCount)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,3)
    .map(x=>x[0]);

  let final=new Set();
  topSingles.forEach(a=>{
    topSingles.forEach(b=>{
      if(final.size<8 && a!==b){
        final.add(a+b);
        final.add(b+a);
      }
    });
  });

  let out="";
  [...final].slice(0,8).forEach(j=>{
    out+=`<div class="sug">${j}</div>
          <div class="small">Family: ${family(j).join(", ")}</div>`;
  });

  result.innerHTML=out || "No suggestion";
}
</script>

</body>
</html>
