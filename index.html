<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Matka AI System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:#fff;
}

/* ---------- HOME PAGE ---------- */
#home{
  display:flex;
  height:100vh;
}
.left{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px;
}
.left h1{
  font-size:36px;
  line-height:1.4;
  color:#38bdf8;
}
.right{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#020617;
}
.login-box{
  background:#111827;
  padding:30px;
  width:320px;
  border-radius:8px;
  box-shadow:0 0 20px rgba(0,0,0,0.6);
}
.login-box h2{
  text-align:center;
  margin-bottom:20px;
}
.login-box input{
  width:100%;
  padding:10px;
  margin-bottom:15px;
  border:none;
  border-radius:4px;
}
.login-box button{
  width:100%;
  padding:10px;
  background:#38bdf8;
  border:none;
  font-size:16px;
  cursor:pointer;
}
.error{
  color:red;
  text-align:center;
  margin-top:10px;
}

/* ---------- DASHBOARD ---------- */
#dashboard{
  display:none;
  min-height:100vh;
  background:#020617;
}
.header{
  background:#020617;
  padding:15px;
  text-align:center;
  font-size:22px;
  border-bottom:1px solid #1e293b;
}
.content{
  padding:30px;
  max-width:900px;
  margin:auto;
}
.card{
  background:#111827;
  padding:20px;
  border-radius:8px;
  margin-bottom:20px;
}
.logout{
  background:#dc2626;
  padding:10px;
  border:none;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- ================= HOME PAGE ================= -->
<div id="home">
  <div class="left">
    <h1>
      Welcome to the world of<br>
      <b>The Kings of Matka</b><br><br>
      AI Generate_Perfect Gussing
    </h1>
  </div>

  <div class="right">
    <div class="login-box">
      <h2>Login</h2>
      <input type="password" id="password" placeholder="Enter Password">
      <button onclick="login()">Login</button>
      <div id="error" class="error"></div>
    </div>
  </div>
</div>

<!-- ================= SECOND PAGE / DASHBOARD ================= -->
<div id="dashboard">
  <div class="header">
    Kings of Matka – AI Dashboard
  </div>

  <div class="content">
    <div class="card">
      <h3>Welcome 👑</h3>
      <p>
        You are successfully logged in.<br>
        This is your private analysis dashboard.
      </p>
    </div>

    <div class="card">
      <h3>System Status</h3>
      <p>
        • Secure Login Active ✅<br>
        • Analysis Tools Enabled ✅<br>
        • Private Access Only 🔒
      </p>
    </div>

    <button class="logout" onclick="logout()">Logout</button>
  </div>
</div>

<script>
/* 🔑 CHANGE PASSWORD HERE */
const PASSWORD = "1234";

function login(){
  const input = document.getElementById("password").value;
  if(input === PASSWORD){
    document.getElementById("home").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
  }else{
    document.getElementById("error").innerText = "Wrong password!";
  }
}

function logout(){
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("home").style.display = "flex";
  document.getElementById("password").value = "";
}
</script>

</body>
</html>
