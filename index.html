<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pattern Analyzer – FINAL</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{margin:0;font-family:Arial;background:#f1d18a}
h2{text-align:center;margin:10px}
#top{text-align:center;padding:10px}
button{padding:6px 10px;margin:4px;font-weight:bold}

#wrap{display:flex;gap:10px;padding:10px}
#chartWrap{height:80vh;overflow:auto;border:3px solid #000;background:#fff}
canvas{background:#fff}

#right{width:28%;max-height:80vh;overflow:auto}
.check{
 background:#fff;
 margin:6px;
 padding:6px;
 border-left:5px solid red;
 cursor:pointer;
 font-size:13px
}

#editor{
 width:32%;
 max-height:80vh;
 overflow:auto;
 background:#fff;
 border:3px solid #000;
 padding:6px;
 display:none;
}

table{border-collapse:collapse;width:100%}
td,th{border:1px solid #999;padding:4px;text-align:center;font-size:12px}
td[contenteditable]{background:#fff7cc}
.del{color:red;cursor:pointer;font-weight:bold}

#modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.7);
 align-items:center;
 justify-content:center;
}
#modalBox{
 background:#fff;
 padding:8px;
 max-width:95vw;
 max-height:95vh;
 overflow:auto;
}
</style>
</head>

<body>

<h2>📊 Pattern Analyzer – Drawing + Block Pattern (FINAL)</h2>

<div id="top">
<input type="file" id="csv">
<button onclick="setMode('draw')">✏️ Drawing Mode</button>
<button onclick="setMode('block')">🧱 Block Pattern Mode</button>
<button onclick="toggleEditor()">✏️ Edit Record</button>
<button onclick="addRow()">➕ Add Row</button>
<button onclick="toggleDelete()">🗑️ Delete Mode</button>
<button onclick="resetAll()">Reset</button>
</div>

<div id="wrap">
 <div id="chartWrap"><canvas id="chart"></canvas></div>
 <div id="right"><b>Pattern Check Lines</b></div>
 <div id="editor">
  <b>Editable Record</b>
  <div id="tableBox"></div>
 </div>
</div>

<div id="modal" onclick="this.style.display='none'">
 <div id="modalBox" onclick="event.stopPropagation()">
  <canvas id="popup"></canvas>
 </div>
</div>

<script>
/* ========= GLOBAL ========= */
let headers=[],grid=[];
let mode="draw";          // draw | block
let userPath=[];
let found=[];
let deleteMode=false;

const cellW=80,cellH=30;
const cvs=document.getElementById("chart");
const ctx=cvs.getContext("2d");
const pop=document.getElementById("popup");
const pctx=pop.getContext("2d");

/* ========= FAMILY LOGIC ========= */
function family(j){
 if(!j||j.length<2) return [];
 let a=parseInt(j[0]), b=parseInt(j[1]);
 const m=n=>(n+10)%10;
 return [
  `${a}${b}`,`${b}${a}`,
  `${m(a+1)}${m(b+3)}`,
  `${m(b+3)}${m(a+1)}`,
  `${m(a-5)}${m(b-5)}`
 ];
}

/* ========= LOAD / SAVE ========= */
window.onload=()=>{
 let s=localStorage.getItem("savedCSV");
 if(s) loadCSV(s);
};

csv.onchange=e=>{
 let r=new FileReader();
 r.onload=()=>{
  localStorage.setItem("savedCSV",r.result);
  loadCSV(r.result);
 };
 r.readAsText(e.target.files[0]);
};

function loadCSV(txt){
 let lines=txt.trim().split("\n");
 headers=lines.shift().split(",");
 grid=lines.map(l=>l.split(","));
 drawAll();renderEditor();
}

function saveGrid(){
 let t=headers.join(",")+"\n"+grid.map(r=>r.join(",")).join("\n");
 localStorage.setItem("savedCSV",t);
}

/* ========= DRAW CHART ========= */
function drawAll(){
 cvs.width=headers.length*cellW+100;
 cvs.height=grid.length*cellH+60;
 drawChart();
}

function drawChart(){
 ctx.clearRect(0,0,cvs.width,cvs.height);
 ctx.font="12px Arial";
 headers.forEach((h,i)=>ctx.fillText(h,80+i*cellW,20));
 grid.forEach((r,ri)=>{
  r.forEach((v,ci)=>{
   let x=60+ci*cellW,y=40+ri*cellH;
   ctx.strokeRect(x,y,cellW,cellH);
   ctx.fillText(v,x+cellW/2-8,y+18);
  });
 });
}

/* ========= MODE ========= */
function setMode(m){
 mode=m;
 userPath=[];found=[];
 right.innerHTML="<b>Pattern Check Lines</b>";
 drawChart();
 alert(m==="draw"?"Drawing Mode ON":"Block Pattern Mode ON");
}

function resetAll(){
 userPath=[];found=[];
 right.innerHTML="<b>Pattern Check Lines</b>";
 drawChart();
}

/* ========= CANVAS CLICK ========= */
cvs.onclick=e=>{
 let r=cvs.getBoundingClientRect();
 let col=Math.floor((e.clientX-r.left-60)/cellW);
 let row=Math.floor((e.clientY-r.top-40)/cellH);
 if(!grid[row]||!grid[row][col]) return;

 if(mode==="draw") handleDraw(row,col);
 else handleBlock(row,col);
};

/* ========= DRAW MODE ========= */
function handleDraw(row,col){
 userPath.push({r:row,c:col,val:grid[row][col]});
 drawUser();
 if(userPath.length>1) search();
}

function drawUser(){
 drawChart();
 userPath.forEach((p,i)=>{
  let x=60+p.c*cellW+cellW/2;
  let y=40+p.r*cellH+cellH/2;
  ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);
  ctx.strokeStyle="red";ctx.stroke();
  if(i){
   let q=userPath[i-1];
   ctx.beginPath();
   ctx.moveTo(60+q.c*cellW+cellW/2,40+q.r*cellH+cellH/2);
   ctx.lineTo(x,y);
   ctx.strokeStyle="green";ctx.stroke();
  }
 });
}

/* ========= BLOCK MODE ========= */
function handleBlock(row,col){
 userPath.push({r:row,c:col,val:grid[row][col]});
 drawUser();

 // 🔒 IMPORTANT FIX
 if(userPath.length<2) return;

 search();
}

/* ========= SEARCH ========= */
function search(){
 found=[];
 right.innerHTML="<b>Pattern Check Lines</b>";

 let rg=[],cg=[];
 for(let i=1;i<userPath.length;i++){
  rg.push(userPath[i].r-userPath[i-1].r);
  cg.push(userPath[i].c-userPath[i-1].c);
 }

 for(let br=0;br<grid.length;br++){
  for(let bc=0;bc<headers.length;bc++){
   let pts=[],ok=true;
   for(let i=0;i<userPath.length;i++){
    let rr=br+rg.slice(0,i).reduce((a,b)=>a+b,0);
    let cc=bc+cg.slice(0,i).reduce((a,b)=>a+b,0);
    if(!grid[rr]||!grid[rr][cc]||
       !family(userPath[i].val).includes(grid[rr][cc])){
        ok=false;break;
    }
    pts.push({r:rr,c:cc,val:grid[rr][cc]});
   }
   if(ok) found.push(pts);
  }
 }
 renderCheck();
}

function renderCheck(){
 found.forEach((p,i)=>{
  let d=document.createElement("div");
  d.className="check";
  d.innerHTML=`<b>Pattern ${i+1}</b><br>${p.map(x=>x.val).join(" → ")}`;
  d.onclick=()=>showPattern(p);
  right.appendChild(d);
 });
}

/* ========= POPUP ========= */
function showPattern(p){
 drawChart();
 p.forEach((pt,i)=>{
  let x=60+pt.c*cellW+cellW/2;
  let y=40+pt.r*cellH+cellH/2;
  ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);
  ctx.strokeStyle="red";ctx.stroke();
  if(i){
   let pr=p[i-1];
   ctx.beginPath();
   ctx.moveTo(60+pr.c*cellW+cellW/2,40+pr.r*cellH+cellH/2);
   ctx.lineTo(x,y);
   ctx.strokeStyle="green";ctx.stroke();
  }
 });

 let minR=Math.min(...p.map(x=>x.r));
 let maxR=Math.max(...p.map(x=>x.r))+1;
 let y=40+minR*cellH;
 let h=(maxR-minR)*cellH+40;
 pop.width=cvs.width;pop.height=h;
 pctx.drawImage(cvs,0,y,cvs.width,h,0,0,cvs.width,h);
 modal.style.display="flex";
}

/* ========= EDITOR ========= */
function toggleEditor(){
 editor.style.display=editor.style.display==="none"?"block":"none";
}

function addRow(){
 grid.push(headers.map(()=>"--"));
 saveGrid();drawAll();renderEditor();
}

function toggleDelete(){
 deleteMode=!deleteMode;
 alert(deleteMode?"Delete ON":"Delete OFF");
}

function renderEditor(){
 let html="<table><tr>";
 headers.forEach(h=>html+=`<th>${h}</th>`);html+="<th>X</th></tr>";
 grid.forEach((r,i)=>{
  html+="<tr>";
  r.forEach((v,j)=>{
   html+=`<td contenteditable onblur="editCell(${i},${j},this.innerText)">${v}</td>`;
  });
  html+=`<td class='del' onclick='rowDelete(${i})'>X</td></tr>`;
 });
 html+="</table>";
 tableBox.innerHTML=html;
}

function editCell(r,c,v){
 grid[r][c]=v.trim();saveGrid();drawAll();
}

function rowDelete(r){
 if(!deleteMode)return;
 grid.splice(r,1);saveGrid();drawAll();renderEditor();
}
</script>

</body>
</html>
