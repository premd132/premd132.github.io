<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔮 Jodi Suggestion Analyzer (FINAL)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f2d28b;
}
h2{text-align:center;margin:10px}

#top{
  text-align:center;
  padding:10px;
  background:#eac46b;
}
button{
  padding:6px 12px;
  margin:4px;
  cursor:pointer;
  font-weight:bold;
}
#wrap{
  display:flex;
  gap:10px;
  padding:10px;
}
#tableWrap{
  width:65%;
  background:#fff;
  border:3px solid #000;
  overflow:auto;
  max-height:80vh;
}
#right{
  width:35%;
  background:#fff;
  border:3px solid #000;
  padding:10px;
  max-height:80vh;
  overflow:auto;
}

table{
  border-collapse:collapse;
  width:100%;
}
td,th{
  border:1px solid #999;
  padding:4px;
  text-align:center;
  font-size:13px;
}
td[contenteditable]{
  background:#fff6c7;
}

.family{
  color:#c40000;
  font-weight:bold;
}
.suggest{
  border-bottom:1px solid #ccc;
  padding:6px 0;
}
.score{
  font-size:12px;
  color:#555;
}
</style>
</head>

<body>

<h2>🔮 Jodi Suggestion Analyzer (FINAL)</h2>

<div id="top">
  <input type="file" id="csv">
  <button onclick="addRow()">➕ Add Row</button>
  <button onclick="analyze()">Analyze & Suggest</button>
  <button onclick="clearAll()">Clear</button>
</div>

<div id="wrap">
  <div id="tableWrap">
    <table id="tbl"></table>
  </div>
  <div id="right">
    <h3>📌 Last Jodi</h3>
    <div id="last">—</div>
    <h3>🔥 Top 4 Suggested Jodi</h3>
    <div id="result"></div>
  </div>
</div>

<script>
let headers=[];
let grid=[];

/* ========= FAMILY / PALTI LOGIC ========= */
function family(j){
  let a=parseInt(j[0]), b=parseInt(j[1]);
  if(isNaN(a)||isNaN(b)) return [];
  let m=n=>(n+10)%10;
  return [
    `${a}${b}`,
    `${b}${a}`,
    `${m(a+5)}${m(b+5)}`,
    `${m(b+5)}${m(a+5)}`
  ];
}

/* ========= LOAD / SAVE ========= */
window.onload=()=>{
  let saved=localStorage.getItem("jodiCSV");
  if(saved) loadCSV(saved);
};

csv.onchange=e=>{
  let r=new FileReader();
  r.onload=()=>{
    localStorage.setItem("jodiCSV",r.result);
    loadCSV(r.result);
  };
  r.readAsText(e.target.files[0]);
};

function loadCSV(txt){
  let lines=txt.trim().split("\n");
  headers=lines.shift().split(",");
  grid=lines.map(l=>l.split(","));
  renderTable();
}

/* ========= TABLE ========= */
function renderTable(){
  let h="<tr>";
  headers.forEach(x=>h+=`<th>${x}</th>`);
  h+="</tr>";
  grid.forEach((r,i)=>{
    h+="<tr>";
    r.forEach((v,j)=>{
      h+=`<td contenteditable onblur="edit(${i},${j},this.innerText)">${v}</td>`;
    });
    h+="</tr>";
  });
  tbl.innerHTML=h;
}

function edit(r,c,v){
  grid[r][c]=v.trim();
  save();
}

function addRow(){
  if(!headers.length) return alert("Upload CSV first");
  grid.push(headers.map(()=>"--"));
  save(); renderTable();
}

function save(){
  let txt=headers.join(",")+"\n"+grid.map(r=>r.join(",")).join("\n");
  localStorage.setItem("jodiCSV",txt);
}

/* ========= ANALYSIS ========= */
function analyze(){
  if(!grid.length) return;

  let all=[];
  grid.forEach(r=>r.forEach(v=>{
    if(/^\d{2}$/.test(v)) all.push(v);
  }));

  let last=all[all.length-1];
  document.getElementById("last").innerHTML=`<b>${last}</b>`;

  let freq={};
  all.forEach(v=>freq[v]=(freq[v]||0)+1);

  let fam=family(last);
  let score={};

  Object.keys(freq).forEach(j=>{
    let s=freq[j];
    if(fam.includes(j)) s+=5;
    family(j).forEach(x=>{
      if(freq[x]) s+=freq[x];
    });
    score[j]=s;
  });

  let top=Object.entries(score)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,4);

  let out="";
  top.forEach(([j,s],i)=>{
    out+=`
      <div class="suggest">
        <b>${i+1}. ${j}</b><br>
        <span class="family">Family:</span> ${family(j).join(", ")}<br>
        <span class="score">Score: ${s}</span>
      </div>
    `;
  });
  result.innerHTML=out;
}

/* ========= CLEAR ========= */
function clearAll(){
  if(!confirm("Clear all data?")) return;
  localStorage.removeItem("jodiCSV");
  headers=[]; grid=[];
  tbl.innerHTML="";
  result.innerHTML="";
  last.innerHTML="—";
}
</script>

</body>
</html>
