<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kings of Matka</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#020617;color:#fff;text-align:center}
.hero{
  min-height:100vh;
  background:linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,.8)),
  url("https://images.unsplash.com/photo-1519681393784-d120267933ba") center/cover;
  display:flex;align-items:center;justify-content:center;flex-direction:column
}
button{padding:12px 30px;font-size:18px;background:#38bdf8;border:none;cursor:pointer}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  max-width:800px;
  margin:40px auto;
}
.card{
  background:#111827;
  padding:25px;
  border-radius:10px;
  font-size:20px;
  cursor:pointer;
}
.login{max-width:300px;margin:30px auto}
input{width:100%;padding:10px;margin:10px 0}
</style>
</head>

<body>

<div class="hero" id="home">
  <h1>👑 Kings of Matka 👑</h1>
  <p>AI Based Professional Analysis System</p>
  <button onclick="showLogin()">Enter</button>
</div>

<div id="login" style="display:none">
  <div class="login">
    <h2>Login</h2>
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="err" style="color:red"></p>
  </div>
</div>

<div id="panel" style="display:none">
  <h2>Result Panel</h2>
  <div class="grid">
    <div class="card" onclick="go('milan-day.html')">Milan Day</div>
    <div class="card" onclick="go('kalyan.html')">Kalyan</div>
    <div class="card" onclick="go('milan-night.html')">Milan Night</div>
    <div class="card" onclick="go('rajdhani-night.html')">Rajdhani Night</div>
  </div>
</div>

<script>
const PASSWORD="1234";
function showLogin(){
  home.style.display="none";
  login.style.display="block";
}
function login(){
  if(pass.value===PASSWORD){
    login.style.display="none";
    panel.style.display="block";
  }else err.innerText="Wrong password";
}
function go(page){
  window.location.href=page;
}
</script>

</body>
</html>
