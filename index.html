<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Last Jodi AI Suggestion – FINAL SIMPLE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f3d892;
}
h2{
  text-align:center;
  margin:10px 0;
}
#top{
  display:flex;
  gap:10px;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  padding:10px;
}
button{
  padding:6px 12px;
  cursor:pointer;
}
#wrap{
  display:flex;
  gap:10px;
  padding:10px;
}
#left,#right{
  background:#fff;
  border:2px solid #000;
  padding:10px;
}
#left{
  width:60%;
  max-height:80vh;
  overflow:auto;
}
#right{
  width:40%;
}
table{
  border-collapse:collapse;
  width:100%;
}
td{
  border:1px solid #999;
  padding:4px;
  text-align:center;
  font-size:13px;
}
td[contenteditable]{
  background:#fff6cc;
}
.box{
  border-left:5px solid green;
  padding:6px;
  margin:6px 0;
  background:#f6fff0;
  font-size:13px;
}
.small{
  font-size:12px;
  color:#333;
}
</style>
</head>

<body>

<h2>🔮 Last Jodi Based AI Suggestion (FINAL)</h2>

<div id="top">
  <input type="file" id="csv">
  <button onclick="addRow()">➕ Add Row</button>
  <button onclick="analyze()">🔍 Analyze</button>
  <button onclick="clearAll()">🗑 Clear</button>
</div>

<div id="wrap">
  <div id="left">
    <table id="table"></table>
  </div>
  <div id="right">
    <b>AI Result</b>
    <div id="result" class="small">Upload record</div>
  </div>
</div>

<script>
/* ================= DATA ================= */
let grid=[];

/* ================= LOAD SAVED ================= */
window.onload=()=>{
  let s=localStorage.getItem("record");
  if(s){
    grid=JSON.parse(s);
    render();
  }
};

/* ================= CSV UPLOAD ================= */
csv.onchange=e=>{
  let r=new FileReader();
  r.onload=()=>{
    grid=r.result
      .trim()
      .split("\n")
      .map(l=>l.split(",").map(x=>x.trim()));
    save();
    render();
  };
  r.readAsText(e.target.files[0]);
};

/* ================= RENDER ================= */
function render(){
  let t=document.getElementById("table");
  if(grid.length===0){ t.innerHTML=""; return; }
  let html="";
  grid.forEach((row,i)=>{
    html+="<tr>";
    row.forEach((v,j)=>{
      html+=`<td contenteditable
        onblur="edit(${i},${j},this.innerText)">
        ${v||""}
      </td>`;
    });
    html+="</tr>";
  });
  t.innerHTML=html;
}

/* ================= EDIT ================= */
function edit(r,c,val){
  grid[r][c]=val.trim();
  save();
}

/* ================= ADD ROW ================= */
function addRow(){
  if(grid.length===0) return;
  grid.push(new Array(grid[0].length).fill(""));
  save(); render();
}

/* ================= SAVE ================= */
function save(){
  localStorage.setItem("record",JSON.stringify(grid));
}

/* ================= CLEAR ================= */
function clearAll(){
  if(!confirm("Clear all data?"))return;
  grid=[];
  localStorage.removeItem("record");
  render();
  result.innerHTML="Upload record";
}

/* ================= FAMILY ================= */
function family(j){
  if(!/^\d{2}$/.test(j)) return [];
  let a=+j[0], b=+j[1];
  let m=n=>(n+10)%10;
  return [
    `${a}${b}`,`${b}${a}`,
    `${m(a+1)}${m(b+1)}`,
    `${m(a-1)}${m(b-1)}`,
    `${m(a+5)}${m(b+5)}`
  ];
}

/* ================= ANALYZE ================= */
function analyze(){
  if(grid.length<2){
    result.innerHTML="Not enough data";
    return;
  }

  let lastRow=grid[grid.length-1];
  let prevRow=grid[grid.length-2];

  let last=null, prev=null;

  for(let i=lastRow.length-1;i>=0;i--){
    if(/^\d{2}$/.test(lastRow[i])){ last=lastRow[i]; break; }
  }
  for(let i=prevRow.length-1;i>=0;i--){
    if(/^\d{2}$/.test(prevRow[i])){ prev=prevRow[i]; break; }
  }

  if(!last){
    result.innerHTML="Last jodi not found";
    return;
  }

  /* 3 single ank */
  let singles=[...new Set((last+(prev||"")).split(""))].slice(0,3);

  /* build 8 jodi max */
  let candidates=[];
  for(let i=0;i<singles.length;i++){
    for(let j=0;j<singles.length;j++){
      if(i!==j) candidates.push(singles[i]+singles[j]);
    }
  }
  candidates=candidates.slice(0,8);

  let html=`<b>Last Jodi:</b> ${last}<br>`;
  if(prev) html+=`<b>Previous Jodi:</b> ${prev}<br><br>`;
  html+=`<b>🎯 Suggested 8 Jodi</b><br>`;

  candidates.forEach((j,i)=>{
    html+=`
    <div class="box">
      <b>${i+1}. ${j}</b><br>
      <span class="small">Family: ${family(j).join(", ")}</span>
    </div>`;
  });

  result.innerHTML=html;
}
</script>

</body>
</html>
