<!DOCTYPE html>
<html lang="en">
<head>

<title>🔥 iSmart Analyzer – Phase 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>🔥 iSmart Analyzer (Photo Line + Popup)</h2>
