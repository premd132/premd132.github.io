<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kalyan – Pattern System with Lines</title>
<style>
body{font-family:Arial; background: #f4f4f4;}
.table-container { position: relative; display: inline-block; background: #fff; }
table{border-collapse:collapse; font-size:13px; position: relative; z-index: 2;}
td,th{border:1px solid #999; padding:10px; text-align:center; font-weight:600; width: 40px; height: 40px;}
td[contenteditable]{background:#fffbe6}
.blank{background:#eee; cursor:pointer}
.circle{border:3px solid red; border-radius:50%; position: relative; z-index: 5; background: rgba(255,0,0,0.1);}
#checks div{background:#e8ffe8; margin:4px; padding:6px; cursor:pointer; border: 1px solid #ccc;}
#ai,#future{background:#eef; padding:8px; margin-top:6px; font-weight:600}
#popup{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:3px solid #000; display:none; max-height:50%; overflow:auto; padding: 20px;}
canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 3; }
button{margin:4px; padding: 8px 12px; cursor: pointer;}
</style>
</head>
<body>

<h2>Kalyan – Pattern System (Line Logic)</h2>
<input type="file" id="csv">
<button onclick="addRow()">Add Row</button>
<button onclick="saveData()">Save Data</button>

<div class="table-container">
    <canvas id="mainCanvas"></canvas>
    <table id="tbl"></table>
</div>

<h3>✔ Check Lines (Top 3)</h3>
<div id="checks"></div>

<div id="ai"></div>
<div id="future"></div>

<div id="popup">
 <button onclick="closePopup()">Close</button>
 <div class="table-container">
    <canvas id="popCanvas"></canvas>
    <div id="popData"></div>
 </div>
</div>

<script>
const STORAGE_KEY="pdata_kalyan";
let targetCol=null;
const tbl=document.getElementById("tbl");
const checks=document.getElementById("checks");
const ai=document.getElementById("ai");
const future=document.getElementById("future");
const popup=document.getElementById("popup");
const popData=document.getElementById("popData");
const csv=document.getElementById("csv");

/* FAMILY LOGIC */
const families={"12":["12","17","21","26","62","67","71","76"],"13":["13","18","31","36","63","68","81","86"],"14":["14","19","41","46","64","69","91","96"],"15":["01","06","10","15","51","56","60","65"],"23":["23","28","32","37","73","78","82","87"],"24":["24","29","42","47","74","79","92","97"],"25":["02","07","20","25","52","57","70","75"],"34":["34","39","43","48","84","89","93","98"],"35":["03","08","30","35","53","58","80","85"],"45":["04","09","40","45","54","59","90","95"],"HR":["05","16","27","38","49","50","61","72","83","94"],"FR":["00","11","22","33","44","55","66","77","88","99"]};
function fam(v){for(let k in families) if(families[k].includes(v)) return k; return "NA";}
function smartMatch(a,b){ if(a=="**"||b=="**") return false; return a===b || b===palti(a) || fam(a)===fam(b); }
function palti(v){return v[1]+v[0];}
function norm(v){if(v==""||v=="**")return "**"; v=String(v); return v.length==1?"0"+v:v;}

/* DATA LOAD */
let data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
if(!data) data=[["51","91","41","57","19","95"],["05","90","74","06","19","63"],["90","34","82","09","28","19"],["**","**","**","**","**","**"]];
data=data.map(r=>r.map(norm));

/* DRAWING FUNCTION */
let activeMark=null;
function draw(){
 let h="<tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr>";
 data.forEach((r,ri)=>{
  h+="<tr>";
  r.forEach((c,ci)=>{
   let cls = (activeMark && isPartOfPattern(ri, ci)) ? "circle" : "";
   h+=`<td class="${cls}" contenteditable oninput="edit(${ri},${ci},this)" ${c=="**"?'onclick="makePattern('+ri+','+ci+')"':''}>${c}</td>`;
  });
  h+="</tr>";
 });
 tbl.innerHTML=h;
 if(activeMark) setTimeout(() => drawLines("mainCanvas", tbl), 50);
}

function isPartOfPattern(ri, ci){
    let {start, shape} = activeMark;
    let i = ri - start;
    return (i >= 0 && i < shape.length && shape[i][ci]);
}

/* LINE DRAWING LOGIC */
function drawLines(canvasId, tableEl) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext("2d");
    canvas.width = tableEl.offsetWidth;
    canvas.height = tableEl.offsetHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const circledCells = tableEl.querySelectorAll(".circle");
    if (circledCells.length < 2) return;

    ctx.strokeStyle = "red";
    ctx.lineWidth = 2;

    // Pehli circled jodi ko base mankar baki sabse connect karna
    const baseRect = circledCells[circledCells.length - 1].getBoundingClientRect();
    const tableRect = tableEl.getBoundingClientRect();

    const x1 = baseRect.left - tableRect.left + baseRect.width / 2;
    const y1 = baseRect.top - tableRect.top + baseRect.height / 2;

    circledCells.forEach(cell => {
        const rect = cell.getBoundingClientRect();
        const x2 = rect.left - tableRect.left + rect.width / 2;
        const y2 = rect.top - tableRect.top + rect.height / 2;
        
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    });
}

/* PATTERN SEARCH & EVENTS */
function edit(r,c,el){data[r][c]=norm(el.innerText.trim());}
function addRow(){data.push(["","","","","",""].map(norm)); draw();}
function saveData(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); alert("Saved"); }

function makePattern(r,c){
 targetCol=c;
 let base="**";
 for(let i=r;i>=0;i--){if(data[i][c]!="**"){base=data[i][c];break;}}
 if(base=="**") return;

 let shape=[];
 for(let i=Math.max(0,r-4);i<=r;i++){
  let row=[];
  for(let j=0;j<6;j++){ row.push(data[i][j]!="**" && smartMatch(data[i][j],base)?1:0); }
  shape.push(row);
 }
 searchPattern(shape,base);
}

let lastMatches=[],topMatches=[];
function searchPattern(shape,base){
 lastMatches=[];
 let h=shape.length;
 for(let i=0;i<=data.length-h;i++){
  let ok=true;
  for(let k=0;k<h;k++) {
   for(let j=0;j<6;j++) {
    if(shape[k][j] && !smartMatch(data[i+k][j],base)){ok=false;break;}
   }
   if(!ok) break;
  }
  if(ok) lastMatches.push({index:i});
 }
 showChecks(shape);
}

function showChecks(shape){
 checks.innerHTML="";
 if(lastMatches.length==0){ai.innerHTML="No match"; return;}
 topMatches=lastMatches.slice(0,4);
 topMatches.forEach((m,i)=>{
  let d=document.createElement("div");
  d.innerText=(i+1)+". Match Found (Click to See Line)";
  d.onclick=()=>showOne(shape,i);
  checks.appendChild(d);
 });
}

function showOne(shape,n){
 let idx=topMatches[n].index;
 activeMark={start:idx, shape:shape};
 draw(); // Main table par line dikhayega

 // Popup Setup
 let html="<table id='popTbl'>";
 for(let i=0; i<shape.length; i++){
  html+="<tr>";
  data[idx+i].forEach((v,j)=>{
   let cls=shape[i][j]?"circle":"";
   html+=`<td class="${cls}">${v}</td>`;
  });
  html+="</tr>";
 }
 html+="</table>";
 popData.innerHTML=html;
 popup.style.display="block";
 setTimeout(() => drawLines("popCanvas", document.getElementById("popTbl")), 100);
}

function closePopup() {
    popup.style.display='none';
    activeMark = null;
    draw();
}

csv.onchange=e=>{
 let fr=new FileReader();
 fr.onload=()=>{
  let rows=fr.result.replace(/\r/g,"").trim().split("\n");
  data=rows.map(r=>r.split(",").map(v=>norm(v.trim())));
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  draw();
 };
 fr.readAsText(e.target.files[0]);
};

draw();
</script>
</body>
</html>
