<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Pattern Analysis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  padding:20px;
}
h2{text-align:center;}
.box{
  background:#fff;
  max-width:800px;
  margin:0 auto;
  padding:15px;
  border-radius:6px;
  box-shadow:0 0 6px rgba(0,0,0,0.2);
}
textarea,input{
  width:100%;
  padding:8px;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:10px;
  margin-top:6px;
  background:#007bff;
  color:#fff;
  border:none;
  cursor:pointer;
  font-size:15px;
}
button.secondary{background:#28a745;}
button.danger{background:#dc3545;}
table{
  margin:15px auto;
  border-collapse:collapse;
  background:#fff;
}
td{
  border:1px solid #000;
  padding:8px;
  min-width:55px;
  text-align:center;
  font-weight:bold;
}
.green{background:#90ee90;}
.red{background:#f08080;}
canvas{
  display:block;
  margin:5px auto 30px auto;
}
.history{
  background:#fff;
  padding:10px;
  margin-top:20px;
  border-radius:6px;
}
.hidden{display:none;}
.login{
  max-width:350px;
  margin:120px auto;
  background:#fff;
  padding:20px;
  border-radius:6px;
  box-shadow:0 0 8px rgba(0,0,0,0.3);
  text-align:center;
}
.error{color:red;}
</style>
</head>

<body>

<!-- 🔐 LOGIN SCREEN -->
<div id="loginBox" class="login">
  <h2>🔐 Enter Password</h2>
  <input type="password" id="passwordInput" placeholder="Password">
  <button onclick="checkPassword()">Login</button>
  <p id="errorMsg" class="error"></p>
</div>

<!-- 🔓 MAIN CONTENT -->
<div id="mainContent" class="hidden">

<h2>Secure Pattern Analysis</h2>

<div class="box">
<b>Old Records (har line = 1 row)</b>
<textarea id="oldData">33,38,83,30
49,16,71,07
18,83,30,07</textarea>

<b>New Records</b>
<textarea id="newData">31,16,61,10
49,17,08,72
19,84,31,09</textarea>

<button onclick="analyze()">Check Pattern</button>
<button class="secondary" onclick="saveHistory()">Save History</button>
<button class="danger" onclick="downloadImage()">Download Image</button>
</div>

<div id="result"></div>

<div class="history">
<h3>Saved History</h3>
<ul id="historyList"></ul>
</div>

</div>

<script>
/* 🔑 CHANGE PASSWORD HERE */
const PASSWORD = "1234";

/* LOGIN CHECK */
function checkPassword(){
  const input=document.getElementById("passwordInput").value;
  if(input===PASSWORD){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("mainContent").classList.remove("hidden");
  }else{
    document.getElementById("errorMsg").innerText="Wrong password!";
  }
}

/* FAMILY RULE */
function sameFamily(a,b){
  return Math.abs(a-b)%5===0;
}

/* MAIN ANALYSIS */
function analyze(){
  const oldLines=document.getElementById("oldData").value.trim().split("\n");
  const newLines=document.getElementById("newData").value.trim().split("\n");
  const result=document.getElementById("result");
  result.innerHTML="";

  for(let r=0;r<newLines.length;r++){
    const oldArr=oldLines[r].split(",").map(Number);
    const newArr=newLines[r].split(",").map(Number);

    const table=document.createElement("table");
    const row=document.createElement("tr");

    for(let i=0;i<newArr.length;i++){
      const td=document.createElement("td");
      if(sameFamily(oldArr[i],newArr[i])){
        td.className="green";
        td.innerText=newArr[i];
      }else{
        td.className="red";
        td.innerText=newArr[i]+" ❌";
      }
      row.appendChild(td);
    }
    table.appendChild(row);
    result.appendChild(table);

    const canvas=document.createElement("canvas");
    canvas.width=80*newArr.length;
    canvas.height=70;
    const ctx=canvas.getContext("2d");

    let x=40,y=35,dir=1;
    for(let i=0;i<newArr.length-1;i++){
      if(sameFamily(oldArr[i],newArr[i])){
        ctx.strokeStyle="green";
        ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(x,y);
        y=y+(dir*15);
        ctx.lineTo(x+70,y);
        ctx.stroke();
        dir*=-1;
      }else{
        ctx.strokeStyle="red";
        ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(x-10,y-15);
        ctx.lineTo(x+10,y+15);
        ctx.moveTo(x-10,y+15);
        ctx.lineTo(x+10,y-15);
        ctx.stroke();
      }
      x+=70;
    }
    result.appendChild(canvas);
  }
}

/* SAVE HISTORY */
function saveHistory(){
  const entry={
    old:oldData.value,
    new:newData.value,
    time:new Date().toLocaleString()
  };
  let h=JSON.parse(localStorage.getItem("patternHistory")||"[]");
  h.push(entry);
  localStorage.setItem("patternHistory",JSON.stringify(h));
  loadHistory();
}

/* LOAD HISTORY */
function loadHistory(){
  const list=document.getElementById("historyList");
  list.innerHTML="";
  let h=JSON.parse(localStorage.getItem("patternHistory")||"[]");
  h.forEach(e=>{
    const li=document.createElement("li");
    li.innerText=e.time+" | OLD: "+e.old.replace(/\n/g," / ")+" | NEW: "+e.new.replace(/\n/g," / ");
    list.appendChild(li);
  });
}

/* DOWNLOAD IMAGE */
function downloadImage(){
  html2canvas(document.body).then(canvas=>{
    const link=document.createElement("a");
    link.download="pattern-analysis.png";
    link.href=canvas.toDataURL();
    link.click();
  });
}

loadHistory();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
</html>
