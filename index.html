<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kings of Matka AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- XLSX LIB -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#020617;color:#fff}
.hidden{display:none}
h2{text-align:center}
#home{display:flex;height:100vh;background:url("https://images.unsplash.com/photo-1519681393784-d120267933ba") center/cover}
.overlay{display:flex;width:100%;background:rgba(0,0,0,.75)}
.left{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px}
.left h1{color:#38bdf8;font-size:36px}
.right{flex:1;display:flex;align-items:center;justify-content:center}
.login{background:#020617;padding:30px;width:320px;border-radius:8px}
.login input{width:100%;padding:10px;margin-bottom:12px}
.login button{width:100%;padding:10px;background:#38bdf8;border:none}
.error{color:red;text-align:center}

#dashboard{min-height:100vh}
.header{text-align:center;padding:15px;border-bottom:1px solid #1e293b}
.container{max-width:1000px;margin:auto;padding:20px}
.card{background:#111827;padding:20px;border-radius:8px;margin-bottom:20px}
textarea{width:100%;height:70px;padding:8px}
.drop{
  border:2px dashed #38bdf8;
  padding:30px;
  text-align:center;
  cursor:pointer;
}
select,button{width:100%;padding:10px;margin-top:10px}
.run{background:#22c55e;border:none}
.logout{background:#dc2626;border:none}
table{margin:15px auto;border-collapse:collapse;background:#fff;color:#000}
td{border:1px solid #000;padding:8px;min-width:55px;text-align:center;font-weight:bold}
.green{background:#90ee90}
.red{background:#f08080}
canvas{display:block;margin:5px auto 20px}
</style>
</head>

<body>

<!-- HOME -->
<div id="home">
  <div class="overlay">
    <div class="left">
      <h1>Welcome to the world of<br><b>The Kings of Matka</b><br><br>AI Generate_Perfect Gussing</h1>
    </div>
    <div class="right">
      <div class="login">
        <h2>Login</h2>
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div id="error" class="error"></div>
      </div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
  <div class="header">Kings of Matka – AI Dashboard</div>

  <div class="container">

    <!-- EXCEL UPLOAD -->
    <div class="card">
      <h3>Upload Excel (.xlsx)</h3>
      <div class="drop" id="dropBox">Drag & Drop Excel Here<br>OR Click</div>
      <input type="file" id="excelFile" accept=".xlsx" hidden>

      <label>Select Sheet</label>
      <select id="sheetSelect"></select>

      <label>Date Column</label>
      <select id="dateColumn"></select>

      <button onclick="loadSheet()">Load Old Record</button>
    </div>

    <!-- DATA -->
    <div class="card">
      <h3>Old Records (Auto)</h3>
      <textarea id="oldData"></textarea>

      <h3>New Records</h3>
      <textarea id="newData">31,16,61,10</textarea>

      <button class="run" onclick="analyze()">Run Analysis</button>
    </div>

    <div id="result"></div>

    <button class="logout" onclick="logout()">Logout</button>
  </div>
</div>

<script>
const PASSWORD="1234";
let workbook=null, sheetData=null;

function login(){
  if(password.value===PASSWORD){
    home.style.display="none";
    dashboard.classList.remove("hidden");
  }else error.innerText="Wrong password";
}
function logout(){
  dashboard.classList.add("hidden");
  home.style.display="flex";
}

/* DRAG & DROP */
dropBox.onclick=()=>excelFile.click();
dropBox.ondragover=e=>{e.preventDefault();dropBox.style.background="#020617"}
dropBox.ondrop=e=>{
  e.preventDefault();
  handleExcel(e.dataTransfer.files[0]);
}
excelFile.onchange=e=>handleExcel(e.target.files[0]);

function handleExcel(file){
  const reader=new FileReader();
  reader.onload=e=>{
    workbook=XLSX.read(e.target.result,{type:"binary"});
    sheetSelect.innerHTML="";
    workbook.SheetNames.forEach(s=>{
      sheetSelect.innerHTML+=`<option>${s}</option>`;
    });
  };
  reader.readAsBinaryString(file);
}

/* LOAD SHEET */
function loadSheet(){
  const sheet=workbook.Sheets[sheetSelect.value];
  sheetData=XLSX.utils.sheet_to_json(sheet,{header:1});

  const headers=sheetData[0];
  dateColumn.innerHTML="";
  headers.forEach((h,i)=>{
    dateColumn.innerHTML+=`<option value="${i}">${h}</option>`;
  });

  // auto-fill records
  let out="";
  for(let i=1;i<sheetData.length;i++){
    const row=sheetData[i].slice(1).join(",");
    if(row) out+=row+"\n";
  }
  oldData.value=out.trim();
}

/* ANALYSIS */
function sameFamily(a,b){return Math.abs(a-b)%5===0}

function analyze(){
  const oldLines=oldData.value.trim().split("\n");
  const newLines=newData.value.trim().split("\n");
  result.innerHTML="";

  for(let r=0;r<newLines.length;r++){
    const o=oldLines[r].split(",").map(Number);
    const n=newLines[r].split(",").map(Number);

    const table=document.createElement("table");
    const tr=document.createElement("tr");

    for(let i=0;i<n.length;i++){
      const td=document.createElement("td");
      if(sameFamily(o[i],n[i])){td.className="green";td.innerText=n[i]}
      else{td.className="red";td.innerText=n[i]+" ❌"}
      tr.appendChild(td);
    }
    table.appendChild(tr);
    result.appendChild(table);

    const c=document.createElement("canvas");
    c.width=80*n.length;c.height=60;
    const ctx=c.getContext("2d");
    let x=40,y=30,d=1;
    for(let i=0;i<n.length-1;i++){
      if(sameFamily(o[i],n[i])){
        ctx.strokeStyle="green";ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(x,y);y+=d*12;ctx.lineTo(x+70,y);ctx.stroke();d*=-1;
      }else{
        ctx.strokeStyle="red";ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(x-8,y-12);ctx.lineTo(x+8,y+12);
        ctx.moveTo(x-8,y+12);ctx.lineTo(x+8,y-12);
        ctx.stroke();
      }
      x+=70;
    }
    result.appendChild(c);
  }
}
</script>

</body>
</html>
