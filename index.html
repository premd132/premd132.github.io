<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kings of Matka AI – Final Cross Chart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- XLSX + HTML2CANVAS -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#020617;color:#fff}
.hidden{display:none}
h2{text-align:center}

#home{display:flex;height:100vh;background:url("https://images.unsplash.com/photo-1519681393784-d120267933ba") center/cover}
.overlay{display:flex;width:100%;background:rgba(0,0,0,.75)}
.left{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px}
.left h1{color:#38bdf8;font-size:36px}
.right{flex:1;display:flex;align-items:center;justify-content:center}
.login{background:#020617;padding:30px;width:320px;border-radius:8px}
.login input{width:100%;padding:10px;margin-bottom:12px}
.login button{width:100%;padding:10px;background:#38bdf8;border:none}
.error{color:red;text-align:center}

#dashboard{min-height:100vh}
.header{text-align:center;padding:15px;border-bottom:1px solid #1e293b}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:#111827;padding:20px;border-radius:8px;margin-bottom:20px}

.drop{border:2px dashed #38bdf8;padding:30px;text-align:center;cursor:pointer}
textarea{width:100%;height:80px;padding:8px;margin-top:10px}
select,button{width:100%;padding:10px;margin-top:10px}
.run{background:#22c55e;border:none}
.logout{background:#dc2626;border:none}
.download{background:#2563eb;border:none}

table{margin:10px auto;border-collapse:collapse;background:#fff;color:#000}
td{
  border:1px solid #000;
  width:55px;
  height:45px;
  text-align:center;
  font-weight:bold;
  position:relative;
}

/* VISUAL RULES */
.line::after{
  content:"╲";
  color:green;
  font-size:28px;
  position:absolute;
  top:5px;left:18px;
}
.cross::after{
  content:"❌";
  color:red;
  font-size:22px;
}
.doublecross{
  background:#7f1d1d;
  color:#fff;
}
.doublecross::after{
  content:"❌❌";
  font-size:18px;
}
.fresh{
  background:#1e40af;
  color:#fff;
}
.fresh::after{
  content:"▶";
  position:absolute;
  right:2px;
  bottom:2px;
  font-size:16px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home">
  <div class="overlay">
    <div class="left">
      <h1>
        Welcome to the world of<br>
        <b>The Kings of Matka</b><br><br>
        AI Generate_Perfect Gussing
      </h1>
    </div>
    <div class="right">
      <div class="login">
        <h2>Login</h2>
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div id="error" class="error"></div>
      </div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
  <div class="header">Kings of Matka – FINAL STRICT CROSS CHART</div>

  <div class="container" id="captureArea">

    <div class="card">
      <h3>Upload Excel (.xlsx)</h3>
      <div class="drop" id="dropBox">Drag & Drop Excel Here OR Click</div>
      <input type="file" id="excelFile" accept=".xlsx" hidden>

      <label>Sheet</label>
      <select id="sheetSelect"></select>

      <button onclick="loadSheet()">Load Old Record</button>
    </div>

    <div class="card">
      <h3>Old Records</h3>
      <textarea id="oldData"></textarea>

      <h3>New Records</h3>
      <textarea id="newData">31,16,61,10</textarea>

      <button class="run" onclick="analyze()">Generate Cross Chart</button>
      <button class="download" onclick="downloadImage()">Download Chart Image</button>
    </div>

    <div id="result"></div>
  </div>

  <button class="logout" onclick="logout()">Logout</button>
</div>

<script>
const PASSWORD="1234";
let workbook=null;

/* LOGIN */
function login(){
  if(password.value===PASSWORD){
    home.style.display="none";
    dashboard.classList.remove("hidden");
  }else error.innerText="Wrong password";
}
function logout(){
  dashboard.classList.add("hidden");
  home.style.display="flex";
}

/* DRAG DROP */
dropBox.onclick=()=>excelFile.click();
dropBox.ondragover=e=>e.preventDefault();
dropBox.ondrop=e=>{
  e.preventDefault();
  handleExcel(e.dataTransfer.files[0]);
};
excelFile.onchange=e=>handleExcel(e.target.files[0]);

function handleExcel(file){
  const r=new FileReader();
  r.onload=e=>{
    workbook=XLSX.read(e.target.result,{type:"binary"});
    sheetSelect.innerHTML="";
    workbook.SheetNames.forEach(s=>{
      sheetSelect.innerHTML+=`<option>${s}</option>`;
    });
  };
  r.readAsBinaryString(file);
}

function loadSheet(){
  const sheet=workbook.Sheets[sheetSelect.value];
  const data=XLSX.utils.sheet_to_json(sheet,{header:1});
  let out="";
  for(let i=1;i<data.length;i++){
    out+=data[i].slice(1).join(",")+"\n";
  }
  oldData.value=out.trim();
}

/* FAMILY RULE */
function sameFamily(a,b){return Math.abs(a-b)%5===0}

/* STRICT ANALYSIS */
function analyze(){
  const oldLines=oldData.value.trim().split("\n");
  const newLines=newData.value.trim().split("\n");
  result.innerHTML="";

  for(let r=0;r<newLines.length;r++){
    const o=oldLines[r].split(",").map(Number);
    const n=newLines[r].split(",").map(Number);

    let crossCount=0;
    let lineAlive=true;

    const table=document.createElement("table");
    const tr=document.createElement("tr");

    for(let i=0;i<n.length;i++){
      const td=document.createElement("td");

      if(lineAlive && sameFamily(o[i],n[i])){
        if(crossCount>=2){
          td.classList.add("fresh"); // fresh line start
          crossCount=0;
          lineAlive=true;
        }else{
          td.classList.add("line");
        }
        crossCount=0;
      }else{
        crossCount++;
        if(crossCount===1){
          td.classList.add("cross");
        }else{
          td.classList.add("doublecross"); // danger zone
          lineAlive=false;
        }
      }
      td.innerText=n[i];
      tr.appendChild(td);
    }

    table.appendChild(tr);
    result.appendChild(table);
  }
}

/* DOWNLOAD IMAGE */
function downloadImage(){
  html2canvas(document.getElementById("captureArea")).then(canvas=>{
    const link=document.createElement("a");
    link.download="final-cross-chart.png";
    link.href=canvas.toDataURL();
    link.click();
  });
}
</script>

</body>
</html>
