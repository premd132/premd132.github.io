<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jodi Chart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:10px}
h2{text-align:center;background:#111827;color:#fff;padding:10px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid #000;padding:6px;text-align:center;font-size:14px}
th{background:#e5e7eb}
.highlight{background:#dcfce7;font-weight:bold}
.upload{border:2px dashed #2563eb;padding:10px;text-align:center;margin-bottom:10px}
</style>
</head>

<body>

<h2>Jodi Chart (dpboss Style)</h2>

<div class="upload">
Upload Excel (Date | Jodi)<br>
<input type="file" id="file" accept=".xlsx">
</div>

<table id="chartTable"></table>

<script>
document.getElementById("file").addEventListener("change", e=>{
  const reader=new FileReader();
  reader.onload=ev=>{
    const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
    const sheet=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(sheet,{header:1});
    buildChart(rows);
  };
  reader.readAsArrayBuffer(e.target.files[0]);
});

function buildChart(rows){
  const data=[];
  rows.forEach(r=>{
    if(r[1] && !isNaN(r[1])) data.push(r[1].toString().padStart(2,'0'));
  });

  let html="<tr><th>Date</th>";
  for(let i=0;i<=9;i++) html+=`<th>${i}</th>`;
  html+="</tr>";

  data.slice(-30).forEach((jodi,i)=>{
    html+=`<tr><th>D${i+1}</th>`;
    for(let d=0;d<=9;d++){
      const cell=(jodi[0]==d.toString()||jodi[1]==d.toString())?`<td class="highlight">${jodi}</td>`:"<td></td>";
      html+=cell;
    }
    html+="</tr>";
  });

  document.getElementById("chartTable").innerHTML=html;
}
</script>

</body>
</html>
