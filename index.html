<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pattern Engine (Final)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>📊 Pattern Engine (Final)</h2>

<div class="top-bar">
  <button onclick="toggleEdit()">Edit Mode</button>
  <input type="file" id="csv">
  <button onclick="addRow()">+ Add Row</button>
  <button onclick="setMode('basic')">Basic</button>
  <button onclick="setMode('family')">Family</button>
  <button onclick="setMode('photo')">Photo</button>
  <button onclick="setMode('hp80')">HP-80</button>
  <button onclick="clearGrid()">Clear</button>
</div>

<div class="wrap">
  <table id="grid"></table>

  <div id="panel">
    <b>Mode:</b> <span id="modeLabel">BASIC</span><br><br>
    👉 Blank cell पर click = analysis  
    ✏️ Double tap = edit
  </div>
</div>

<canvas id="cv"></canvas>

<script src="engine.js"></script>
<script src="pattern_engine_basic.js"></script>
<script src="pattern_engine_family.js"></script>
<script src="pattern_engine_photo.js"></script>
<script src="pattern_engine_hp80.js"></script>

</body>
</html>
