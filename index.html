<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Matka Result Chart Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Arial;background:#eef2f7}
header{background:#111827;color:#fff;padding:12px;text-align:center;font-size:20px}
.market{background:#fff;margin:10px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.market h3{margin:0;padding:10px;background:#1f2933;color:#fff;border-radius:6px 6px 0 0}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #cbd5e1;padding:6px;text-align:center;font-size:14px}
th{background:#f8fafc}
.tabs{display:flex}
.tabs button{flex:1;padding:8px;border:none;background:#e5e7eb}
.tabs button.active{background:#2563eb;color:#fff}
.section{display:none;padding:10px}
.section.active{display:block}
input{width:100%;padding:6px;margin:6px 0}
canvas{background:#fff;margin-top:10px}
</style>
</head>

<body>

<header>Matka Result & Chart</header>

<div class="market">
<h3>Kalyan Night</h3>

<div class="tabs">
<button class="active" onclick="tab(this,'jodi1')">Jodi Chart</button>
<button onclick="tab(this,'panel1')">Panel Chart</button>
<button onclick="tab(this,'trend1')">Trend</button>
</div>

<div id="jodi1" class="section active">
<input placeholder="Jodi numbers (12,34,56,78)" id="jodiInput1">
<button onclick="render('jodiInput1','jodiTable1')">Show</button>
<table id="jodiTable1"></table>
</div>

<div id="panel1" class="section">
<input placeholder="Panel (123,456,789)" id="panelInput1">
<button onclick="render('panelInput1','panelTable1')">Show</button>
<table id="panelTable1"></table>
</div>

<div id="trend1" class="section">
<canvas id="chart1"></canvas>
</div>

</div>

<script>
function tab(btn,id){
  const box=btn.parentElement.parentElement;
  box.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  box.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function render(input,table){
  const data=document.getElementById(input).value.split(",");
  let html="<tr>";
  data.forEach(d=>html+="<td>"+d.trim()+"</td>");
  html+="</tr>";
  document.getElementById(table).innerHTML=html;
  drawChart(data.map(d=>parseInt(d)));
}

let chart;
function drawChart(data){
  if(chart)chart.destroy();
  chart=new Chart(document.getElementById("chart1"),{
    type:"line",
    data:{
      labels:data.map((_,i)=>i+1),
      datasets:[{
        label:"Trend",
        data,
        borderColor:"#2563eb",
        fill:false
      }]
    },
    options:{responsive:true}
  });
}
</script>

</body>
</html>
