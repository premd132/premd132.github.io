<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Result Chart Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f1f5f9;color:#000}
header{background:#0f172a;color:#fff;padding:12px;text-align:center;font-size:20px}
nav{display:flex;background:#020617}
nav button{flex:1;padding:10px;border:none;background:#020617;color:#fff}
nav button.active{background:#2563eb}
.section{display:none;padding:10px}
.section.active{display:block}
table{width:100%;border-collapse:collapse;margin-top:10px;background:#fff}
th,td{border:1px solid #cbd5e1;padding:6px;text-align:center;font-size:14px}
.drop{border:2px dashed #2563eb;padding:15px;text-align:center;margin-top:10px}
canvas{background:#fff;margin-top:15px}
h3{margin:10px 0}
</style>
</head>

<body>

<header>Result & Chart Dashboard</header>

<nav>
<button class="active" onclick="showTab('jodi')">Jodi Chart</button>
<button onclick="showTab('panel')">Panel Chart</button>
<button onclick="showTab('trend')">Trend</button>
</nav>

<!-- JODI -->
<div class="section active" id="jodi">
<h3>Jodi Chart</h3>
<input type="text" id="jodiInput" placeholder="Ex: 12,34,56,78" style="width:100%;padding:6px">
<button onclick="renderTable('jodiInput','jodiTable')">Show</button>
<table id="jodiTable"></table>
</div>

<!-- PANEL -->
<div class="section" id="panel">
<h3>Panel Chart</h3>
<input type="text" id="panelInput" placeholder="Ex: 123,456,789" style="width:100%;padding:6px">
<button onclick="renderTable('panelInput','panelTable')">Show</button>
<table id="panelTable"></table>
</div>

<!-- TREND -->
<div class="section" id="trend">
<h3>Trend Graph</h3>
<div class="drop">
Upload Excel (.xlsx)
<input type="file" id="file" accept=".xlsx">
</div>
<canvas id="chart"></canvas>
</div>

<script>
function showTab(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
document.getElementById(id).classList.add('active');
event.target.classList.add('active');
}

function renderTable(input,tableId){
const data=document.getElementById(input).value.split(",");
let html="<tr>";
data.forEach(d=>html+="<td>"+d.trim()+"</td>");
html+="</tr>";
document.getElementById(tableId).innerHTML=html;
}

let chart;
document.getElementById("file").addEventListener("change",e=>{
const reader=new FileReader();
reader.onload=ev=>{
const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
const sheet=wb.Sheets[wb.SheetNames[0]];
const rows=XLSX.utils.sheet_to_json(sheet,{header:1});
const nums=[];
rows.forEach(r=>r.forEach(c=>{if(!isNaN(c))nums.push(c)}));
drawChart(nums);
};
reader.readAsArrayBuffer(e.target.files[0]);
});

function drawChart(data){
if(chart)chart.destroy();
chart=new Chart(document.getElementById("chart"),{
type:"line",
data:{labels:data.map((_,i)=>i+1),
datasets:[{data,borderColor:"#2563eb",fill:false}]},
options:{responsive:true}
});
}
</script>

</body>
</html>
