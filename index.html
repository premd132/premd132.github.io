<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jodi Analyzer – PRO MAX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f1f5f9;color:#000}
h2{text-align:center;margin:10px}
textarea{width:96%;height:130px;margin:10px;padding:10px}

.topbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px}
.topbar button{
  padding:8px 14px;border:none;border-radius:6px;
  background:#1e40af;color:#fff;cursor:pointer
}
.topbar button.active{background:#16a34a}

.panel{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px}

#bubbleWrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px}
.bubble{
  border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:bold;
  cursor:pointer;position:relative
}
.bubble:hover::after{
  content:attr(data-tip);
  position:absolute;bottom:-28px;
  background:#000;color:#fff;
  padding:4px 6px;font-size:12px;border-radius:4px;
}

table{border-collapse:collapse;margin:20px auto;position:relative;z-index:2}
td{
  border:1px solid #000;width:58px;height:42px;
  text-align:center;font-weight:bold;position:relative
}
.selected{border:3px solid #2563eb;background:#dbeafe}
.match{border:3px solid #16a34a;background:#dcfce7}

svg{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;z-index:1
}

.list{max-width:360px;margin:10px auto}
.list div{
  display:flex;justify-content:space-between;
  background:#e5e7eb;margin:4px 0;padding:6px;border-radius:4px
}
</style>
</head>

<body>

<h2>👑 Jodi Analyzer – PRO MAX</h2>

<textarea id="record">
27/10/25 59 44 59 42 90
03/11/25 55 02 93 00 05
10/11/25 91 10 84 20 84
17/11/25 52 96 53 11 70
24/11/25 91 07 67 79 09
01/12/25 78 52 12 72 64
08/12/25 16 43 78 91 27
15/12/25 64 30 97 55 97
22/12/25 33 38 53 32 84
</textarea>

<div class="topbar">
  <button onclick="setMode('normal')" class="active">Normal</button>
  <button onclick="setMode('second')">2nd Touch</button>
  <button onclick="setMode('third')">3rd Touch</button>
  <button onclick="setMode('combo')">Combo</button>
</div>

<div class="panel">
  <input id="patternInput" placeholder="Pattern: 4,5,6,7">
  <input id="diffInput" type="number" placeholder="Total Difference">
</div>

<div id="bubbleWrap"></div>

<h3 style="text-align:center">Check Line</h3>
<div id="checkList" class="list"></div>

<div style="position:relative">
  <svg id="lines"></svg>
  <div id="tableWrap"></div>
</div>

<script>
let rows=[],dates=[],cells=[],current=null,mode="normal";

function parse(){
  rows=[];dates=[];
  record.value.trim().split("\n").forEach(r=>{
    const p=r.split(/\s+/);
    dates.push(p[0]);
    rows.push(p.slice(1).map(Number));
  });
}

function buildBubbles(){
  const freq={};
  rows.flat().forEach(n=>freq[n]=(freq[n]||0)+1);

  const sorted=Object.keys(freq).sort((a,b)=>freq[b]-freq[a]);
  bubbleWrap.innerHTML="";

  sorted.forEach(k=>{
    const size=36+freq[k]*10;
    const b=document.createElement("div");
    b.className="bubble";
    b.style.width=b.style.height=size+"px";
    b.style.background=`hsl(${k*4},70%,50%)`;
    b.innerText=k;
    b.dataset.tip=`Value: ${k}, Occurrences: ${freq[k]}`;
    b.onclick=()=>selectJodi(Number(k));
    bubbleWrap.appendChild(b);
  });
}

function buildTable(){
  tableWrap.innerHTML="";cells=[];
  const t=document.createElement("table");
  rows.forEach((r,ri)=>{
    const tr=document.createElement("tr");
    r.forEach((n,ci)=>{
      const td=document.createElement("td");
      td.innerText=n;
      cells.push({td,ri,ci,val:n});
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  tableWrap.appendChild(t);
}

function buildCheckLine(){
  checkList.innerHTML="";
  if(current===null) return;
  for(let i=25;i<=39;i++){
    const row=`${current}-${i}-${(i*2)%100}`;
    const d=document.createElement("div");
    d.innerHTML=`<span>${row}</span><button onclick="selectJodi(${current})">Check Line</button>`;
    checkList.appendChild(d);
  }
}

function setMode(m){
  mode=m;
  document.querySelectorAll(".topbar button").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");
  draw();
}

function selectJodi(j){
  current=j;
  buildCheckLine();
  draw();
}

function draw(){
  document.querySelectorAll("td").forEach(td=>td.className="");
  lines.innerHTML="";
  if(current===null) return;

  let hits=cells.filter(c=>c.val===current);

  if(mode==="second") hits=hits.slice(1,2);
  if(mode==="third") hits=hits.slice(2,3);

  hits.forEach(h=>h.td.classList.add("selected"));

  for(let i=0;i<hits.length-1;i++){
    connect(hits[i].td,hits[i+1].td);
  }
}

function connect(a,b){
  const r1=a.getBoundingClientRect(), r2=b.getBoundingClientRect();
  const p=tableWrap.getBoundingClientRect();
  const x1=r1.left+r1.width/2-p.left;
  const y1=r1.top+r1.height/2-p.top;
  const x2=r2.left+r2.width/2-p.left;
  const y2=r2.top+r2.height/2-p.top;

  const path=document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",`M ${x1} ${y1} C ${x1+80} ${y1}, ${x2-80} ${y2}, ${x2} ${y2}`);
  path.setAttribute("stroke","#dc2626");
  path.setAttribute("fill","none");
  path.setAttribute("stroke-width","3");
  lines.appendChild(path);
}

parse();
buildBubbles();
buildTable();
</script>

</body>
</html>
