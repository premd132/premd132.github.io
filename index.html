<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kings of Matka AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial,sans-serif;background:#020617;color:#fff}
.hidden{display:none}
h2{text-align:center}

/* HOME */
#home{display:flex;height:100vh;background:url("https://images.unsplash.com/photo-1519681393784-d120267933ba") center/cover}
.overlay{display:flex;width:100%;background:rgba(0,0,0,.75)}
.left{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px}
.left h1{color:#38bdf8;font-size:36px}
.right{flex:1;display:flex;align-items:center;justify-content:center}
.login{background:#020617;padding:30px;width:320px;border-radius:8px}
.login input{width:100%;padding:10px;margin-bottom:12px}
.login button{width:100%;padding:10px;background:#38bdf8;border:none}
.error{color:red;text-align:center}

/* DASHBOARD */
#dashboard{min-height:100vh}
.header{text-align:center;padding:15px;border-bottom:1px solid #1e293b}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:#111827;padding:20px;border-radius:8px;margin-bottom:20px}
textarea{width:100%;height:70px;padding:8px}
input[type=file]{margin:10px 0}
button{width:100%;padding:10px;margin-top:8px;border:none;cursor:pointer}
.run{background:#22c55e}
.logout{background:#dc2626}
table{margin:15px auto;border-collapse:collapse;background:#fff;color:#000}
td{border:1px solid #000;padding:8px;min-width:55px;text-align:center;font-weight:bold}
.green{background:#90ee90}
.red{background:#f08080}
canvas{display:block;margin:5px auto 20px}
</style>
</head>

<body>

<!-- HOME -->
<div id="home">
  <div class="overlay">
    <div class="left">
      <h1>Welcome to the world of<br><b>The Kings of Matka</b><br><br>AI Generate_Perfect Gussing</h1>
    </div>
    <div class="right">
      <div class="login">
        <h2>Login</h2>
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div id="error" class="error"></div>
      </div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
  <div class="header">Kings of Matka – AI Dashboard</div>

  <div class="container">

    <div class="card">
      <h3>Upload Old Record (Excel / CSV)</h3>
      <input type="file" id="excelFile" accept=".csv">
      <p style="font-size:14px">
        Excel format: <br>
        <b>33,38,83,30</b><br>
        <b>49,16,71,07</b>
      </p>
      <button onclick="loadExcel()">Load Old Record</button>
    </div>

    <div class="card">
      <h3>Old Records</h3>
      <textarea id="oldData"></textarea>

      <h3>New Records</h3>
      <textarea id="newData">31,16,61,10</textarea>

      <button class="run" onclick="analyze()">Run Analysis</button>
    </div>

    <div id="result"></div>

    <button class="logout" onclick="logout()">Logout</button>
  </div>
</div>

<script>
/* PASSWORD */
const PASSWORD="1234";

/* LOGIN */
function login(){
  if(password.value===PASSWORD){
    home.style.display="none";
    dashboard.classList.remove("hidden");
  }else{error.innerText="Wrong password"}
}
function logout(){
  dashboard.classList.add("hidden");
  home.style.display="flex";
  password.value="";
}

/* LOAD EXCEL / CSV */
function loadExcel(){
  const file=document.getElementById("excelFile").files[0];
  if(!file){alert("File select karo");return;}
  const reader=new FileReader();
  reader.onload=function(e){
    oldData.value=e.target.result.trim();
  };
  reader.readAsText(file);
}

/* FAMILY RULE */
function sameFamily(a,b){return Math.abs(a-b)%5===0}

/* ANALYSIS */
function analyze(){
  const oldLines=oldData.value.trim().split("\n");
  const newLines=newData.value.trim().split("\n");
  result.innerHTML="";

  for(let r=0;r<newLines.length;r++){
    const oldArr=oldLines[r].split(",").map(Number);
    const newArr=newLines[r].split(",").map(Number);

    const table=document.createElement("table");
    const row=document.createElement("tr");

    for(let i=0;i<newArr.length;i++){
      const td=document.createElement("td");
      if(sameFamily(oldArr[i],newArr[i])){
        td.className="green";td.innerText=newArr[i];
      }else{
        td.className="red";td.innerText=newArr[i]+" ❌";
      }
      row.appendChild(td);
    }
    table.appendChild(row);
    result.appendChild(table);

    const canvas=document.createElement("canvas");
    canvas.width=80*newArr.length;
    canvas.height=60;
    const ctx=canvas.getContext("2d");
    let x=40,y=30,dir=1;

    for(let i=0;i<newArr.length-1;i++){
      if(sameFamily(oldArr[i],newArr[i])){
        ctx.strokeStyle="green";ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(x,y);
        y+=dir*12;ctx.lineTo(x+70,y);ctx.stroke();dir*=-1;
      }else{
        ctx.strokeStyle="red";ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(x-8,y-12);ctx.lineTo(x+8,y+12);
        ctx.moveTo(x-8,y+12);ctx.lineTo(x+8,y-12);
        ctx.stroke();
      }
      x+=70;
    }
    result.appendChild(canvas);
  }
}
</script>

</body>
</html>
