<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visual Pattern Analyzer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Visual AI Pattern Analyzer (Safe Mode)</h2>
<p class="subtitle">
  Chart par click karke 2–3 touch pattern dekho.  
  Family & Cut-Ank based auto line draw hoti hai.
</p>

<div class="top-bar">
  <input type="file" id="csvFile" accept=".csv">
  <button id="resetBtn">Reset</button>
</div>

<div class="container">
  <div class="chart-wrapper">
    <table id="chart"></table>
    <svg id="lineLayer"></svg>
  </div>

  <div class="side-panel">
    <h3>Detected Patterns</h3>
    <div id="patternList"></div>
  </div>
</div>

<div id="popup" class="popup hidden">
  <div class="popup-content">
    <h3>Pattern View</h3>
    <canvas id="popupCanvas" width="400" height="300"></canvas>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
