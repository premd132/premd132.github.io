<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pattern Engine – FINAL</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>📊 Pattern Engine – FINAL (Photo Style)</h2>

<div class="top-bar">

</div>

<script src="engine.js"></script>
<script src="patternEngine.js"></script>
</body>
