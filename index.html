<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pattern Analysis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<h2>Old vs New Pattern</h2>

<input id="oldInput" placeholder="33,38,83,30"><br><br>
<input id="newInput" placeholder="31,16,61,10"><br><br>

<button onclick="runAnalysis()">Check</button>

<table id="resultTable" border="1" cellpadding="10"></table>

<script>
function sameFamily(a, b) {
  return Math.abs(a - b) % 5 === 0;
}

function runAnalysis() {
  const oldArr = document.getElementById("oldInput").value.split(",").map(Number);
  const newArr = document.getElementById("newInput").value.split(",").map(Number);
  const table = document.getElementById("resultTable");
  table.innerHTML = "";

  const row = document.createElement("tr");

  for (let i = 0; i < newArr.length; i++) {
    const cell = document.createElement("td");
    if (sameFamily(oldArr[i], newArr[i])) {
      cell.style.background = "lightgreen";
      cell.innerText = newArr[i];
    } else {
      cell.style.background = "lightcoral";
      cell.innerText = newArr[i] + " ❌";
    }
    row.appendChild(cell);
  }
  table.appendChild(row);
}
</script>

</body>
</html>
