<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔮 Last Jodi Based AI Suggestion (FINAL)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f2d28b;
}
h2{text-align:center;margin:10px}
#top{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  padding:10px;
}
button{
  padding:6px 10px;
  font-weight:bold;
  cursor:pointer;
}
#wrap{
  display:flex;
  gap:10px;
  padding:10px;
}
#left{
  width:65%;
  background:#fff6cf;
  border:3px solid #000;
  overflow:auto;
  height:75vh;
}
#right{
  width:35%;
  background:#fff;
  border:3px solid #000;
  padding:10px;
  height:75vh;
  overflow:auto;
}
table{
  border-collapse:collapse;
  width:100%;
}
td,th{
  border:1px solid #999;
  padding:4px;
  text-align:center;
  font-weight:bold;
}
td[contenteditable]{
  background:#fffbe3;
}
.suggest{
  background:#eaffea;
  border-left:6px solid green;
  margin:6px 0;
  padding:6px;
}
.small{
  font-size:12px;
  color:#333;
}
</style>
</head>

<body>

<h2>🔮 Last Jodi Based AI Suggestion (FINAL)</h2>

<div id="top">
  <input type="file" id="csv">
  <button onclick="addRow()">➕ Add Row</button>
  <button onclick="analyze()">🔍 Analyze</button>
  <button onclick="clearAll()">🗑 Clear</button>
</div>

<div id="wrap">
  <div id="left">
    <table id="table"></table>
  </div>
  <div id="right">
    <b>AI Result</b>
    <div id="result" class="small">Upload record</div>
  </div>
</div>

<script>
/* ================= DATA ================= */
let grid=[];

/* ================= LOAD CSV ================= */
csv.onchange=e=>{
  let r=new FileReader();
  r.onload=()=>{
    localStorage.setItem("recordCSV",r.result);
    loadCSV(r.result);
  };
  r.readAsText(e.target.files[0]);
};

window.onload=()=>{
  let s=localStorage.getItem("recordCSV");
  if(s) loadCSV(s);
};

function loadCSV(txt){
  let rows=txt.trim().split("\n").map(r=>r.split(","));
  grid=rows;
  drawTable();
}

function drawTable(){
  let html="";
  grid.forEach((r,i)=>{
    html+="<tr>";
    r.forEach((v,j)=>{
      html+=`<td contenteditable onblur="editCell(${i},${j},this.innerText)">${v}</td>`;
    });
    html+="</tr>";
  });
  table.innerHTML=html;
}

function editCell(r,c,v){
  grid[r][c]=v.trim();
  save();
}

function addRow(){
  if(grid.length===0) return;
  grid.push(new Array(grid[0].length).fill(""));
  drawTable(); save();
}

function save(){
  let txt=grid.map(r=>r.join(",")).join("\n");
  localStorage.setItem("recordCSV",txt);
}

function clearAll(){
  if(!confirm("Clear all data?")) return;
  grid=[];
  table.innerHTML="";
  result.innerHTML="Upload record";
  localStorage.removeItem("recordCSV");
}

/* ================= CORE AI LOGIC ================= */

/* last valid 2-digit jodi */
function getLastValidJodi(){
  for(let r=grid.length-1;r>=0;r--){
    for(let c=grid[r].length-1;c>=0;c--){
      let v=String(grid[r][c]).trim();
      if(/^\d{2}$/.test(v)) return v;
    }
  }
  return null;
}

/* family of single digit */
function singleFamily(d){
  d=parseInt(d);
  return [
    d,
    (d+3)%10,
    (d+6)%10
  ];
}

/* ================= ANALYZE ================= */
function analyze(){
  if(grid.length===0){
    result.innerHTML="No data";
    return;
  }

  let last=getLastValidJodi();
  if(!last){
    result.innerHTML="No valid last jodi found";
    return;
  }

  let a=parseInt(last[0]);
  let b=parseInt(last[1]);

  /* collect nearby digits (up, left, right) */
  let digits=[a,b];

  grid.forEach(r=>{
    r.forEach(v=>{
      if(/^\d{2}$/.test(v)){
        let x=parseInt(v[0]),y=parseInt(v[1]);
        if(x===a||x===b||y===a||y===b){
          digits.push(x,y);
        }
      }
    });
  });

  /* frequency of digits */
  let freq={};
  digits.forEach(d=>freq[d]=(freq[d]||0)+1);

  /* top 3 single ank */
  let topSingles=Object.entries(freq)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,3)
    .map(x=>parseInt(x[0]));

  /* build 8 jodi max */
  let jodiSet=new Set();
  topSingles.forEach(d=>{
    singleFamily(d).forEach(x=>{
      jodiSet.add(`${d}${x}`);
      jodiSet.add(`${x}${d}`);
    });
  });

  let finalJodi=[...jodiSet].filter(j=>/^\d{2}$/.test(j)).slice(0,8);

  /* OUTPUT */
  let html=`<b>Last Jodi:</b> ${last}<br><br>`;
  html+=`<b>Top 3 Single Ank:</b> ${topSingles.join(", ")}<br><br>`;
  html+=`<b>Suggested Jodi (Only 8):</b><br>`;

  finalJodi.forEach(j=>{
    html+=`<div class="suggest">🔹 ${j}</div>`;
  });

  html+=`<hr><b>AI Logic:</b><br>
  Frequency + last jodi overlap + digit family mapping`;

  result.innerHTML=html;
}
</script>

</body>
</html>
