<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Visual Pattern Search</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#c9b27c;
}
table{
  border-collapse:collapse;
}
td{
  border:1px solid #2f4f2f;
  width:48px;
  height:38px;
  text-align:center;
  cursor:pointer;
  position:relative;
}
td.selected{
  outline:3px solid red;
  border-radius:50%;
}
#lineCanvas{
  position:absolute;
  top:0;
  left:0;
  pointer-events:none;
}
#rightPanel{
  position:fixed;
  right:0;
  top:0;
  width:220px;
  height:100%;
  background:#eee;
  overflow:auto;
  padding:10px;
}
.checkLine{
  background:#d9534f;
  color:#fff;
  padding:6px;
  margin-bottom:6px;
  cursor:pointer;
}
#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#fff;
  padding:12px;
  display:none;
  box-shadow:0 0 15px #000;
}
#popup table td{
  font-weight:bold;
  font-size:18px;
}
</style>
</head>

<body>

<h3>Jaise chart me drawing karo → wahi pattern record me search hoga</h3>

<input type="file" id="csvFile">

<div style="position:relative; display:inline-block;">
  <table id="chart"></table>
  <canvas id="lineCanvas"></canvas>
</div>

<div id="rightPanel">
  <h4>Pattern Check Lines</h4>
  <div id="checks"></div>
</div>

<div id="popup">
  <h4>Matched Pattern</h4>
  <div id="popupContent"></div>
  <button onclick="popup.style.display='none'">Close</button>
</div>

<script>
let data=[], clicks=[], matches=[];
const chart=document.getElementById('chart');
const canvas=document.getElementById('lineCanvas');
const ctx=canvas.getContext('2d');

document.getElementById('csvFile').onchange=e=>{
  const r=new FileReader();
  r.onload=()=>{
    data=r.result.trim().split('\n').map(r=>r.split(','));
    drawChart();
  };
  r.readAsText(e.target.files[0]);
};

function drawChart(){
  chart.innerHTML='';
  data.forEach((row,i)=>{
    const tr=document.createElement('tr');
    row.forEach((v,j)=>{
      const td=document.createElement('td');
      td.textContent=v;
      td.onclick=()=>cellClick(td,i,j);
      tr.appendChild(td);
    });
    chart.appendChild(tr);
  });
  canvas.width=chart.offsetWidth;
  canvas.height=chart.offsetHeight;
}

function cellClick(td,r,c){
  td.classList.add('selected');
  clicks.push({r,c});
  redrawLine();
  if(clicks.length>=2) searchPattern();
}

function redrawLine(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='green';
  ctx.lineWidth=2;
  ctx.beginPath();
  clicks.forEach((p,i)=>{
    const cell=chart.rows[p.r].cells[p.c];
    const x=cell.offsetLeft+cell.offsetWidth/2;
    const y=cell.offsetTop+cell.offsetHeight/2;
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  });
  ctx.stroke();
}

function searchPattern(){
  document.getElementById('checks').innerHTML='';
  matches=[];
  const gaps=[];
  for(let i=1;i<clicks.length;i++)
    gaps.push(clicks[i].r-clicks[i-1].r);

  for(let r=0;r<data.length;r++){
    let ok=true;
    for(let i=1;i<gaps.length;i++){
      if(!data[r+gaps[i]] || !data[r]){ ok=false; break;}
    }
    if(ok) matches.push(r);
  }

  matches.forEach((r,i)=>{
    const d=document.createElement('div');
    d.className='checkLine';
    d.textContent='Pattern '+(i+1)+' (Row '+r+')';
    d.onclick=()=>showPopup(r);
    checks.appendChild(d);
  });
}

function showPopup(baseRow){
  popup.style.display='block';
  let html='<table>';
  clicks.forEach(p=>{
    html+='<tr>';
    data[baseRow+p.r-clicks[0].r].forEach(v=>{
      html+='<td>'+v+'</td>';
    });
    html+='</tr>';
  });
  html+='</table>';
  popupContent.innerHTML=html;
}
</script>

</body>
</html>
