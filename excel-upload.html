<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Market Analysis – Cross Chart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#020617;color:#fff}
.header{text-align:center;padding:15px;border-bottom:1px solid #1e293b}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:#111827;padding:20px;border-radius:8px;margin-bottom:20px}
.drop{border:2px dashed #38bdf8;padding:30px;text-align:center;cursor:pointer}
textarea{width:100%;height:80px;padding:8px}
button{padding:10px;width:100%;margin-top:10px}
table{border-collapse:collapse;margin:10px auto;background:#fff;color:#000}
td{
  border:1px solid #000;
  width:55px;height:45px;
  text-align:center;
  font-weight:bold;
  position:relative;
}
.line::after{content:"╲";color:green;font-size:28px;position:absolute;left:18px;top:5px}
.cross::after{content:"❌";color:red;font-size:22px}
.doublecross{background:#7f1d1d;color:#fff}
.doublecross::after{content:"❌❌"}
</style>
</head>

<body>

<div class="header">STRICT CROSS CHART ANALYSIS</div>

<div class="container">

<div class="card">
  <div class="drop" onclick="file.click()">Upload Excel (.xlsx)</div>
  <input type="file" id="file" hidden accept=".xlsx">
</div>

<div class="card">
  <textarea id="oldData" placeholder="Old Record (auto from excel)"></textarea>
  <textarea id="newData" placeholder="New Record (comma separated)"></textarea>
  <button onclick="analyze()">Generate Cross Chart</button>
</div>

<div id="result"></div>

<button onclick="history.back()">⬅ Back</button>
</div>

<script>
file.onchange=e=>{
  const r=new FileReader();
  r.onload=x=>{
    const wb=XLSX.read(x.target.result,{type:"binary"});
    const sh=wb.Sheets[wb.SheetNames[0]];
    const d=XLSX.utils.sheet_to_json(sh,{header:1});
    let out="";
    for(let i=1;i<d.length;i++) out+=d[i].slice(1).join(",")+"\n";
    oldData.value=out.trim();
  };
  r.readAsBinaryString(e.target.files[0]);
};

function sameFamily(a,b){return Math.abs(a-b)%5===0}

function analyze(){
  result.innerHTML="";
  const o=oldData.value.trim().split("\n")[0].split(",").map(Number);
  const n=newData.value.trim().split(",").map(Number);

  let cross=0, alive=true;
  const table=document.createElement("table");
  const tr=document.createElement("tr");

  for(let i=0;i<n.length;i++){
    const td=document.createElement("td");
    if(alive && sameFamily(o[i],n[i])){
      td.classList.add("line"); cross=0;
    }else{
      cross++;
      if(cross===1) td.classList.add("cross");
      else{ td.classList.add("doublecross"); alive=false; }
    }
    td.innerText=n[i];
    tr.appendChild(td);
  }
  table.appendChild(tr);
  result.appendChild(table);
}
</script>

</body>
</html>
