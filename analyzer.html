<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔥 iSmart Analyzer – AI Photo Logic</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f4f4f4;margin:0;padding:10px}
h1{text-align:center}
textarea{width:100%;height:140px;font-family:monospace}
button{padding:10px;margin:4px;cursor:pointer}
.table-wrap{position:relative;overflow:auto;background:#fff}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #999;padding:6px;text-align:center;min-width:46px;cursor:pointer}
th{background:#111;color:#fff}
td.blank{background:#eee;color:#999}
td.mark{background:#ffe6e6;box-shadow:inset 0 0 0 2px red}
td.focus{box-shadow:inset 0 0 0 3px blue}
.vertical-line{position:absolute;top:0;bottom:0;width:4px;background:blue;cursor:pointer}
#popup{position:fixed;inset:5%;background:#fff;border:4px solid #000;display:none;z-index:9999;overflow:auto}
#popupHeader{background:#000;color:#fff;padding:10px;display:flex;justify-content:space-between}
#popupHeader button{background:red;color:#fff;border:none;padding:6px 10px}
.aiBox{background:#f0f8ff;border:2px dashed blue;margin:10px;padding:10px}
</style>
</head>

<body>

<h1>🔥 iSmart Analyzer (AI + Multi-Day)</h1>

<textarea id="dataInput" placeholder="Excel se copy-paste data"></textarea>

<button onclick="generate()">Generate</button>
<button onclick="addBlankRow()">Add Blank Row</button>
<button onclick="saveData()">Save</button>

<div class="table-wrap" id="wrap">
  <table id="chart"></table>
</div>

<div id="popup">
  <div id="popupHeader">
    <div id="popupTitle"></div>
    <button onclick="closePopup()">X</button>
  </div>
  <div id="popupContent"></div>
</div>

<script>
const days=["Mon","Tue","Wed","Thu","Fri","Sat"];
let grid=[];

function generate(){
  const raw=document.getElementById("dataInput").value.trim().split("\n");
  grid=[];
  raw.forEach(r=>{
    let row=r.trim().split(/\s+/);
    while(row.length<6) row.push("**");
    grid.push(row);
  });
  drawTable();
}

function drawTable(){
  const t=document.getElementById("chart");
  t.innerHTML="";
  document.querySelectorAll(".vertical-line").forEach(l=>l.remove());

  let tr=document.createElement("tr");
  days.forEach(d=>{
    let th=document.createElement("th");
    th.textContent=d;
    tr.appendChild(th);
  });
  t.appendChild(tr);

  grid.forEach((r,ri)=>{
    let tr=document.createElement("tr");
    r.forEach((v,ci)=>{
      let td=document.createElement("td");
      td.textContent=v;
      if(v==="**") td.classList.add("blank");
      td.onclick=()=>cellClick(ri,ci);
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
}

function addBlankRow(){
  grid.push(["**","**","**","**","**","**"]);
  drawTable();
}

function cellClick(r,c){
  clearMarks();
  if(grid[r][c]==="**"){
    blankSearch(r,c);
  }else{
    singlePopup(r,c);
  }
}

/* ---------------- MULTI DAY + AI ---------------- */

function blankSearch(row,col){
  let cols=[col];
  if(col>0) cols.push(col-1);
  if(col<5) cols.push(col+1);

  let freq={};
  cols.forEach(c=>{
    let pat=getPattern(row,c);
    pat.forEach(j=>{
      freq[j]=(freq[j]||0)+1;
    });
    searchPattern(pat,c);
  });

  showAISuggestion(freq,row,col);
}

function getPattern(r,c){
  let p=[];
  for(let i=r-1;i>=0 && p.length<10;i--){
    if(grid[i][c]!=="**") p.unshift(grid[i][c]);
  }
  for(let i=r+1;i<grid.length && p.length<10;i++){
    if(grid[i][c]!=="**") p.push(grid[i][c]);
  }
  return p;
}

function searchPattern(pat,col){
  for(let r=0;r<=grid.length-pat.length;r++){
    let ok=true;
    for(let k=0;k<pat.length;k++){
      if(grid[r+k][col]==="**") {ok=false;break;}
      if(!familyMatch(pat[k],grid[r+k][col])){ok=false;break;}
    }
    if(ok){
      markLine(r,col,pat.length);
    }
  }
}

function familyMatch(a,b){
  return a[0]===b[0] || a[1]===b[1] ||
         Math.abs(a[0]-a[1])===Math.abs(b[0]-b[1]);
}

function markLine(start,col,len){
  const wrap=document.getElementById("wrap");
  const t=document.getElementById("chart");
  for(let i=0;i<len;i++){
    t.rows[start+1+i].cells[col].classList.add("mark");
  }
  const top=t.rows[start+1].cells[col].getBoundingClientRect();
  const bottom=t.rows[start+len].cells[col].getBoundingClientRect();
  const base=wrap.getBoundingClientRect();
  let line=document.createElement("div");
  line.className="vertical-line";
  line.style.left=(top.left-base.left+top.width/2-2)+"px";
  line.style.top=(top.top-base.top)+"px";
  line.style.height=(bottom.bottom-top.top)+"px";
  wrap.appendChild(line);
}

function showAISuggestion(freq,row,col){
  let arr=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,4);
  let box=document.createElement("div");
  box.className="aiBox";
  box.innerHTML="<b>🤖 AI Strong Jodi Suggestion</b><br>"+arr.map(a=>"🔹 "+a[0]).join(" ");
  openPopup("AI + Multi-Day | "+days[col],box);
}

function singlePopup(r,c){
  let t=document.getElementById("chart").cloneNode(true);
  t.rows[r+1].cells[c].classList.add("focus");
  openPopup("Jodi "+grid[r][c]+" | "+days[c],t);
}

/* ---------------- POPUP ---------------- */

function openPopup(title,content){
  document.getElementById("popupTitle").textContent=title;
  const box=document.getElementById("popupContent");
  box.innerHTML="";
  box.appendChild(content);
  document.getElementById("popup").style.display="block";
}
function closePopup(){document.getElementById("popup").style.display="none"}
function clearMarks(){
  document.querySelectorAll("td").forEach(td=>td.classList.remove("mark","focus"));
  document.querySelectorAll(".vertical-line").forEach(l=>l.remove());
}

function saveData(){
  localStorage.setItem("ismartAI",document.getElementById("dataInput").value);
  alert("Saved");
}

window.onload=()=>{
  let d=localStorage.getItem("ismartAI");
  if(d){document.getElementById("dataInput").value=d;generate();}
}
</script>

</body>
</html>
