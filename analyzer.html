<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Record Line Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ✅ Chart.js MUST -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  font-family:Arial;
  background:#f3f4f6;
  padding:15px;
}
.toggle-box{
  margin:10px 0;
  font-size:18px;
}
.chart-box{
  background:#fff;
  padding:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<h3>📊 Record Line Analyzer</h3>

<!-- REAL CLICKABLE CHECKBOX -->
<div class="toggle-box">
  <input type="checkbox" id="lineToggle" checked>
  <label for="lineToggle">Check Line</label>
</div>

<div class="chart-box">
  <canvas id="lineChart" height="280"></canvas>
</div>

<script>
const ctx = document.getElementById("lineChart").getContext("2d");

const chartData = {
  labels:['01','02','03','04','05','06','07','08','09','10'],
  datasets:[{
    label:'Daily Record',
    data:[12,22,15,30,25,40,35,28,45,32],
    borderColor:'blue',
    borderWidth:2,
    tension:0.4,
    fill:false
  }]
};

const lineChart = new Chart(ctx,{
  type:'line',
  data:chartData,
  options:{
    responsive:true,
    plugins:{
      legend:{display:true}
    }
  }
});

// Checkbox ON/OFF logic
document.getElementById("lineToggle").addEventListener("change",function(){
  lineChart.data.datasets[0].hidden = !this.checked;
  lineChart.update();
});
</script>

</body>
</html>
