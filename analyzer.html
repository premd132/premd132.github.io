<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🔥 Jodi Line Analyzer – FINAL</title>
<style>
body{font-family:Arial;background:#f7f7f7;padding:10px}
textarea{width:100%;height:120px}
table{border-collapse:collapse;margin-top:10px;background:#fff}
th,td{
 border:1px solid #999;
 padding:6px;
 text-align:center;
 font-size:14px;
 cursor:pointer;
 position:relative;
}
th{background:#eaeaea}
td:hover{background:#f1f1f1}

.hit{background:#ffeb3b}
.family{background:#b3e5fc}
.line{outline:3px solid red}

.box{margin-top:10px;padding:8px;border:1px solid #ccc;background:#fff}

.item{color:#0066cc;cursor:pointer;margin:3px 0}

#popup{
 position:fixed;top:0;left:0;width:100%;height:100%;
 background:rgba(0,0,0,.6);
 display:none;align-items:center;justify-content:center;
 z-index:9999;
}
#popupBox{
 background:#fff;padding:12px;width:95%;max-width:420px;
}
</style>
</head>

<body>

<h3>🔥 Jodi Line Analyzer – FINAL</h3>

<textarea id="input">
Mon Tue Wed Thu Fri Sat
52 96 53 11 70 82
91 97 67 79 09 87
78 52 12 72 64 17
16 43 78 91 27 30
64 30 97 55 97 39
33 38 53 32 84 82
</textarea>

<br><br>
<button onclick="build()">Generate Chart</button>

<div id="tableBox"></div>

<div class="box">
<b>📊 Line Count List</b>
<div id="list">Click any jodi</div>
</div>

<!-- POPUP -->
<div id="popup" onclick="closePop()">
  <div id="popupBox" onclick="event.stopPropagation()">
    <h4>📸 Line View (Photo-Style)</h4>
    <div id="popupData"></div>
    <br>
    <button onclick="closePop()">Close</button>
  </div>
</div>

<script>
const familyMap={1:6,6:1,2:7,7:2,3:8,8:3,4:9,9:4,5:0,0:5};
let GRID=[],DAYS=[],history=[];

function build(){
 history=[];
 document.getElementById("list").innerHTML="Click any jodi";

 let raw=document.getElementById("input").value.trim().split("\n");
 DAYS=raw[0].trim().split(/\s+/);
 GRID=raw.slice(1).map(r=>r.trim().split(/\s+/));

 let html="<table id='grid'><tr>";
 DAYS.forEach(d=>html+="<th>"+d+"</th>");
 html+="</tr>";

 GRID.forEach((r,i)=>{
  html+="<tr>";
  r.forEach((v,j)=>{
   html+=`<td onclick="analyze(${i},${j})">${v}</td>`;
  });
  html+="</tr>";
 });
 html+="</table>";
 document.getElementById("tableBox").innerHTML=html;
}

function clearMarks(){
 document.querySelectorAll("td").forEach(td=>{
  td.classList.remove("hit","family","line");
 });
}

function analyze(r,c){
 clearMarks();
 history=[];

 let base=GRID[r][c];
 let fam=familyMap[base];

 let table=document.getElementById("grid");
 table.rows[r+1].cells[c].classList.add("hit");

 // vertical + zigzag scan
 for(let i=0;i<GRID.length;i++){
  let v=GRID[i][c];
  let cell=table.rows[i+1].cells[c];

  if(v==base){
    cell.classList.add("line");
    history.push({type:"SAME",from:i,to:i+1,col:c});
  }
  if(v==fam){
    cell.classList.add("family");
    history.push({type:"FAMILY",from:i,to:i+1,col:c});
  }

  // zigzag right
  if(i+1<GRID.length && c+1<GRID[0].length){
    if(GRID[i][c]==base && GRID[i+1][c+1]==base){
      table.rows[i+2].cells[c+1].classList.add("line");
      history.push({type:"ZIGZAG ↘",from:i,to:i+1,col:c});
    }
  }
  // zigzag left
  if(i+1<GRID.length && c-1>=0){
    if(GRID[i][c]==base && GRID[i+1][c-1]==base){
      table.rows[i+2].cells[c-1].classList.add("line");
      history.push({type:"ZIGZAG ↙",from:i,to:i+1,col:c});
    }
  }
 }

 renderList(base,fam);
}

function renderList(base,fam){
 let out="";
 history.forEach((h,i)=>{
  out+=`<div class="item" onclick="openPop(${i},'${base}','${fam}')">
  ${h.type} | Row ${h.from+1}
  </div>`;
 });
 document.getElementById("list").innerHTML=out||"No pattern";
}

function openPop(i,base,fam){
 let h=history[i];
 document.getElementById("popupData").innerHTML=
 `<b>Jodi:</b> ${base}<br>
  <b>Family:</b> ${fam}<br>
  <b>Type:</b> ${h.type}<br>
  <b>Row:</b> ${h.from+1} → ${h.to+1}<br>
  <p style="color:red">Photo-style line highlighted on chart</p>`;
 document.getElementById("popup").style.display="flex";
}

function closePop(){
 document.getElementById("popup").style.display="none";
}
 // ===== TREND LINE PATCH (PASTE AT END) =====

// family group
function familyGroup(j){
  const map={0:5,5:0,1:6,6:1,2:7,7:2,3:8,8:3,4:9,9:4};
  let a=parseInt(j[0]), b=parseInt(j[1]);
  return new Set([
    j,
    ""+a+map[b],
    ""+map[a]+b,
    ""+map[a]+map[b]
  ]);
}

// trend directions
const TREND_DIRS = [
 {dr:0,dc:1,name:"→"},
 {dr:0,dc:-1,name:"←"},
 {dr:1,dc:0,name:"↓"},
 {dr:-1,dc:0,name:"↑"},
 {dr:1,dc:1,name:"↘"},
 {dr:1,dc:-1,name:"↙"},
 {dr:-1,dc:1,name:"↗"},
 {dr:-1,dc:-1,name:"↖"}
];

// detect trend from LAST jodi
function detectLastTrends(){
  let r=GRID.length-1;
  let c=GRID[0].length-1;
  let base=GRID[r][c];
  let fam=familyGroup(base);

  let trends=[];
  TREND_DIRS.forEach(d=>{
    let nr=r+d.dr, nc=c+d.dc;
    if(GRID[nr] && GRID[nr][nc]){
      if(fam.has(GRID[nr][nc])){
        trends.push({dir:d,family:fam});
      }
    }
  });
  return trends;
}

// search same trend in full record
function findSameTrends(){
  let trends=detectLastTrends();
  let found=[];
  trends.forEach(t=>{
    for(let r=0;r<GRID.length;r++){
      for(let c=0;c<GRID[0].length;c++){
        if(t.family.has(GRID[r][c])){
          let nr=r+t.dir.dr, nc=c+t.dir.dc;
          if(GRID[nr] && GRID[nr][nc]){
            if(t.family.has(GRID[nr][nc])){
              found.push({from:[r,c],to:[nr,nc],dir:t.dir.name});
            }
          }
        }
      }
    }
  });
  return found;
}

// ===== END PATCH =====
</script>

</body>
</html>
