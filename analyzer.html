<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Line After Result Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f4f6fb;margin:0;padding:10px}
h2{text-align:center}
.note{text-align:center;color:#dc2626;font-size:13px}
table{border-collapse:collapse;margin:auto}
td{border:1px solid #ccc;width:42px;height:32px;
text-align:center;font-weight:bold;cursor:pointer}
td.sel{background:#2563eb;color:#fff}
#after{max-width:420px;margin:15px auto}
.box{background:#e5e7eb;padding:8px;margin:6px 0;border-radius:6px;
display:flex;justify-content:space-between}
.bubble{display:inline-flex;align-items:center;justify-content:center;
border-radius:50%;width:42px;height:42px;color:#fff;font-weight:bold;margin:4px}
#bubbles{display:flex;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>

<h2 id="title"></h2>
<div class="note">Reference based on past record only</div>

<div id="bubbles"></div>
<div id="wrap"></div>

<h3 style="text-align:center">Is line ke baad past me aaya</h3>
<div id="after"></div>

<script>
// ===== LOAD GAME & RECORD =====
const game=localStorage.getItem("currentGame")||"kalyan";
title.innerText=game.replace("_"," ").toUpperCase();
const text=localStorage.getItem("record_"+game)||"";

// ===== PARSE =====
let rows=[];
text.split("\n").forEach(l=>{
 const p=l.trim().split(/\s+/);
 if(p.length>1) rows.push(p.slice(1).map(Number));
});

// ===== BUILD TABLE =====
const wrap=document.getElementById("wrap");
const table=document.createElement("table");
let cells=[];

rows.forEach((r,ri)=>{
 const tr=document.createElement("tr");
 r.forEach((n,ci)=>{
  const td=document.createElement("td");
  td.innerText=n;
  td.onclick=()=>selectLine(ri,ci);
  cells.push({td,val:n,row:ri,col:ci});
  tr.appendChild(td);
 });
 table.appendChild(tr);
});
wrap.appendChild(table);

// ===== BUBBLES (FREQUENCY) =====
const freq={};
rows.flat().forEach(n=>freq[n]=(freq[n]||0)+1);
const bubbleBox=document.getElementById("bubbles");

Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).forEach(k=>{
 const b=document.createElement("div");
 b.className="bubble";
 b.style.background=`hsl(${k*4},70%,50%)`;
 b.innerText=k+" ("+freq[k]+")";
 bubbleBox.appendChild(b);
});

// ===== SELECT LINE (2-length) =====
function selectLine(r,c){
 document.querySelectorAll("td").forEach(td=>td.classList.remove("sel"));
 const td=cells.find(x=>x.row===r&&x.col===c).td;
 td.classList.add("sel");

 if(c+1>=rows[r].length) return;
 const line=[rows[r][c],rows[r][c+1]];
 findAfter(line);
}

// ===== FIND AFTER RESULTS =====
function findAfter(line){
 const out={};
 for(let r=0;r<rows.length-1;r++){
  for(let c=0;c<rows[r].length-1;c++){
   if(rows[r][c]===line[0] && rows[r][c+1]===line[1]){
    const next=rows[r+1][c];
    out[next]=(out[next]||0)+1;
   }
  }
 }
 showAfter(out);
}

// ===== DISPLAY AFTER =====
function showAfter(obj){
 const after=document.getElementById("after");
 after.innerHTML="";
 Object.keys(obj).forEach(k=>{
  const d=document.createElement("div");
  d.className="box";
  d.innerHTML=`<span>${k}</span><span>${obj[k]} times</span>`;
  after.appendChild(d);
 });
}
</script>

</body>
</html>
