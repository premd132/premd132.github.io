<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSV Chart Pattern Analyzer</title>

<style>
body{font-family:Arial;background:#f3d8a8}
h2{text-align:center}
#top{text-align:center;padding:10px}
canvas{background:#fff;border:3px solid #000}
#layout{display:flex;gap:15px;padding:10px}
#right{width:35%;max-height:520px;overflow:auto}
.item{background:#fff;padding:8px;margin:6px;border-left:5px solid red;cursor:pointer}
.item:hover{background:#ffe2b3}
.jodiBtn{padding:6px 10px;margin:3px;border:none;background:#000;color:#fff;cursor:pointer}
.jodiBtn.active{background:red}
</style>
</head>

<body>

<h2>📊 CSV Chart + Multi Jodi Pattern Analyzer</h2>

<div id="top">
<input type="file" id="csvFile"><br><br>
<b>Select 2 / 3 / 4 Jodi</b><br>
<div id="jodiBox"></div>
<button onclick="analyze()">Analyze Pattern</button>
</div>

<div id="layout">
<canvas id="chart" width="700" height="520"></canvas>
<div id="right"><b>Pattern Check Line</b></div>
</div>

<script>
let headers=[],table=[];
let selected=[];
const cvs=document.getElementById("chart");
const ctx=cvs.getContext("2d");

document.getElementById("csvFile").onchange=e=>{
 const r=new FileReader();
 r.onload=()=>loadCSV(r.result);
 r.readAsText(e.target.files[0]);
};

function loadCSV(txt){
 let lines=txt.trim().split("\n");
 headers=lines.shift().split(",");
 table=lines.map(l=>l.split(","));
 drawChart();
 buildJodiButtons();
}

function drawChart(){
 ctx.clearRect(0,0,cvs.width,cvs.height);
 ctx.font="12px Arial";

 // headers
 headers.forEach((h,i)=>{
   ctx.fillText(h,90+i*90,20);
 });

 // grid + values
 table.forEach((row,r)=>{
   row.forEach((v,c)=>{
     let x=80+c*90;
     let y=40+r*30;
     ctx.strokeRect(x-30,y-15,60,25);
     ctx.fillText(v,x-8,y+5);
   });
 });
}

function buildJodiButtons(){
 let box=document.getElementById("jodiBox");
 box.innerHTML="";
 let set=new Set();
 table.flat().forEach(j=>set.add(j));

 set.forEach(j=>{
  let b=document.createElement("button");
  b.innerText=j;
  b.className="jodiBtn";
  b.onclick=()=>{
    if(selected.includes(j)){
      selected=selected.filter(x=>x!==j);
      b.classList.remove("active");
    }else if(selected.length<4){
      selected.push(j);
      b.classList.add("active");
    }
  };
  box.appendChild(b);
 });
}

function analyze(){
 drawChart();
 document.getElementById("right").innerHTML="<b>Pattern Check Line</b>";
 if(selected.length<2){alert("Minimum 2 jodi select karo");return;}

 let points=[];
 table.forEach((row,r)=>{
  row.forEach((v,c)=>{
    if(selected.includes(v)){
      let x=80+c*90;
      let y=40+r*30;
      points.push({x,y,val:v});
      circle(x,y,v);
    }
  });
 });

 if(points.length>1){
   line(points);
   addCheckLine();
 }
}

function circle(x,y,t){
 ctx.beginPath();
 ctx.arc(x,y,14,0,Math.PI*2);
 ctx.strokeStyle="red";
 ctx.lineWidth=2;
 ctx.stroke();
 ctx.fillText(t,x-7,y+4);
}

function line(p){
 ctx.beginPath();
 ctx.moveTo(p[0].x,p[0].y);
 p.forEach(n=>ctx.lineTo(n.x,n.y));
 ctx.strokeStyle="green";
 ctx.lineWidth=2;
 ctx.stroke();
}

function addCheckLine(){
 let d=document.createElement("div");
 d.className="item";
 d.innerHTML="Pattern → "+selected.join(" - ");
 d.onclick=exportImage;
 document.getElementById("right").appendChild(d);
}

function exportImage(){
 let a=document.createElement("a");
 a.download="pattern_chart.png";
 a.href=cvs.toDataURL();
 a.click();
}
</script>

</body>
</html>
