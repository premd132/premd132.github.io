<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🔥 iSmart Analyzer – REAL LINE LOGIC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#eee;margin:0}
h1{background:#111;color:#fff;text-align:center;margin:0;padding:8px}

textarea{width:100%;height:120px;font-family:monospace}
button,select{padding:6px;margin:4px}

table{border-collapse:collapse;width:100%;background:#fff}
th,td{
  border:1px solid #999;
  padding:6px;
  text-align:center;
  min-width:44px;
  cursor:pointer;
  user-select:none;
}
th{background:#222;color:#fff}

td.blank{background:#f0f0f0}
td.family{background:#ffe0e0}
td.main{outline:3px solid red}

#popup{
  position:fixed;inset:5%;
  background:#fff;
  border:4px solid #000;
  display:none;
  z-index:9999;
}
#ph{
  background:#000;color:#fff;padding:6px
}
#close{float:right;background:red;color:#fff;padding:4px 8px}

</style>
</head>

<body>

<h1>🔥 iSmart Analyzer – REAL PHOTO LINE</h1>

<textarea id="input" placeholder="Excel se copy paste"></textarea><br>
<button onclick="generate()">Generate</button>
<button onclick="save()">Save</button>

<br>
<select id="daySel"></select>
<input id="rowSel" type="number" placeholder="Row">
<button onclick="manualSearch()">Search</button>

<table id="chart"></table>

<div id="popup">
  <div id="ph">
    <span id="pt"></span>
    <span id="close" onclick="popup.style.display='none'">X</span>
  </div>
  <div id="pb"></div>
</div>

<script>
const days=["Mon","Tue","Wed","Thu","Fri","Sat"];
let grid=[];

function generate(){
  grid=[];
  let raw=input.value.trim().split("\n");
  raw.forEach(r=>{
    let row=r.split(/\s+/);
    while(row.length<6) row.push("**");
    grid.push(row);
  });
  for(let i=0;i<10;i++) grid.push(["**","**","**","**","**","**"]);
  draw();
  fillDay();
}

function draw(){
  chart.innerHTML="";
  let tr=document.createElement("tr");
  days.forEach(d=>{
    let th=document.createElement("th");
    th.textContent=d;
    tr.appendChild(th);
  });
  chart.appendChild(tr);

  grid.forEach((r,i)=>{
    let tr=document.createElement("tr");
    r.forEach((v,j)=>{
      let td=document.createElement("td");
      td.textContent=v;
      if(v==="**") td.classList.add("blank");

      td.onclick=()=>cellClick(i,j);
      td.ondblclick=()=>editCell(td,i,j);

      tr.appendChild(td);
    });
    chart.appendChild(tr);
  });
}

function editCell(td,r,c){
  let v=prompt("Edit jodi",grid[r][c]);
  if(v!==null){
    grid[r][c]=v;
    td.textContent=v;
  }
}

function family(j){
  if(j==="**") return [];
  let a=parseInt(j[0]),b=parseInt(j[1]);
  return [a,b,(a+b)%10,(a+9)%10,(b+9)%10];
}

function cellClick(r,c){
  clearMarks();
  if(grid[r][c]==="**"){
    blankSearch(r,c);
  }else{
    showPopup(r,c);
  }
}

function blankSearch(r,c){
  let base=[];
  for(let i=r-1;i>=0 && base.length<10;i--){
    if(grid[i][c]!=="**") base.push(grid[i][c]);
  }
  if(base.length<3){alert("Data kam");return;}

  for(let i=0;i<grid.length;i++){
    if(grid[i][c]==="**") continue;
    if(familyMatch(grid[i][c],base)){
      markLine(i,c);
    }
  }
}

function familyMatch(v,arr){
  let f=family(v);
  return arr.some(x=>family(x).some(n=>f.includes(n)));
}

function markLine(r,c){
  let td=chart.rows[r+1].cells[c];
  td.classList.add("family");
  td.onclick=()=>showPopup(r,c);
}

function showPopup(r,c){
  popup.style.display="block";
  pt.textContent=`Jodi ${grid[r][c]} | ${days[c]} | Row ${r+1}`;
  pb.innerHTML="";
  let t=document.createElement("table");
  for(let i=Math.max(0,r-5);i<=r+5;i++){
    if(!grid[i]) continue;
    let tr=document.createElement("tr");
    for(let j=0;j<6;j++){
      let td=document.createElement("td");
      td.textContent=grid[i][j];
      if(i===r && j===c) td.classList.add("main");
      if(family(grid[i][j]).some(x=>family(grid[r][c]).includes(x))){
        td.classList.add("family");
      }
      tr.appendChild(td);
    }
    t.appendChild(tr);
  }
  pb.appendChild(t);
}

function clearMarks(){
  document.querySelectorAll("td").forEach(td=>{
    td.classList.remove("family","main");
  });
}

function fillDay(){
  daySel.innerHTML="";
  days.forEach((d,i)=>{
    let o=document.createElement("option");
    o.value=i;o.textContent=d;
    daySel.appendChild(o);
  });
}

function manualSearch(){
  let r=parseInt(rowSel.value)-1;
  let c=parseInt(daySel.value);
  if(grid[r] && grid[r][c]) showPopup(r,c);
}

function save(){
  localStorage.setItem("ismart",input.value);
  alert("Saved");
}

window.onload=()=>{
  let d=localStorage.getItem("ismart");
  if(d){input.value=d;generate();}
}
</script>

</body>
</html>
