<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Row-Gap Pattern Analyzer</title>

<style>
body{font-family:Arial;background:#f1d18a;margin:0}
h2{text-align:center;padding:10px}

#top{text-align:center;padding:10px}
button{padding:6px 10px;margin:5px}

#chartWrap{
  height:80vh;
  overflow:auto;
  border-top:3px solid #000;
  border-bottom:3px solid #000;
}

canvas{background:#fff}

#wrap{display:flex;gap:15px;padding:10px}
#right{width:35%;max-height:80vh;overflow:auto}

.check{
 background:#fff;
 margin:6px;
 padding:8px;
 border-left:5px solid red;
 cursor:pointer
}
.check:hover{background:#ffe3b3}
</style>
</head>

<body>

<h2>📊 Click Gap Based Historical Pattern Finder</h2>

<div id="top">
<input type="file" id="csv">
<button onclick="resetAll()">Reset</button>
<p><b>Jis tarah jodi me click karoge (row gap ke sath), wahi pattern search hoga</b></p>
</div>

<div id="wrap">
<div id="chartWrap">
  <canvas id="chart"></canvas>
</div>

<div id="right">
  <b>Pattern Check Lines</b>
</div>
</div>

<script>
let headers=[],grid=[];
let userPath=[];       // user clicks with row gaps
let foundPatterns=[];

const cvs=document.getElementById("chart");
const ctx=cvs.getContext("2d");

const cellW=80, cellH=30;

document.getElementById("csv").onchange=e=>{
 const r=new FileReader();
 r.onload=()=>loadCSV(r.result);
 r.readAsText(e.target.files[0]);
};

function resetAll(){
 userPath=[];
 foundPatterns=[];
 document.getElementById("right").innerHTML="<b>Pattern Check Lines</b>";
 drawChart();
}

function loadCSV(txt){
 let lines=txt.trim().split("\n");
 headers=lines.shift().split(",");
 grid=lines.map(l=>l.split(","));

 cvs.width = headers.length * cellW + 100;
 cvs.height = grid.length * cellH + 60;

 resetAll();
}

function drawChart(){
 ctx.clearRect(0,0,cvs.width,cvs.height);
 ctx.font="12px Arial";

 headers.forEach((h,i)=>{
   ctx.fillText(h,80+i*cellW,20);
 });

 grid.forEach((row,r)=>{
  row.forEach((v,c)=>{
    let x=60+c*cellW;
    let y=40+r*cellH;
    ctx.strokeRect(x,y,cellW,cellH);
    ctx.fillText(v,x+cellW/2-8,y+18);
  });
 });
}

function family(j){
 return [j, j[1]+j[0], j[0]+j[0], j[1]+j[1]];
}

// user click on chart
cvs.addEventListener("click",e=>{
 const rect=cvs.getBoundingClientRect();
 const x=e.clientX-rect.left;
 const y=e.clientY-rect.top;

 const c=Math.floor((x-60)/cellW);
 const r=Math.floor((y-40)/cellH);

 if(grid[r] && grid[r][c]){
   userPath.push({r,c,val:grid[r][c]});
   drawUserPath();
   if(userPath.length>=2){
     searchPatterns();
   }
 }
});

function drawUserPath(){
 drawChart();

 // draw dashed user path
 ctx.setLineDash([6,4]);
 userPath.forEach(p=>{
  let x=60+p.c*cellW+cellW/2;
  let y=40+p.r*cellH+cellH/2;
  ctx.beginPath();
  ctx.arc(x,y,10,0,Math.PI*2);
  ctx.strokeStyle="red";
  ctx.lineWidth=2;
  ctx.stroke();
 });

 ctx.beginPath();
 let f=userPath[0];
 ctx.moveTo(60+f.c*cellW+cellW/2,40+f.r*cellH+cellH/2);
 userPath.forEach(p=>{
  ctx.lineTo(60+p.c*cellW+cellW/2,40+p.r*cellH+cellH/2);
 });
 ctx.strokeStyle="green";
 ctx.lineWidth=2;
 ctx.stroke();
 ctx.setLineDash([]);
}

function rowGaps(){
 let gaps=[];
 for(let i=1;i<userPath.length;i++){
   gaps.push(userPath[i].r - userPath[i-1].r);
 }
 return gaps;
}

function searchPatterns(){
 foundPatterns=[];
 document.getElementById("right").innerHTML="<b>Pattern Check Lines</b>";

 const gaps=rowGaps();

 for(let r=0;r<grid.length;r++){
   let pts=[];
   let ok=true;

   pts.push({r,c:0,val:null});

   for(let i=0;i<gaps.length;i++){
     let nextRow = r + gaps[i];
     if(!grid[nextRow]){ ok=false; break; }

     let fam=family(userPath[i+1].val);
     let found=false;

     for(let c=0;c<grid[nextRow].length;c++){
       if(fam.includes(grid[nextRow][c])){
         pts.push({r:nextRow,c,val:grid[nextRow][c]});
         found=true;
         break;
       }
     }
     if(!found){ ok=false; break; }
   }

   if(ok){
     foundPatterns.push(pts.slice(1));
   }
 }

 renderCheckLines();
}

function renderCheckLines(){
 foundPatterns.forEach((p,idx)=>{
  let d=document.createElement("div");
  d.className="check";
  d.innerHTML=
   `Pattern ${idx+1}<br>
    Row Gaps: ${rowGaps().join(", ")}<br>
    Flow: ${p.map(x=>x.val).join(" → ")}`;
  d.onclick=()=>drawSinglePattern(p);
  document.getElementById("right").appendChild(d);
 });
}

function drawSinglePattern(p){
 drawChart();

 let endRow=p[p.length-1].r;

 // draw solid historical pattern
 p.forEach(pt=>{
  let x=60+pt.c*cellW+cellW/2;
  let y=40+pt.r*cellH+cellH/2;
  ctx.beginPath();
  ctx.arc(x,y,12,0,Math.PI*2);
  ctx.strokeStyle="red";
  ctx.lineWidth=2;
  ctx.stroke();
 });

 ctx.beginPath();
 let f=p[0];
 ctx.moveTo(60+f.c*cellW+cellW/2,40+f.r*cellH+cellH/2);
 p.forEach(pt=>{
  ctx.lineTo(60+pt.c*cellW+cellW/2,40+pt.r*cellH+cellH/2);
 });
 ctx.strokeStyle="green";
 ctx.lineWidth=2;
 ctx.stroke();

 // show one row below
 if(grid[endRow+1]){
   grid[endRow+1].forEach((v,c)=>{
     let x=60+c*cellW;
     let y=40+(endRow+1)*cellH;
     ctx.strokeStyle="blue";
     ctx.strokeRect(x,y,cellW,cellH);
   });
 }
}
</script>

</body>
</html>
