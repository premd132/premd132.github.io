<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exact Historical Pattern Analyzer – FINAL</title>

<style>
body{margin:0;font-family:Arial;background:#f1d18a}
h2{text-align:center;margin:10px}

#top{text-align:center;padding:10px}
button{padding:6px 12px;margin:5px}

#wrap{display:flex;gap:12px;padding:10px}
#chartWrap{
 height:80vh;
 overflow:auto;
 border:3px solid #000;
 background:#fff
}
canvas{background:#fff}

#right{
 width:35%;
 max-height:80vh;
 overflow:auto
}
.check{
 background:#fff;
 margin:6px;
 padding:8px;
 border-left:5px solid red;
 cursor:pointer;
 font-size:14px
}
.check:hover{background:#ffe3b3}

/* popup */
#modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.6);
 align-items:center;
 justify-content:center;
}
#modalBox{
 background:#fff;
 padding:10px;
 border-radius:6px;
 max-width:95vw;
 max-height:90vh;
 overflow:auto;
}
#popupRows{
 margin-top:10px;
 font-size:13px;
}
#popupRows table{
 border-collapse:collapse;
 width:100%;
}
#popupRows td,#popupRows th{
 border:1px solid #999;
 padding:4px;
 text-align:center;
}
</style>
</head>

<body>

<h2>📊 Exact User-Drawn Historical Pattern Analyzer</h2>

<div id="top">
<input type="file" id="csv">
<button onclick="resetAll()">Reset</button>
<p><b>Jaise chart me line banao → purane record ki wahi exact line milegi</b></p>
</div>

<div id="wrap">
 <div id="chartWrap">
  <canvas id="chart"></canvas>
 </div>
 <div id="right"><b>Pattern Check Lines</b></div>
</div>

<!-- popup -->
<div id="modal" onclick="this.style.display='none'">
 <div id="modalBox" onclick="event.stopPropagation()">
  <canvas id="mini" width="500" height="350"></canvas>
  <div id="popupRows"></div>
 </div>
</div>

<script>
/* ================= GLOBAL ================= */
let headers=[],grid=[];
let userPath=[],foundPatterns=[];
const cellW=80, cellH=30;

const cvs=document.getElementById("chart");
const ctx=cvs.getContext("2d");
const mini=document.getElementById("mini");
const mctx=mini.getContext("2d");

/* ================= LOAD CSV ================= */
document.getElementById("csv").onchange=e=>{
 const r=new FileReader();
 r.onload=()=>loadCSV(r.result);
 r.readAsText(e.target.files[0]);
};

function loadCSV(txt){
 let lines=txt.trim().split("\n");
 headers=lines.shift().split(",");
 grid=lines.map(l=>l.split(","));
 cvs.width=headers.length*cellW+100;
 cvs.height=grid.length*cellH+60;
 resetAll();
}

/* ================= RESET ================= */
function resetAll(){
 userPath=[];
 foundPatterns=[];
 document.getElementById("right").innerHTML="<b>Pattern Check Lines</b>";
 drawChart();
}

/* ================= DRAW FULL CHART ================= */
function drawChart(){
 ctx.clearRect(0,0,cvs.width,cvs.height);
 ctx.font="12px Arial";
 headers.forEach((h,i)=>ctx.fillText(h,80+i*cellW,20));
 grid.forEach((row,r)=>{
  row.forEach((v,c)=>{
   let x=60+c*cellW,y=40+r*cellH;
   ctx.strokeRect(x,y,cellW,cellH);
   ctx.fillText(v,x+cellW/2-8,y+18);
  });
 });
}

/* ================= STRICT FAMILY ================= */
function family(j){
 let a=j[0],b=j[1];
 return [j,b+a,a+a,b+b];
}

/* ================= USER CLICK ================= */
cvs.addEventListener("click",e=>{
 const rect=cvs.getBoundingClientRect();
 const mx=e.clientX-rect.left;
 const my=e.clientY-rect.top;
 const c=Math.floor((mx-60)/cellW);
 const r=Math.floor((my-40)/cellH);

 if(grid[r] && grid[r][c]){
  userPath.push({
   r,c,
   val:grid[r][c],
   x:60+c*cellW+cellW/2,
   y:40+r*cellH+cellH/2
  });
  drawUserPath();
  if(userPath.length>=2) searchPatterns();
 }
});

/* ================= DRAW USER PATH ================= */
function drawUserPath(){
 drawChart();
 userPath.forEach((p,i)=>{
  ctx.beginPath();
  ctx.arc(p.x,p.y,11,0,Math.PI*2);
  ctx.strokeStyle="red";
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.fillText(p.val,p.x-8,p.y-14);

  if(i){
   ctx.beginPath();
   ctx.moveTo(userPath[i-1].x,userPath[i-1].y);
   ctx.lineTo(p.x,p.y);
   ctx.strokeStyle="green";
   ctx.lineWidth=2;
   ctx.stroke();
  }
 });
}

/* ================= ROW GAPS ================= */
function rowGaps(){
 let g=[];
 for(let i=1;i<userPath.length;i++)
  g.push(userPath[i].r-userPath[i-1].r);
 return g;
}

/* ================= SEARCH HISTORICAL ================= */
function searchPatterns(){
 foundPatterns=[];
 document.getElementById("right").innerHTML="<b>Pattern Check Lines</b>";
 const gaps=rowGaps();

 for(let base=0;base<grid.length;base++){
  let pts=[],ok=true;
  for(let i=0;i<userPath.length;i++){
   let rr=i===0?base:base+gaps[i-1];
   if(!grid[rr]){ok=false;break;}
   let fam=family(userPath[i].val);
   let col=grid[rr].findIndex(v=>fam.includes(v));
   if(col===-1){ok=false;break;}
   pts.push({
    r:rr,c:col,val:grid[rr][col],
    x:60+col*cellW+cellW/2,
    y:40+rr*cellH+cellH/2
   });
  }
  if(ok) foundPatterns.push(pts);
 }
 renderCheckLines();
}

/* ================= CHECK LINES ================= */
function renderCheckLines(){
 foundPatterns.forEach((p,i)=>{
  let d=document.createElement("div");
  d.className="check";
  d.innerHTML=`Pattern ${i+1}<br>${p.map(x=>x.val).join(" → ")}`;
  d.onclick=()=>openPopup(p);
  document.getElementById("right").appendChild(d);
 });
}

/* ================= POPUP ================= */
function openPopup(p){
 document.getElementById("modal").style.display="flex";
 mctx.clearRect(0,0,mini.width,mini.height);

 const minX=Math.min(...p.map(pt=>pt.x));
 const minY=Math.min(...p.map(pt=>pt.y));
 const maxX=Math.max(...p.map(pt=>pt.x));
 const maxY=Math.max(...p.map(pt=>pt.y));

 const scale=Math.min(
  (mini.width-80)/(maxX-minX),
  (mini.height-80)/(maxY-minY)
 );

 p.forEach((pt,i)=>{
  let x=40+(pt.x-minX)*scale;
  let y=40+(pt.y-minY)*scale;

  mctx.beginPath();
  mctx.arc(x,y,8,0,Math.PI*2);
  mctx.strokeStyle="red";
  mctx.lineWidth=2;
  mctx.stroke();
  mctx.fillText(pt.val,x-8,y-12);

  if(i){
   let pr=p[i-1];
   let px=40+(pr.x-minX)*scale;
   let py=40+(pr.y-minY)*scale;
   mctx.beginPath();
   mctx.moveTo(px,py);
   mctx.lineTo(x,y);
   mctx.strokeStyle="green";
   mctx.lineWidth=2;
   mctx.stroke();
  }
 });

 /* ---- show full rows ---- */
 let rows=[...new Set(p.map(x=>x.r))];
 let html="<h4>Line Rows – Full Jodi Data</h4><table><tr>";
 headers.forEach(h=>html+=`<th>${h}</th>`);
 html+="</tr>";
 rows.forEach(r=>{
  html+="<tr>";
  grid[r].forEach(v=>html+=`<td>${v}</td>`);
  html+="</tr>";
 });
 html+="</table>";
 document.getElementById("popupRows").innerHTML=html;
}
</script>

</body>
</html>
