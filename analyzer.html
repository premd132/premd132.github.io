<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CLICK TEST – iSmart Base</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;padding:10px}
table{border-collapse:collapse;width:100%}
td,th{
  border:1px solid #000;
  padding:12px;
  text-align:center;
  font-size:16px;
}
td{
  background:#f9f9f9;
}
td:active{
  background:#ffeb3b;
}
</style>
</head>

<body>

<h3>CLICK TEST (Tap any cell)</h3>

<textarea id="data" style="width:100%;height:120px">
12 34 56 78 90 11
23 45 67 89 01 22
34 56 78 90 12 33
45 67 89 01 23 44
56 78 90 12 34 55
67 89 01 23 45 66
78 90 12 34 56 77
89 01 23 45 67 88
90 12 34 56 78 99
12 34 56 78 90 **
</textarea>

<br><br>
<button onclick="build()">Generate</button>

<table id="tbl">
<thead>
<tr>
<th>Mon</th><th>Tue</th><th>Wed</th>
<th>Thu</th><th>Fri</th><th>Sat</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
function build(){
  const tbody=document.querySelector("#tbl tbody");
  tbody.innerHTML="";

  const rows=data.value.trim().split("\n");
  rows.forEach((r,rowIndex)=>{
    const tr=document.createElement("tr");
    r.split(/\s+/).forEach((v,colIndex)=>{
      const td=document.createElement("td");
      td.textContent=v;

      // 🔥 ABSOLUTE CLICK TEST
      td.onclick=function(){
        alert(
          "CLICK WORKING ✅\n\n"+
          "Row: "+(rowIndex+1)+"\n"+
          "Col: "+(colIndex+1)+"\n"+
          "Value: "+v
        );
      };

      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}
build();
</script>

</body>
</html>
