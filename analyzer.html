<script>
const CUT={0:5,5:0,1:6,6:1,2:7,7:2,3:8,8:3,4:9,9:4};
let grid=[];

function family(j){
 let a=Math.floor(j/10),b=j%10;
 return [...new Set([
  j,
  a*10+CUT[b],
  CUT[a]*10+b,
  CUT[a]*10+CUT[b]
 ])];
}

function generate(){
 grid=[];
 document.getElementById("table").innerHTML="";
 document.getElementById("bubbles").innerHTML="";
 let rows=document.getElementById("data").value.trim().split("\n");
 rows.forEach(r=>{
  let d=r.split(/\s+/).slice(1).map(Number);
  grid.push(d);
 });
 let t=document.createElement("table");
 grid.forEach((row,r)=>{
  let tr=document.createElement("tr");
  row.forEach((v,c)=>{
   let td=document.createElement("td");
   td.innerText=v;
   td.onclick=()=>analyze(r,c);
   tr.appendChild(td);
  });
  t.appendChild(tr);
 });
 document.getElementById("table").appendChild(t);
}

function analyze(r,c){
 document.querySelectorAll("td").forEach(x=>x.className="");
 document.getElementById("bubbles").innerHTML="";

 let base=grid[r][c];
 let fam=family(base);

 const DIR=[
  {dr:1,dc:0},   // vertical
  {dr:1,dc:1},   // diag right
  {dr:1,dc:-1}   // diag left
 ];

 let results=new Set();

 DIR.forEach(d=>{
  let nr=r+d.dr,nc=c+d.dc;
  if(grid[nr] && grid[nr][nc]!=null){
   if(fam.includes(grid[nr][nc])){
    // scan all past rows
    for(let pr=0;pr<r;pr++){
     if(fam.includes(grid[pr][c])){
      let tr=pr+d.dr,tc=c+d.dc;
      if(grid[tr] && grid[tr][tc]!=null){
       if(fam.includes(grid[tr][tc])){
        results.add(grid[tr][tc]);
       }
      }
     }
    }
   }
  }
 });

 // highlight
 document.querySelectorAll("td").forEach(td=>{
  let v=parseInt(td.innerText);
  if(v===base) td.classList.add("main");
  if(fam.includes(v)) td.classList.add("family");
  if(results.has(v)) td.classList.add("hit");
 });

 // bubbles (ALL)
 results.forEach(v=>{
  let b=document.createElement("div");
  b.className="bubble";
  b.innerText=v;
  document.getElementById("bubbles").appendChild(b);
 });
}
</script>
