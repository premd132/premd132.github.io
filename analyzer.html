<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔥 Jodi Line Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f7f7f7;
  padding:10px;
}
h2{
  text-align:center;
}
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}
th,td{
  border:1px solid #ccc;
  text-align:center;
  padding:6px;
  font-size:14px;
}
th{
  background:#222;
  color:#fff;
}
td{
  cursor:pointer;
}
td.blank-cell{
  background:#f0f0f0;
  color:#999;
  font-weight:bold;
}
td.blank-cell:hover{
  background:#ffeeba;
}
#popup{
  display:none;
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
}
#popupBox{
  background:#fff;
  width:90%;
  max-width:400px;
  margin:15% auto;
  padding:15px;
  border-radius:8px;
}
#popupBox h3{
  margin-top:0;
}
button{
  padding:6px 10px;
  margin-top:10px;
}
</style>
</head>

<body>

<h2>🔥 Jodi Line Analyzer</h2>

<table>
<thead>
<tr>
  <th>Mon</th>
  <th>Tue</th>
  <th>Wed</th>
  <th>Thu</th>
  <th>Fri</th>
  <th>Sat</th>
</tr>
</thead>

<tbody>
<tr>
  <td>52</td><td>96</td><td>53</td><td>11</td><td>70</td><td class="blank-cell" onclick="aiSuggest()">**</td>
</tr>
<tr>
  <td>91</td><td>97</td><td>67</td><td>79</td><td class="blank-cell" onclick="aiSuggest()">**</td><td>87</td>
</tr>
<tr>
  <td>78</td><td>52</td><td>12</td><td class="blank-cell" onclick="aiSuggest()">**</td><td>64</td><td>17</td>
</tr>
<tr>
  <td class="blank-cell" onclick="aiSuggest()">**</td><td>43</td><td>78</td><td>91</td><td>27</td><td>30</td>
</tr>
<tr>
  <td>64</td><td>30</td><td>97</td><td>55</td><td>97</td><td class="blank-cell" onclick="aiSuggest()">**</td>
</tr>
</tbody>
</table>

<!-- POPUP -->
<div id="popup">
  <div id="popupBox">
    <h3>🔍 AI Strong Jodi Suggestion</h3>
    <div id="popupData"></div>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<script>
function aiSuggest(){
  const strongFamilies = [
    ["16","61"],
    ["27","72"],
    ["38","83"],
    ["49","94"],
    ["05","50"],
    ["12","21"],
    ["33","38"],
    ["55","50"]
  ];

  strongFamilies.sort(() => 0.5 - Math.random());
  let pickCount = Math.random() > 0.5 ? 2 : 4;
  let pick = strongFamilies.slice(0, pickCount);

  let html = "<ul>";
  pick.forEach(j => {
    html += "<li><b>"+j[0]+" - "+j[1]+"</b></li>";
  });
  html += "</ul>";

  document.getElementById("popupData").innerHTML = html;
  document.getElementById("popup").style.display = "block";
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
