<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Exact Pattern Popup Analyzer</title>

<style>
body{font-family:Arial;background:#f1d18a;margin:0}
h2{text-align:center;padding:10px}

#top{text-align:center;padding:10px}
button{padding:6px 10px;margin:5px}

#chartWrap{height:80vh;overflow:auto;border:3px solid #000}
canvas{background:#fff}

#wrap{display:flex;gap:15px;padding:10px}
#right{width:35%;max-height:80vh;overflow:auto}

.check{
 background:#fff;
 margin:6px;
 padding:8px;
 border-left:5px solid red;
 cursor:pointer
}
.check:hover{background:#ffe3b3}

/* popup */
#modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.6);
 align-items:center;
 justify-content:center;
}
#modalBox{
 background:#fff;
 padding:10px;
 border-radius:5px;
}
</style>
</head>

<body>

<h2>📊 Exact Click-Pattern Historical Finder</h2>

<div id="top">
<input type="file" id="csv">
<button onclick="resetAll()">Reset</button>
<p><b>Jaise-jaise click karoge, bilkul waisa hi pattern search hoga</b></p>
</div>

<div id="wrap">
<div id="chartWrap">
  <canvas id="chart"></canvas>
</div>

<div id="right">
  <b>Pattern Check Lines</b>
</div>
</div>

<!-- popup -->
<div id="modal" onclick="this.style.display='none'">
 <div id="modalBox" onclick="event.stopPropagation()">
  <canvas id="mini" width="300" height="200"></canvas>
 </div>
</div>

<script>
let headers=[],grid=[];
let userPath=[],foundPatterns=[];

const cvs=document.getElementById("chart");
const ctx=cvs.getContext("2d");
const mini=document.getElementById("mini");
const mctx=mini.getContext("2d");

const cellW=80, cellH=30;

document.getElementById("csv").onchange=e=>{
 const r=new FileReader();
 r.onload=()=>loadCSV(r.result);
 r.readAsText(e.target.files[0]);
};

function resetAll(){
 userPath=[];
 foundPatterns=[];
 document.getElementById("right").innerHTML="<b>Pattern Check Lines</b>";
 drawChart();
}

function loadCSV(txt){
 let lines=txt.trim().split("\n");
 headers=lines.shift().split(",");
 grid=lines.map(l=>l.split(","));
 cvs.width=headers.length*cellW+100;
 cvs.height=grid.length*cellH+60;
 resetAll();
}

function drawChart(){
 ctx.clearRect(0,0,cvs.width,cvs.height);
 ctx.font="12px Arial";
 headers.forEach((h,i)=>ctx.fillText(h,80+i*cellW,20));
 grid.forEach((row,r)=>{
  row.forEach((v,c)=>{
   let x=60+c*cellW,y=40+r*cellH;
   ctx.strokeRect(x,y,cellW,cellH);
   ctx.fillText(v,x+cellW/2-8,y+18);
  });
 });
}

function family(j){
 return [j,j[1]+j[0],j[0]+j[0],j[1]+j[1]];
}

cvs.onclick=e=>{
 const rect=cvs.getBoundingClientRect();
 const x=e.clientX-rect.left;
 const y=e.clientY-rect.top;
 const c=Math.floor((x-60)/cellW);
 const r=Math.floor((y-40)/cellH);
 if(grid[r]&&grid[r][c]){
  userPath.push({r,c,val:grid[r][c]});
  if(userPath.length>=2) searchPatterns();
 }
};

function rowGaps(){
 let g=[];
 for(let i=1;i<userPath.length;i++)
  g.push(userPath[i].r-userPath[i-1].r);
 return g;
}

function searchPatterns(){
 foundPatterns=[];
 document.getElementById("right").innerHTML="<b>Pattern Check Lines</b>";
 let gaps=rowGaps();

 for(let r=0;r<grid.length;r++){
  let pts=[],ok=true;
  for(let i=0;i<userPath.length;i++){
   let rr=i==0?r:r+gaps[i-1];
   if(!grid[rr]){ok=false;break;}
   let fam=family(userPath[i].val);
   let col=grid[rr].findIndex(v=>fam.includes(v));
   if(col==-1){ok=false;break;}
   pts.push({r:rr,c:col,val:grid[rr][col]});
  }
  if(ok) foundPatterns.push(pts);
 }

 renderCheckLines();
}

function renderCheckLines(){
 foundPatterns.forEach((p,i)=>{
  let d=document.createElement("div");
  d.className="check";
  d.innerHTML=`Pattern ${i+1}<br>${p.map(x=>x.val).join(" → ")}`;
  d.onclick=()=>openPopup(p);
  document.getElementById("right").appendChild(d);
 });
}

function openPopup(p){
 document.getElementById("modal").style.display="flex";
 mctx.clearRect(0,0,mini.width,mini.height);
 let minR=Math.min(...p.map(x=>x.r));
 p.forEach((pt,i)=>{
  let x=50+i*70,y=50+(pt.r-minR)*30;
  mctx.beginPath();
  mctx.arc(x,y,10,0,Math.PI*2);
  mctx.strokeStyle="red";
  mctx.stroke();
  if(i){
   let prev=p[i-1];
   mctx.beginPath();
   mctx.moveTo(50+(i-1)*70,50+(prev.r-minR)*30);
   mctx.lineTo(x,y);
   mctx.strokeStyle="green";
   mctx.stroke();
  }
 });
}
</script>

</body>
</html>
