<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🔥 Jodi Line Analyzer PRO – LEVEL 3</title>

<style>
body{font-family:Arial;padding:10px}
textarea{width:100%;height:120px}
table{border-collapse:collapse;margin-top:12px}
th,td{
  border:1px solid #444;
  padding:6px;
  min-width:45px;
  text-align:center;
  cursor:pointer;
}
th{background:#eee}
td:hover{background:#fff3cd}

.same{border:3px solid red!important}
.family{border:3px solid green!important}
.side{border:3px solid blue!important}
.day{border:3px dashed purple!important}

.box{margin-top:12px;padding:8px;border:1px solid #aaa}
.bubble{
  display:inline-block;
  margin:4px;
  padding:10px;
  border-radius:50%;
  color:#fff;
  font-weight:bold;
}
.red{background:#e74c3c}
.green{background:#27ae60}
.blue{background:#3498db}
.purple{background:#8e44ad}
</style>
</head>

<body>

<h2>🔥 Jodi Line Analyzer – PRO (LEVEL-3)</h2>

<textarea id="input">
Mon Tue Wed Thu Fri Sat
52 91 78 16 64 33
96 97 52 43 30 38
53 67 12 78 97 53
11 79 72 91 55 32
70 09 64 27 97 84
</textarea>

<br><br>
<button onclick="generate()">Generate Chart</button>

<div id="chart"></div>

<div class="box" id="result"><b>Analysis:</b></div>

<script>
let matrix=[];
const familyMap={
 "1":"6","6":"1",
 "2":"7","7":"2",
 "3":"8","8":"3",
 "4":"9","9":"4",
 "5":"0","0":"5"
};

function generate(){
  matrix=document.getElementById("input").value
    .trim().split("\n")
    .map(r=>r.trim().split(/\s+/));

  let html="<table>";
  html+="<tr>";
  matrix[0].forEach(d=>html+="<th>"+d+"</th>");
  html+="</tr>";

  for(let r=1;r<matrix.length;r++){
    html+="<tr>";
    for(let c=0;c<matrix[r].length;c++){
      html+=`<td onclick="analyze(${r},${c})">${matrix[r][c]}</td>`;
    }
    html+="</tr>";
  }
  html+="</table>";
  document.getElementById("chart").innerHTML=html;
}

function getFamily(val){
  return val.split("").map(d=>familyMap[d]||d).join("");
}

function analyze(row,col){
  document.querySelectorAll("td").forEach(td=>{
    td.classList.remove("same","family","side","day");
  });

  let val=matrix[row][col];
  let fam=getFamily(val);

  let same=[],family=[],side=[],dayMatch=[];

  for(let r=1;r<matrix.length-1;r++){
    let nextRow=r+1;

    // SAME
    if(matrix[r][col]===val && same.length<3){
      same.push(matrix[nextRow][col]);
      mark(r,col,"same");
    }

    // FAMILY
    if(matrix[r][col]===fam && family.length<3){
      family.push(matrix[nextRow][col]);
      mark(r,col,"family");
    }

    // SIDE
    if(col>0 && matrix[r][col-1]===val && side.length<3){
      side.push(matrix[nextRow][col-1]);
      mark(r,col-1,"side");
    }
    if(col<matrix[0].length-1 && matrix[r][col+1]===val && side.length<3){
      side.push(matrix[nextRow][col+1]);
      mark(r,col+1,"side");
    }
  }

  // 🆕 SAME DAY / SAME ROW CHECK
  for(let c=0;c<matrix[row].length;c++){
    if(c===col) continue;
    let cellVal=matrix[row][c];
    let cellFam=getFamily(cellVal);

    if(cellVal===val || cellVal===fam || cellFam===val){
      if(dayMatch.length<3){
        dayMatch.push(cellVal);
        mark(row,c,"day");
      }
    }
  }

  document.getElementById("result").innerHTML=`
  <b>Clicked Jodi:</b> ${val} | <b>Family:</b> ${fam}<br><br>

  <b>🔴 SAME LINE</b><br>${bubbles(same,"red")}

  <b>🟢 FAMILY LINE</b><br>${bubbles(family,"green")}

  <b>🔵 SIDE LINE</b><br>${bubbles(side,"blue")}

  <b>🟣 SAME DAY / SAME ROW MATCH</b><br>${bubbles(dayMatch,"purple")}
  `;
}

function mark(r,c,cls){
  document.querySelectorAll("table tr")[r].children[c].classList.add(cls);
}

function bubbles(arr,color){
  if(arr.length===0) return "—";
  return arr.map(v=>`<span class="bubble ${color}">${v}</span>`).join("");
}
</script>

</body>
</html>
