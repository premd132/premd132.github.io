<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Record Pattern Analyzer</title>

<style>
body{font-family:Arial;background:#f2d7a3}
h2{text-align:center}
#top{padding:10px;text-align:center}
canvas{background:#fff;border:3px solid #000}
#panel{display:flex;gap:20px;padding:10px}
#right{width:35%;max-height:520px;overflow:auto}
.item{background:#fff;padding:8px;margin:6px;border-left:5px solid red;cursor:pointer}
.item:hover{background:#ffe0b3}
input,button{padding:6px;margin:5px}
.jodiBtn{background:#000;color:#fff;border:none;padding:6px 10px;margin:3px;cursor:pointer}
.jodiBtn.active{background:red}
</style>
</head>

<body>

<h2>📊 Multi-Jodi Pattern Record Analyzer</h2>

<div id="top">
<input type="file" id="csvFile">
<br>
<b>Select 2 / 3 / 4 Jodi</b><br>
<div id="jodiBox"></div>
<button onclick="runAnalysis()">Analyze Pattern</button>
</div>

<div id="panel">
<canvas id="chart" width="620" height="520"></canvas>
<div id="right"><b>Pattern Check Line</b></div>
</div>

<script>
let rawData=[],records=[];
let selected=[];
const cvs=document.getElementById("chart");
const ctx=cvs.getContext("2d");

document.getElementById("csvFile").onchange=e=>{
 const r=new FileReader();
 r.onload=()=>parseCSV(r.result);
 r.readAsText(e.target.files[0]);
};

function parseCSV(txt){
 let lines=txt.trim().split("\n");
 let head=lines.shift().split(",");
 records=[];
 lines.forEach((l,i)=>{
   let v=l.split(",");
   v.forEach((j,idx)=>{
     records.push({day:head[idx],jodi:j,row:i,col:idx});
   });
 });
 buildJodiButtons();
}

function buildJodiButtons(){
 let box=document.getElementById("jodiBox");
 box.innerHTML="";
 let set=[...new Set(records.map(r=>r.jodi))];
 set.forEach(j=>{
  let b=document.createElement("button");
  b.innerText=j;
  b.className="jodiBtn";
  b.onclick=()=>{
    if(selected.includes(j)){
      selected=selected.filter(x=>x!=j);
      b.classList.remove("active");
    }else if(selected.length<4){
      selected.push(j);
      b.classList.add("active");
    }
  };
  box.appendChild(b);
 });
}

function runAnalysis(){
 ctx.clearRect(0,0,620,520);
 document.getElementById("right").innerHTML="<b>Pattern Check Line</b>";
 if(selected.length<2) return alert("Minimum 2 jodi select karo");

 let match=records.filter(r=>selected.includes(r.jodi));
 let pos=[];
 match.forEach((m,i)=>{
  let x=80+m.col*80;
  let y=40+m.row*30;
  pos.push({x,y,jodi:m.jodi});
  drawCircle(x,y,m.jodi);
 });

 drawLine(pos);
 addCheckLine(pos);
}

function drawCircle(x,y,t){
 ctx.beginPath();
 ctx.arc(x,y,16,0,Math.PI*2);
 ctx.strokeStyle="red";
 ctx.lineWidth=2;
 ctx.stroke();
 ctx.fillText(t,x-7,y+4);
}

function drawLine(p){
 ctx.beginPath();
 ctx.moveTo(p[0].x,p[0].y);
 p.forEach(n=>ctx.lineTo(n.x,n.y));
 ctx.strokeStyle="green";
 ctx.lineWidth=2;
 ctx.stroke();
}

function addCheckLine(p){
 let d=document.createElement("div");
 d.className="item";
 d.innerHTML=`Pattern → ${selected.join("-")}`;
 d.onclick=exportImage;
 document.getElementById("right").appendChild(d);
}

function exportImage(){
 let a=document.createElement("a");
 a.download="pattern_result.png";
 a.href=cvs.toDataURL();
 a.click();
}
</script>

</body>
</html>
