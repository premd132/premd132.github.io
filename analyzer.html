<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iSmart Analyzer – Jodi Marking</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>🔥 Photo-Style Jodi Marking</h2>

<textarea id="dataInput" rows="6" style="width:100%" 
placeholder="Excel se copy-paste yahan karo"></textarea><br><br>

<button onclick="generate()">Generate</button>
<button onclick="saveData()">Save</button>

<br><br>

<table id="chart"></table>

<!-- POPUP -->
<div id="popup">
  <button onclick="closePopup()">X</button>
  <div id="popupContent"></div>
</div>

<script>
const days = ["Mon","Tue","Wed","Thu","Fri","Sat"];
let grid = [];

function generate(){
  let raw = dataInput.value.trim().split("\n");
  grid = [];
  raw.forEach(r=>{
    let row = r.trim().split(/\s+/);
    while(row.length<6) row.push("**");
    grid.push(row);
  });
  drawTable();
}

function drawTable(){
  chart.innerHTML = "";

  let head = document.createElement("tr");
  days.forEach(d=>{
    let th = document.createElement("th");
    th.textContent = d;
    head.appendChild(th);
  });
  chart.appendChild(head);

  grid.forEach((r,i)=>{
    let tr = document.createElement("tr");
    r.forEach((v,j)=>{
      let td = document.createElement("td");
      td.textContent = v;

      if(v==="**") td.classList.add("blank");

      td.onclick = ()=>cellClick(td,v);
      tr.appendChild(td);
    });
    chart.appendChild(tr);
  });
}

/* 👉 JODI CLICK LOGIC */
function cellClick(td,value){
  if(value==="**"){
    alert("Blank box clicked\n(next step: pattern search yahin lagega)");
    return;
  }

  // toggle marking
  if(td.classList.contains("mark-circle")){
    td.classList.remove("mark-circle");
    td.classList.add("mark-underline");
  }
  else if(td.classList.contains("mark-underline")){
    td.classList.remove("mark-underline");
  }
  else{
    td.classList.add("mark-circle");
  }

  // popup
  openPopup(value);
}

function openPopup(val){
  popupContent.innerHTML = `
    <h3 style="text-align:center">Jodi Selected: ${val}</h3>
    <p style="text-align:center">Photo-style view (next step me full record yahan dikhega)</p>
  `;
  popup.style.display="block";
}

function closePopup(){
  popup.style.display="none";
}

function saveData(){
  localStorage.setItem("ismartData",dataInput.value);
  alert("Data Saved");
}

window.onload=()=>{
  let d = localStorage.getItem("ismartData");
  if(d){
    dataInput.value=d;
    generate();
  }
}
</script>

</body>
</html>
