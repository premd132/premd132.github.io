<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Full CSV Historical Pattern Analyzer</title>

<style>
body{font-family:Arial;background:#f1d18a;margin:0}
h2{text-align:center;padding:10px}

#top{text-align:center;padding:10px}

#chartWrap{
  height:80vh;
  overflow:auto;
  border-top:3px solid #000;
  border-bottom:3px solid #000;
}

canvas{background:#fff}

#wrap{display:flex;gap:15px;padding:10px}
#right{width:35%;max-height:80vh;overflow:auto}

.check{
 background:#fff;
 margin:6px;
 padding:8px;
 border-left:5px solid red;
 cursor:pointer
}
.check:hover{background:#ffe3b3}
</style>
</head>

<body>

<h2>📊 Full CSV View + Historical Pattern Finder</h2>

<div id="top">
<input type="file" id="csv">
<p><b>Chart me jodi par click karo → system old pattern dhoondhega</b></p>
</div>

<div id="wrap">
<div id="chartWrap">
  <canvas id="chart"></canvas>
</div>

<div id="right">
  <b>Pattern Check Lines</b>
</div>
</div>

<script>
let headers=[],grid=[];
let selected=[];
const cvs=document.getElementById("chart");
const ctx=cvs.getContext("2d");

const cellW=80, cellH=30;

document.getElementById("csv").onchange=e=>{
 const r=new FileReader();
 r.onload=()=>loadCSV(r.result);
 r.readAsText(e.target.files[0]);
};

function loadCSV(txt){
 let lines=txt.trim().split("\n");
 headers=lines.shift().split(",");
 grid=lines.map(l=>l.split(","));

 cvs.width = headers.length * cellW + 100;
 cvs.height = grid.length * cellH + 60;

 drawChart();
}

function drawChart(){
 ctx.clearRect(0,0,cvs.width,cvs.height);
 ctx.font="12px Arial";

 headers.forEach((h,i)=>{
   ctx.fillText(h,80+i*cellW,20);
 });

 grid.forEach((row,r)=>{
  row.forEach((v,c)=>{
    let x=60+c*cellW;
    let y=40+r*cellH;
    ctx.strokeRect(x,y,cellW,cellH);
    ctx.fillText(v,x+cellW/2-8,y+18);
  });
 });
}

// cell click detect
cvs.addEventListener("click",e=>{
 const rect=cvs.getBoundingClientRect();
 const x=e.clientX-rect.left;
 const y=e.clientY-rect.top;

 const c=Math.floor((x-60)/cellW);
 const r=Math.floor((y-40)/cellH);

 if(grid[r] && grid[r][c]){
   selectJodi(grid[r][c]);
 }
});

function family(j){
 return [j, j[1]+j[0], j[0]+j[0], j[1]+j[1]];
}

function selectJodi(j){
 selected = family(j);
 findOldPatterns();
}

function findOldPatterns(){
 drawChart();
 document.getElementById("right").innerHTML="<b>Pattern Check Lines</b>";

 let matches=[];
 grid.forEach((row,r)=>{
  row.forEach((v,c)=>{
   if(selected.includes(v)){
    matches.push({r,c,v});
   }
  });
 });

 if(matches.length<2) return;

 drawPattern(matches);

 let d=document.createElement("div");
 d.className="check";
 d.innerHTML=`Old Pattern Found<br>Jodi/Family: ${[...new Set(matches.map(m=>m.v))].join(" → ")}`;
 d.onclick=exportImage;
 document.getElementById("right").appendChild(d);
}

function drawPattern(arr){
 arr.forEach(p=>{
  let x=60+p.c*cellW+cellW/2;
  let y=40+p.r*cellH+cellH/2;
  ctx.beginPath();
  ctx.arc(x,y,12,0,Math.PI*2);
  ctx.strokeStyle="red";
  ctx.lineWidth=2;
  ctx.stroke();
 });

 ctx.beginPath();
 let f=arr[0];
 ctx.moveTo(60+f.c*cellW+cellW/2,40+f.r*cellH+cellH/2);
 arr.forEach(p=>{
  ctx.lineTo(60+p.c*cellW+cellW/2,40+p.r*cellH+cellH/2);
 });
 ctx.strokeStyle="green";
 ctx.lineWidth=2;
 ctx.stroke();
}

function exportImage(){
 let a=document.createElement("a");
 a.download="old_pattern.png";
 a.href=cvs.toDataURL();
 a.click();
}
</script>

</body>
</html>
