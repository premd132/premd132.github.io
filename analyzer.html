<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🔥 Jodi Line Analyzer</title>

<style>
body{
  font-family: Arial;
  padding:10px;
}
textarea{
  width:100%;
  height:120px;
}
table{
  border-collapse:collapse;
  margin-top:12px;
}
th,td{
  border:1px solid #444;
  padding:6px;
  text-align:center;
  min-width:45px;
  cursor:pointer;
}
th{
  background:#f0f0f0;
  font-weight:bold;
}
td:hover{
  background:#ffe;
}
.active{
  background:#ffb !important;
}
#matches{
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>🔥 Jodi Line Analyzer</h2>

<textarea id="input">
Mon Tue Wed Thu Fri Sat
52  91  78  16  64  33
96  97  52  43  30  38
53  67  12  78  97  53
11  79  72  91  55  32
70  09  64  27  97  84
</textarea>

<br><br>
<button onclick="generate()">Generate Chart</button>

<div id="chart"></div>
<div id="matches">Matches:</div>

<script>
let matrix=[];

function generate(){
  const raw=document.getElementById("input").value.trim().split("\n");
  const chart=document.getElementById("chart");
  chart.innerHTML="";
  document.getElementById("matches").innerText="Matches:";

  matrix=raw.map(r=>r.trim().split(/\s+/));

  let table=document.createElement("table");

  // HEADER (DAYS ON TOP)
  let header=document.createElement("tr");
  matrix[0].forEach(d=>{
    let th=document.createElement("th");
    th.innerText=d;
    header.appendChild(th);
  });
  table.appendChild(header);

  // DATA ROWS
  for(let r=1;r<matrix.length;r++){
    let tr=document.createElement("tr");
    for(let c=0;c<matrix[r].length;c++){
      let td=document.createElement("td");
      td.innerText=matrix[r][c];
      td.onclick=()=>analyze(r,c,matrix[r][c]);
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }

  chart.appendChild(table);
}

function analyze(row,col,val){
  document.querySelectorAll("td").forEach(td=>td.classList.remove("active"));

  let after=[];

  for(let r=1;r<matrix.length-1;r++){
    if(matrix[r][col]===val){
      // highlight
      document.querySelectorAll("table tr")[r].children[col].classList.add("active");

      // after result
      after.push(matrix[r+1][col]);
    }
  }

  document.getElementById("matches").innerText=
    "Matches for "+val+" → "+(after.length?after.join(", "):"No data");
}
</script>

</body>
</html>
