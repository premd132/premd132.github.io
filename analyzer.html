<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Record Line Analyzer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 10px;
    }
    h2 {
      text-align: center;
    }
    .controls {
      text-align: center;
      margin-bottom: 10px;
    }
    .controls label {
      font-size: 16px;
      cursor: pointer;
    }
    .box {
      background: #fff;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

  <h2>📊 Record Line Analyzer</h2>

  <div class="controls">
    <label>
      <input type="checkbox" id="lineToggle" checked>
      Check Line
    </label>
  </div>

  <div class="box">
    <canvas id="lineChart" height="300"></canvas>
  </div>

  <script>
    // ====== SAMPLE RECORD DATA ======
    // Is array me aap DAILY record add kar sakte ho
    const labels = [
      '01-01', '02-01', '03-01', '04-01', '05-01',
      '06-01', '07-01', '08-01', '09-01', '10-01'
    ];

    const recordData = [
      12, 45, 23, 78, 34,
      56, 90, 41, 67, 29
    ];

    // ====== CHART CREATE ======
    const ctx = document.getElementById('lineChart').getContext('2d');

    const lineChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Daily Record Line',
          data: recordData,
          borderColor: 'blue',
          backgroundColor: 'transparent',
          borderWidth: 2,
          tension: 0.3,
          pointRadius: 4
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            display: true
          }
        },
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });

    // ====== CHECKBOX LINE ON / OFF ======
    document.getElementById('lineToggle').addEventListener('change', function () {
      lineChart.data.datasets[0].hidden = !this.checked;
      lineChart.update();
    });
  </script>

</body>
</html>
