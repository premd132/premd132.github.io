<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔥 iSmart Analyzer – Pattern Line</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f4f4f4;margin:0}
h2{text-align:center}
textarea{width:100%;height:140px;font-family:monospace}
button{padding:8px 14px;margin:4px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{
  border:1px solid #999;
  padding:6px;
  text-align:center;
  min-width:42px;
  cursor:pointer;
  position:relative;
}
th{background:#222;color:#fff}
td.blank{background:#eee}
td.mark{
  outline:3px solid blue;
  border-radius:50%;
}
#lineCanvas{
  position:absolute;
  top:0;left:0;
  pointer-events:none;
}
#popup{
  position:fixed;
  inset:0;
  background:#fff;
  display:none;
  z-index:9999;
  overflow:auto;
}
#popup header{
  background:#000;color:#fff;
  padding:8px;
  display:flex;
  justify-content:space-between;
}
</style>
</head>

<body>

<h2>🔥 iSmart Analyzer (Real Photo Logic)</h2>

<textarea id="dataInput" placeholder="Excel se copy-paste data"></textarea>
<br>
<button onclick="generate()">Generate</button>
<button onclick="saveData()">Save</button>

<div style="position:relative">
  <table id="chart"></table>
  <canvas id="lineCanvas"></canvas>
</div>

<div id="popup">
  <header>
    <span id="popupTitle"></span>
    <button onclick="closePopup()">❌</button>
  </header>
  <div id="popupBody"></div>
</div>

<script>
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat"];
let grid=[], rows=0;

function generate(){
  grid=[];
  document.getElementById("lineCanvas").getContext("2d").clearRect(0,0,5000,5000);
  let raw=document.getElementById("dataInput").value.trim().split("\n");
  raw.forEach(r=>{
    let a=r.trim().split(/\s+/);
    while(a.length<6) a.push("**");
    grid.push(a);
  });
  rows=grid.length;
  drawTable();
  resizeCanvas();
}

function drawTable(){
  let t=document.getElementById("chart");
  t.innerHTML="";
  let tr=document.createElement("tr");
  DAYS.forEach(d=>{let th=document.createElement("th");th.textContent=d;tr.appendChild(th)});
  t.appendChild(tr);

  grid.forEach((r,i)=>{
    let tr=document.createElement("tr");
    r.forEach((v,j)=>{
      let td=document.createElement("td");
      td.textContent=v;
      if(v==="**") td.classList.add("blank");
      td.onclick=()=>cellClick(i,j);
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
}

function resizeCanvas(){
  let c=document.getElementById("lineCanvas");
  let t=document.getElementById("chart");
  c.width=t.offsetWidth;
  c.height=t.offsetHeight;
}

function family(j){
  let a=parseInt(j[0]),b=parseInt(j[1]);
  return [
    `${a}${b}`,
    `${(a+9)%10}${b}`,
    `${a}${(b+9)%10}`
  ];
}

function cellClick(r,c){
  if(grid[r][c]==="**"){
    blankSearch(r,c);
  }else{
    jodiPopup(r,c);
  }
}

/* 🔵 BLANK BOX → PATTERN SEARCH */
function blankSearch(r,c){
  clearMarks();
  let base=[];
  for(let i=r-1;i>=0 && base.length<9;i--){
    if(grid[i][c]!=="**") base.push(grid[i][c]);
  }
  if(base.length<3){
    alert("Pattern kam hai");
    return;
  }

  let matches=[];
  for(let i=0;i<rows;i++){
    let ok=true;
    for(let k=0;k<base.length;k++){
      if(!grid[i+k] || grid[i+k][c]==="**"){ok=false;break;}
      let f1=family(base[k]);
      let f2=family(grid[i+k][c]);
      if(!f1.some(x=>f2.includes(x))){ok=false;break;}
    }
    if(ok) matches.push(i);
  }

  matches.forEach(start=>{
    markColumn(start,c,base.length);
    drawBlueLine(start,c,base.length);
  });
}

/* 🔵 MARKING */
function markColumn(r,c,len){
  let t=document.getElementById("chart");
  for(let i=0;i<len;i++){
    t.rows[r+1+i].cells[c].classList.add("mark");
  }
}

/* 🔵 BLUE LINE */
function drawBlueLine(r,c,len){
  let ctx=document.getElementById("lineCanvas").getContext("2d");
  let p1=center(r,c);
  let p2=center(r+len-1,c);
  ctx.strokeStyle="blue";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(p1.x,p1.y);
  ctx.lineTo(p2.x,p2.y);
  ctx.stroke();
}

/* 🔵 POPUP (PHOTO STYLE) */
function jodiPopup(r,c){
  let p=document.getElementById("popup");
  document.getElementById("popupTitle").textContent=
    `Jodi: ${grid[r][c]} | Day: ${DAYS[c]} | Row: ${r+1}`;

  // clone full chart (photo style)
  let clone=document.getElementById("chart").cloneNode(true);
  document.getElementById("popupBody").innerHTML="";
  document.getElementById("popupBody").appendChild(clone);

  p.style.display="block";
}

function closePopup(){document.getElementById("popup").style.display="none";}
function clearMarks(){
  document.querySelectorAll(".mark").forEach(e=>e.classList.remove("mark"));
  document.getElementById("lineCanvas").getContext("2d").clearRect(0,0,5000,5000);
}
function center(r,c){
  let t=document.getElementById("chart");
  let cell=t.rows[r+1].cells[c].getBoundingClientRect();
  let base=t.getBoundingClientRect();
  return{
    x:cell.left-base.left+cell.width/2,
    y:cell.top-base.top+cell.height/2
  };
}
function saveData(){
  localStorage.setItem("ismartData",dataInput.value);
  alert("Saved");
}
window.onload=()=>{
  let d=localStorage.getItem("ismartData");
  if(d){dataInput.value=d;generate();}
};
</script>

</body>
</html>
