<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DPBOSS Perfect Line Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:12px;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6fb;color:#000;
}
h2,h3{text-align:center;margin:8px 0}
.note{text-align:center;font-size:12px;color:#b91c1c}

/* ===== TABLE ===== */
#wrap{
  background:#fff;
  padding:10px;
  border-radius:8px;
  overflow-x:auto;
}
table{
  border-collapse:collapse;
  min-width:680px;
  margin:auto;
}
td{
  border:1.5px solid #111;
  width:44px;height:34px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}
td.sel{
  background:#2563eb;
  color:#fff;
}

/* ===== OCCURRENCE BOXES ===== */
#occ{
  max-width:520px;
  margin:14px auto;
}
.occBox{
  background:#eef2ff;
  border:2px solid #4338ca;
  border-radius:8px;
  padding:8px;
  margin:8px 0;
}
.occTitle{
  font-weight:bold;
  margin-bottom:6px;
}
.circle{
  display:inline-block;
  width:26px;height:26px;
  border-radius:50%;
  background:#16a34a;
  color:#fff;
  text-align:center;
  line-height:26px;
  font-weight:bold;
  margin-right:6px;
}

/* ===== BUBBLES ===== */
#bubbleBox{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin:14px 0;
}
.bubble{
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:bold;
  background:linear-gradient(135deg,#2563eb,#1e40af);
}

/* ===== AFTER LIST ===== */
#after{
  max-width:420px;
  margin:10px auto;
}
.afterBox{
  background:#e5e7eb;
  padding:8px;
  margin:6px 0;
  border-radius:6px;
  display:flex;
  justify-content:space-between;
}
.empty{text-align:center;color:#555}
</style>
</head>

<body>

<h2 id="title">ANALYZER</h2>
<div class="note">Past record based visual reference only</div>

<h3>Record Table</h3>
<div id="wrap"></div>

<h3>Same Line – Old Occurrences</h3>
<div id="occ"></div>

<h3>Line ke baad jo aaya (Bubbles)</h3>
<div id="bubbleBox"></div>

<h3>Detail List</h3>
<div id="after"></div>

<script>
// ===== LOAD GAME & RECORD =====
const game = localStorage.getItem("currentGame") || "kalyan";
document.getElementById("title").innerText =
  game.replace("_"," ").toUpperCase();

const text = localStorage.getItem("record_"+game) || "";

// ===== PARSE RECORD =====
let rows=[];
text.split("\n").forEach(l=>{
  const p=l.trim().split(/\s+/);
  if(p.length>1) rows.push(p.slice(1).map(Number));
});

// ===== BUILD TABLE =====
const wrap=document.getElementById("wrap");
if(!rows.length){
  wrap.innerHTML="<div class='empty'>No record found</div>";
}

const table=document.createElement("table");
rows.forEach((r,ri)=>{
  const tr=document.createElement("tr");
  r.forEach((n,ci)=>{
    const td=document.createElement("td");
    td.innerText=n;
    td.onclick=()=>onLineClick(ri,ci,td);
    tr.appendChild(td);
  });
  table.appendChild(tr);
});
wrap.appendChild(table);

// ===== CLICK HANDLER =====
function onLineClick(r,c,td){
  document.querySelectorAll("td").forEach(x=>x.classList.remove("sel"));
  td.classList.add("sel");

  if(c+1>=rows[r].length) return;
  const line=[rows[r][c], rows[r][c+1]];
  analyze(line);
}

// ===== CORE ANALYSIS =====
function analyze(line){
  const occurrences=[];
  const afterCount={};

  for(let r=0;r<rows.length-1;r++){
    for(let c=0;c<rows[r].length-1;c++){
      if(rows[r][c]===line[0] && rows[r][c+1]===line[1]){
        occurrences.push({row:r,col:c});
        const next=rows[r+1][c];
        afterCount[next]=(afterCount[next]||0)+1;
      }
    }
  }

  drawOccurrences(occurrences,line);
  drawBubbles(afterCount);
  drawAfterList(afterCount);
}

// ===== DRAW OCCURRENCE BOXES =====
function drawOccurrences(list,line){
  const occ=document.getElementById("occ");
  occ.innerHTML="";

  if(!list.length){
    occ.innerHTML="<div class='empty'>No old occurrence</div>";
    return;
  }

  list.forEach((o,i)=>{
    const d=document.createElement("div");
    d.className="occBox";
    d.innerHTML=
      `<div class="occTitle">
        <span class="circle">${i+1}</span>
        Line ${line[0]}-${line[1]} (Row ${o.row+1})
      </div>`;
    occ.appendChild(d);
  });
}

// ===== DRAW BUBBLES (ONLY AFTER CLICK) =====
function drawBubbles(obj){
  const bubbleBox=document.getElementById("bubbleBox");
  bubbleBox.innerHTML="";

  Object.keys(obj).forEach(k=>{
    const size=36 + obj[k]*8;
    const b=document.createElement("div");
    b.className="bubble";
    b.style.width=b.style.height=size+"px";
    b.innerText=k;
    bubbleBox.appendChild(b);
  });
}

// ===== DRAW AFTER LIST =====
function drawAfterList(obj){
  const after=document.getElementById("after");
  after.innerHTML="";

  if(Object.keys(obj).length===0){
    after.innerHTML="<div class='empty'>No past result</div>";
    return;
  }

  Object.keys(obj).forEach(k=>{
    const d=document.createElement("div");
    d.className="afterBox";
    d.innerHTML=`<span>${k}</span><span>${obj[k]} times</span>`;
    after.appendChild(d);
  });
}
</script>

</body>
</html>
