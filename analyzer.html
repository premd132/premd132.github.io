<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Advanced Historical Pattern Analyzer</title>

<style>
body{font-family:Arial;background:#f1d18a;margin:0}
h2{text-align:center;padding:10px}

#top{text-align:center;padding:10px}

#chartWrap{
  height:80vh;
  overflow:auto;
  border-top:3px solid #000;
  border-bottom:3px solid #000;
}

canvas{background:#fff}

#wrap{display:flex;gap:15px;padding:10px}
#right{width:35%;max-height:80vh;overflow:auto}

.check{
 background:#fff;
 margin:6px;
 padding:8px;
 border-left:5px solid red;
 cursor:pointer
}
.check:hover{background:#ffe3b3}
</style>
</head>

<body>

<h2>📊 Multi-Jodi Historical Pattern Finder</h2>

<div id="top">
<input type="file" id="csv">
<p><b>Chart me 2 / 3 / 4 jodi par click karo → purane same pattern milenge</b></p>
</div>

<div id="wrap">
<div id="chartWrap">
  <canvas id="chart"></canvas>
</div>

<div id="right">
  <b>Pattern Check Lines</b>
</div>
</div>

<script>
let headers=[],grid=[];
let selectedSeq=[];
let foundPatterns=[];

const cvs=document.getElementById("chart");
const ctx=cvs.getContext("2d");

const cellW=80, cellH=30;

document.getElementById("csv").onchange=e=>{
 const r=new FileReader();
 r.onload=()=>loadCSV(r.result);
 r.readAsText(e.target.files[0]);
};

function loadCSV(txt){
 let lines=txt.trim().split("\n");
 headers=lines.shift().split(",");
 grid=lines.map(l=>l.split(","));

 cvs.width = headers.length * cellW + 100;
 cvs.height = grid.length * cellH + 60;

 drawChart();
 selectedSeq=[];
 foundPatterns=[];
 document.getElementById("right").innerHTML="<b>Pattern Check Lines</b>";
}

function drawChart(){
 ctx.clearRect(0,0,cvs.width,cvs.height);
 ctx.font="12px Arial";

 headers.forEach((h,i)=>{
   ctx.fillText(h,80+i*cellW,20);
 });

 grid.forEach((row,r)=>{
  row.forEach((v,c)=>{
    let x=60+c*cellW;
    let y=40+r*cellH;
    ctx.strokeRect(x,y,cellW,cellH);
    ctx.fillText(v,x+cellW/2-8,y+18);
  });
 });
}

function family(j){
 return [j, j[1]+j[0], j[0]+j[0], j[1]+j[1]];
}

// chart cell click
cvs.addEventListener("click",e=>{
 const rect=cvs.getBoundingClientRect();
 const x=e.clientX-rect.left;
 const y=e.clientY-rect.top;

 const c=Math.floor((x-60)/cellW);
 const r=Math.floor((y-40)/cellH);

 if(grid[r] && grid[r][c]){
   selectedSeq.push(grid[r][c]);
   searchOldPatterns();
 }
});

function searchOldPatterns(){
 drawChart();
 document.getElementById("right").innerHTML="<b>Pattern Check Lines</b>";
 foundPatterns=[];

 if(selectedSeq.length < 2) return;

 // scan historical record
 for(let r=0; r<=grid.length-selectedSeq.length; r++){
   let match=true;
   let points=[];

   for(let i=0;i<selectedSeq.length;i++){
     let fam=family(selectedSeq[i]);
     let found=false;

     for(let c=0;c<grid[r+i].length;c++){
       if(fam.includes(grid[r+i][c])){
         points.push({r:r+i,c,val:grid[r+i][c]});
         found=true;
         break;
       }
     }
     if(!found){ match=false; break; }
   }

   if(match){
     foundPatterns.push(points);
   }
 }

 renderCheckLines();
}

function renderCheckLines(){
 foundPatterns.forEach((p,idx)=>{
  let d=document.createElement("div");
  d.className="check";
  d.innerHTML=`Pattern ${idx+1}<br>
  Jodi Flow: ${p.map(x=>x.val).join(" → ")}`;
  d.onclick=()=>drawSinglePattern(p);
  document.getElementById("right").appendChild(d);
 });
}

function drawSinglePattern(p){
 drawChart();

 p.forEach(pt=>{
  let x=60+pt.c*cellW+cellW/2;
  let y=40+pt.r*cellH+cellH/2;
  ctx.beginPath();
  ctx.arc(x,y,12,0,Math.PI*2);
  ctx.strokeStyle="red";
  ctx.lineWidth=2;
  ctx.stroke();
 });

 ctx.beginPath();
 let f=p[0];
 ctx.moveTo(60+f.c*cellW+cellW/2,40+f.r*cellH+cellH/2);
 p.forEach(pt=>{
  ctx.lineTo(60+pt.c*cellW+cellW/2,40+pt.r*cellH+cellH/2);
 });
 ctx.strokeStyle="green";
 ctx.lineWidth=2;
 ctx.stroke();
}
</script>

</body>
</html>
