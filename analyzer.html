<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  padding:10px;
  font-family:Arial, sans-serif;
  background:#f2f2f2;
}

/* FIXED clickable toggle */
.toggle-box{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:18px;
  background:#fff;
  padding:10px;
  border-radius:6px;
  margin-bottom:10px;
}

.toggle-box input{
  width:22px;
  height:22px;
  cursor:pointer;
}

/* Chart box */
.chart-box{
  background:#fff;
  padding:10px;
  border-radius:6px;
}
</style>
</head>

<body>

<h3>📊 Record Line Analyzer</h3>

<!-- ✅ REAL CLICKABLE CHECKBOX -->
<div class="toggle-box">
  <input type="checkbox" id="lineToggle" checked>
  <span>Check Line</span>
</div>

<div class="chart-box">
  <canvas id="lineChart" height="280"></canvas>
</div>

<script>
const ctx = document.getElementById('lineChart').getContext('2d');

const lineChart = new Chart(ctx,{
  type:'line',
  data:{
    labels:['01','02','03','04','05','06','07','08','09','10'],
    datasets:[{
      label:'Daily Record',
      data:[12,22,15,30,25,40,35,28,45,32],
      borderColor:'blue',
      borderWidth:2,
      fill:false,
      tension:0.4,
      pointRadius:4
    }]
  },
  options:{
    responsive:true,
    plugins:{
      legend:{display:true}
    },
    scales:{
      y:{beginAtZero:true}
    }
  }
});

/* ✅ GUARANTEED CLICK WORK */
document.getElementById("lineToggle").onclick = function(){
  lineChart.data.datasets[0].hidden = !this.checked;
  lineChart.update();
};
</script>

</body>
</html>
