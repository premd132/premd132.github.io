<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jodi Line Analyzer PRO</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:10px}
table{border-collapse:collapse;margin:auto}
td{
  width:55px;height:40px;
  border:1px solid #ccc;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}
.box{border:3px solid black;color:red}
svg{position:absolute;top:0;left:0;pointer-events:none}
</style>
</head>
<body>

<h3 align="center">🔥 Jodi Line Analyzer (PRO)</h3>

<textarea id="data" rows="9" style="width:100%">
27/10/25 59 44 59 42 90
03/11/25 55 02 93 00 05
10/11/25 91 10 84 20 84
17/11/25 52 96 53 11 70
24/11/25 91 07 67 79 09
01/12/25 78 52 12 72 64
08/12/25 16 43 78 91 27
15/12/25 64 30 97 55 97
22/12/25 33 38 53 32 84
</textarea>

<div style="position:relative;margin-top:20px">
<svg id="lines"></svg>
<table id="tbl"></table>
</div>

<script>
let cells=[];

function build(){
  const tbl=document.getElementById("tbl");
  const svg=document.getElementById("lines");
  tbl.innerHTML=""; svg.innerHTML="";
  cells=[];
  const rows=document.getElementById("data").value.trim().split("\n");

  rows.forEach(r=>{
    const tr=document.createElement("tr");
    r.split(" ").slice(1).forEach(v=>{
      const td=document.createElement("td");
      td.innerText=v;
      td.onclick=()=>select(v);
      tr.appendChild(td);
      cells.push({td,val:v});
    });
    tbl.appendChild(tr);
  });
}

function select(val){
  document.querySelectorAll("td").forEach(td=>td.className="");
  const hits=cells.filter(c=>c.val==val).slice(0,4);
  hits.forEach(h=>h.td.classList.add("box"));
  draw(hits);
}

function draw(hits){
  const svg=document.getElementById("lines");
  svg.innerHTML="";
  const rect=document.getElementById("tbl").getBoundingClientRect();
  svg.setAttribute("width",rect.width);
  svg.setAttribute("height",rect.height);
  const colors=["red","blue","green"];
  for(let i=0;i<hits.length-1;i++){
    const a=hits[i].td.getBoundingClientRect();
    const b=hits[i+1].td.getBoundingClientRect();
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",a.left-rect.left+27);
    line.setAttribute("y1",a.top-rect.top+20);
    line.setAttribute("x2",b.left-rect.left+27);
    line.setAttribute("y2",b.top-rect.top+20);
    line.setAttribute("stroke",colors[i]);
    line.setAttribute("stroke-width","3");
    svg.appendChild(line);
  }
}

build(); // AUTO LOAD
</script>

</body>
</html>
