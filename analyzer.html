<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Exact Pattern Analyzer – FINAL with SCORE + FORWARD</title>

<style>
body{margin:0;font-family:Arial;background:#f1d18a}
h2{text-align:center;margin:10px}
#top{text-align:center;padding:10px}
button{padding:6px 12px}

#wrap{display:flex;gap:10px;padding:10px}
#chartWrap{height:80vh;overflow:auto;border:3px solid #000;background:#fff}
canvas{background:#fff}

#right{width:38%;max-height:80vh;overflow:auto}
.check{
 background:#fff;
 margin:6px;
 padding:8px;
 border-left:5px solid red;
 cursor:pointer;
 font-size:13px
}

#modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.7);
 align-items:center;
 justify-content:center;
}
#modalBox{
 background:#fff;
 padding:8px;
 max-width:95vw;
 max-height:95vh;
 overflow:auto;
}
</style>
</head>

<body>

<h2>📊 Exact Pattern Analyzer (Score + Forward Mapping)</h2>

<div id="top">
<input type="file" id="csv">
<button onclick="resetAll()">Reset</button>
</div>

<div id="wrap">
 <div id="chartWrap">
  <canvas id="chart"></canvas>
 </div>
 <div id="right"><b>Pattern Check Lines</b></div>
</div>

<div id="modal" onclick="this.style.display='none'">
 <div id="modalBox" onclick="event.stopPropagation()">
  <canvas id="popup"></canvas>
  <div id="forward"></div>
 </div>
</div>

<script>
/* ===== GLOBAL ===== */
let headers=[],grid=[];
let userPath=[],found=[];
const cellW=80,cellH=30;

const cvs=document.getElementById("chart");
const ctx=cvs.getContext("2d");
const pop=document.getElementById("popup");
const pctx=pop.getContext("2d");

/* ===== LOAD CSV ===== */
csv.onchange=e=>{
 let r=new FileReader();
 r.onload=()=>loadCSV(r.result);
 r.readAsText(e.target.files[0]);
};

function loadCSV(t){
 let l=t.trim().split("\n");
 headers=l.shift().split(",");
 grid=l.map(r=>r.split(","));
 cvs.width=headers.length*cellW+100;
 cvs.height=grid.length*cellH+60;
 resetAll();
}

/* ===== RESET ===== */
function resetAll(){
 userPath=[];
 found=[];
 document.getElementById("right").innerHTML="<b>Pattern Check Lines</b>";
 drawChart();
}

/* ===== DRAW CHART ===== */
function drawChart(){
 ctx.clearRect(0,0,cvs.width,cvs.height);
 ctx.font="12px Arial";
 headers.forEach((h,i)=>ctx.fillText(h,80+i*cellW,20));
 grid.forEach((r,ri)=>{
  r.forEach((v,ci)=>{
   let x=60+ci*cellW,y=40+ri*cellH;
   ctx.strokeRect(x,y,cellW,cellH);
   ctx.fillText(v,x+cellW/2-8,y+18);
  });
 });
}

/* ===== FAMILY (STRICT – CURRENT) ===== */
function family(j){
 let a=j[0],b=j[1];
 return [j,b+a,a+a,b+b];
}

/* ===== CLICK ===== */
cvs.onclick=e=>{
 let r=cvs.getBoundingClientRect();
 let col=Math.floor((e.clientX-r.left-60)/cellW);
 let row=Math.floor((e.clientY-r.top-40)/cellH);
 if(grid[row] && grid[row][col]){
  userPath.push({r:row,c:col,val:grid[row][col]});
  drawUser();
  if(userPath.length>1) search();
 }
};

/* ===== DRAW USER ===== */
function drawUser(){
 drawChart();
 userPath.forEach((p,i)=>{
  let x=60+p.c*cellW+cellW/2;
  let y=40+p.r*cellH+cellH/2;
  ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);
  ctx.strokeStyle="red";ctx.stroke();
  ctx.fillText(p.val,x-8,y-14);
  if(i){
   let q=userPath[i-1];
   ctx.beginPath();
   ctx.moveTo(60+q.c*cellW+cellW/2,40+q.r*cellH+cellH/2);
   ctx.lineTo(x,y);
   ctx.strokeStyle="green";ctx.stroke();
  }
 });
}

/* ===== SEARCH ===== */
function search(){
 found=[];
 document.getElementById("right").innerHTML="<b>Pattern Check Lines</b>";

 let rowGaps=[],colGaps=[];
 for(let i=1;i<userPath.length;i++){
  rowGaps.push(userPath[i].r-userPath[i-1].r);
  colGaps.push(userPath[i].c-userPath[i-1].c);
 }

 for(let baseR=0;baseR<grid.length;baseR++){
  for(let baseC=0;baseC<headers.length;baseC++){
   let pts=[],ok=true;
   for(let i=0;i<userPath.length;i++){
    let rr=baseR+rowGaps.slice(0,i).reduce((a,b)=>a+b,0);
    let cc=baseC+colGaps.slice(0,i).reduce((a,b)=>a+b,0);
    if(!grid[rr]||!grid[rr][cc]){ok=false;break;}
    if(!family(userPath[i].val).includes(grid[rr][cc])){
      ok=false;break;
    }
    pts.push({r:rr,c:cc,val:grid[rr][cc]});
   }
   if(ok) found.push(pts);
  }
 }

 renderCheckLines();
}

/* ===== SCORE + FORWARD ===== */
function patternScore(idx){
 let freq = found.filter(p=>p[0].r===found[idx][0].r).length;
 let lastRow = found[idx][found[idx].length-1].r;
 let recentBonus = Math.max(0, (grid.length-lastRow)/5);
 return Math.min(100, Math.round(freq*10 + recentBonus));
}

function forwardMap(p){
 let map={};
 let last=p[p.length-1].r+1;
 if(!grid[last]) return map;
 grid[last].forEach(v=>{
  map[v]=(map[v]||0)+1;
 });
 return map;
}

/* ===== RENDER CHECK ===== */
function renderCheckLines(){
 found.forEach((p,i)=>{
  let score=patternScore(i);
  let d=document.createElement("div");
  d.className="check";
  d.innerHTML=
   `<b>Pattern ${i+1}</b> | Score: <b>${score}</b><br>
    ${p.map(x=>x.val).join(" → ")}`;
  d.onclick=()=>showPattern(p,i);
  right.appendChild(d);
 });
}

/* ===== SHOW PATTERN ===== */
function showPattern(p,idx){
 drawChart();

 p.forEach((pt,i)=>{
  let x=60+pt.c*cellW+cellW/2;
  let y=40+pt.r*cellH+cellH/2;
  ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);
  ctx.strokeStyle="red";ctx.stroke();
  ctx.fillText(pt.val,x-8,y-14);
  if(i){
   let pr=p[i-1];
   ctx.beginPath();
   ctx.moveTo(60+pr.c*cellW+cellW/2,40+pr.r*cellH+cellH/2);
   ctx.lineTo(x,y);
   ctx.strokeStyle="green";ctx.stroke();
  }
 });

 showPopup(p,idx);
}

/* ===== POPUP ===== */
function showPopup(p,idx){
 let minR=Math.min(...p.map(x=>x.r));
 let maxR=Math.max(...p.map(x=>x.r))+1;
 let cropY=40+minR*cellH;
 let h=(maxR-minR)*cellH+40;
 let w=cvs.width;

 pop.width=w;
 pop.height=h;
 pctx.drawImage(cvs,0,cropY,w,h,0,0,w,h);

 let fmap=forwardMap(p);
 let html="<h4>After this pattern:</h4>";
 Object.keys(fmap).forEach(k=>{
  html+=`${k} → ${fmap[k]} times<br>`;
 });
 document.getElementById("forward").innerHTML=html;

 modal.style.display="flex";
}
</script>

</body>
</html>
