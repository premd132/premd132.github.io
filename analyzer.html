<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔥 iSmart Analyzer – Full Version</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:10px}
h2{text-align:center}
textarea{width:100%;height:160px;font-size:14px}
button{padding:8px 12px;margin:5px;font-size:14px;cursor:pointer}
#wrap{position:relative;overflow:auto;background:#fff}
table{border-collapse:collapse;width:100%}
th,td{
 border:1px solid #999;
 padding:6px;
 text-align:center;
 min-width:45px;
 cursor:pointer;
 user-select:none;
}
th{background:#222;color:#fff;position:sticky;top:0}
td.blank{background:#eee}
td.hit{background:#dff0ff}
canvas{position:absolute;left:0;top:0;pointer-events:none}
#popup{
 position:fixed;left:0;top:0;width:100%;height:100%;
 background:rgba(0,0,0,.6);display:none;
}
#popupBox{
 background:#fff;
 width:95%;
 height:90%;
 margin:3% auto;
 overflow:auto;
 position:relative;
}
#popupClose{
 position:absolute;right:10px;top:10px;
 font-size:20px;cursor:pointer;
}
</style>
</head>

<body>

<h2>🔥 iSmart Analyzer – Full Working</h2>

<textarea id="dataInput" placeholder="Excel se copy-paste karo (Mon Tue Wed Thu Fri Sat)"></textarea><br>
<button onclick="generate()">Generate</button>
<button onclick="saveData()">Save</button>
<button onclick="clearData()">Clear</button>

<div id="wrap">
<canvas id="canvas"></canvas>
<table id="table"></table>
</div>

<!-- POPUP -->
<div id="popup">
 <div id="popupBox">
  <span id="popupClose" onclick="popup.style.display='none'">✖</span>
  <div id="popupContent"></div>
 </div>
</div>

<script>
let grid=[], family={0:[5],1:[6],2:[7],3:[8],4:[9],5:[0],6:[1],7:[2],8:[3],9:[4]};

function generate(){
 let raw=dataInput.value.trim();
 if(!raw) return alert("Data paste karo");
 let rows=raw.split("\n");
 grid=[];
 rows.forEach(r=>{
  let c=r.trim().split(/\s+/);
  grid.push(c);
 });
 render();
}

function render(){
 let t=document.getElementById("table");
 t.innerHTML="";
 let head=document.createElement("tr");
 ["Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>{
  let th=document.createElement("th");th.innerText=d;head.appendChild(th);
 });
 t.appendChild(head);

 grid.forEach((r,i)=>{
  let tr=document.createElement("tr");
  r.forEach((v,j)=>{
   let td=document.createElement("td");
   td.innerText=v;
   td.dataset.row=i;
   td.dataset.col=j;
   if(v=="**"||v=="") td.classList.add("blank");
   tr.appendChild(td);
  });
  t.appendChild(tr);
 });
}

document.addEventListener("click",function(e){
 let td=e.target.closest("td");
 if(!td||!td.dataset.row)return;
 let r=+td.dataset.row,c=+td.dataset.col;
 if(td.classList.contains("blank")) onBlankClick(r,c);
 else onJodiClick(r,c);
});

function buildSignature(baseRow,col){
 let sig=[];
 for(let i=1;i<=10;i++){
  let r=baseRow-i;
  if(r<0)break;
  let v=grid[r][col];
  if(v&&v!="**"){
   sig.push({off:i,val:v});
  }
 }
 return sig;
}

function matchSig(row,col,sig){
 for(let s of sig){
  let r=row-s.off;
  if(r<0)return false;
  let v=grid[r][col];
  if(!v||v=="**")return false;
  if(v!=s.val){
   let f1=family[v[0]],f2=family[s.val[0]];
   if(!f1||!f2||f1[0]!=f2[0]) return false;
  }
 }
 return true;
}

function onBlankClick(row,col){
 let sig=buildSignature(row,col);
 if(sig.length<3)return alert("Pattern ke liye data kam hai");
 let hits=[];
 for(let r=row+1;r<grid.length;r++){
  if(matchSig(r,col,sig)) hits.push(r);
 }
 drawLines(hits,col);
}

function onJodiClick(row,col){
 alert("Jodi clicked: "+grid[row][col]);
}

function drawLines(rows,col){
 let c=document.getElementById("canvas");
 let t=document.getElementById("table");
 c.width=t.offsetWidth;
 c.height=t.offsetHeight;
 let ctx=c.getContext("2d");
 ctx.clearRect(0,0,c.width,c.height);
 ctx.strokeStyle="blue";ctx.lineWidth=3;

 rows.forEach(r=>{
  let s=t.rows[r].cells[col];
  let e=t.rows[t.rows.length-1].cells[col];
  let a=s.getBoundingClientRect();
  let b=e.getBoundingClientRect();
  let tr=t.getBoundingClientRect();
  ctx.beginPath();
  ctx.moveTo(a.left-tr.left+a.width/2,a.top-tr.top+a.height/2);
  ctx.lineTo(b.left-tr.left+b.width/2,b.top-tr.top+b.height/2);
  ctx.stroke();
 });
}

function saveData(){
 localStorage.setItem("ismartData",dataInput.value);
 alert("Saved");
}
function clearData(){
 localStorage.removeItem("ismartData");
 dataInput.value="";
 document.getElementById("table").innerHTML="";
}

window.onload=()=>{
 let d=localStorage.getItem("ismartData");
 if(d){dataInput.value=d;generate();}
}
</script>

</body>
</html>
