<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Final Line Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:10px;
  font-family:Arial, sans-serif;
  background:#f4f6fb;
  min-height:100vh;
  color:#000;
}

h2,h3{
  text-align:center;
  margin:10px 0;
}

.note{
  text-align:center;
  color:#b91c1c;
  font-size:13px;
  margin-bottom:10px;
}

/* Buttons */
.btns{
  text-align:center;
  margin-bottom:10px;
}
.btns button{
  margin:4px;
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:#fff;
  font-weight:bold;
}

/* Bubbles */
#bubbleBox{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin:10px 0;
}
.bubble{
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

/* Check Lines */
#checkLines{
  max-width:420px;
  margin:10px auto;
}
.check{
  background:#e5e7eb;
  padding:8px;
  margin:6px 0;
  border-radius:6px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.check button{
  padding:4px 8px;
  border:none;
  border-radius:4px;
  background:#16a34a;
  color:#fff;
}

/* Table */
#wrap{
  width:100%;
  overflow-x:auto;
  background:#fff;
  padding:10px;
  border-radius:8px;
}
table{
  border-collapse:collapse;
  min-width:600px;
  margin:auto;
}
td{
  border:1px solid #999;
  width:42px;
  height:32px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}
td.sel{
  background:#2563eb;
  color:#fff;
}

/* After result */
#after{
  max-width:420px;
  margin:15px auto;
}
.box{
  background:#e5e7eb;
  padding:8px;
  margin:6px 0;
  border-radius:6px;
  display:flex;
  justify-content:space-between;
}
.empty{
  text-align:center;
  color:#555;
}
</style>
</head>

<body>

<h2 id="title">Analyzer</h2>
<div class="note">Past record based analysis only (no prediction)</div>

<div class="btns">
  <button onclick="setMode(1)">1st Touch</button>
  <button onclick="setMode(2)">2nd Touch</button>
  <button onclick="setMode(3)">3rd Touch</button>
</div>

<div id="bubbleBox"></div>

<h3>Auto Check Lines</h3>
<div id="checkLines"></div>

<div id="wrap"></div>

<h3>Is line ke baad past me aaya</h3>
<div id="after"></div>

<script>
// ===== LOAD GAME & RECORD =====
const game = localStorage.getItem("currentGame") || "kalyan";
document.getElementById("title").innerText =
  game.replace("_"," ").toUpperCase();

const text = localStorage.getItem("record_"+game) || "";

// ===== GLOBAL =====
let rows=[], cells=[], currentLine=null, mode=1;

// ===== PARSE RECORD =====
text.split("\n").forEach(l=>{
  const p = l.trim().split(/\s+/);
  if(p.length>1){
    rows.push(p.slice(1).map(Number));
  }
});

// ===== IF NO DATA =====
if(rows.length===0){
  document.getElementById("wrap").innerHTML =
    "<div class='empty'>No record found. Please add record first.</div>";
}

// ===== BUILD TABLE =====
const wrap = document.getElementById("wrap");
const table = document.createElement("table");

rows.forEach((r,ri)=>{
  const tr=document.createElement("tr");
  r.forEach((n,ci)=>{
    const td=document.createElement("td");
    td.innerText=n;
    td.onclick=()=>selectLine(ri,ci);
    cells.push({td,val:n,row:ri,col:ci});
    tr.appendChild(td);
  });
  table.appendChild(tr);
});
wrap.appendChild(table);

// ===== BUBBLES =====
const freq={};
rows.flat().forEach(n=>freq[n]=(freq[n]||0)+1);
const bubbleBox=document.getElementById("bubbleBox");

Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).forEach(k=>{
  const size=36+freq[k]*6;
  const b=document.createElement("div");
  b.className="bubble";
  b.style.width=b.style.height=size+"px";
  b.style.background=`hsl(${k*4},70%,50%)`;
  b.innerText=k;
  b.onclick=()=>{
    const c=cells.find(x=>x.val==k);
    if(c) selectLine(c.row,c.col);
  };
  bubbleBox.appendChild(b);
});

// ===== TOUCH MODE =====
function setMode(m){
  mode=m;
  draw();
}

// ===== SELECT LINE =====
function selectLine(r,c){
  document.querySelectorAll("td").forEach(td=>td.classList.remove("sel"));
  const cell=cells.find(x=>x.row===r&&x.col===c);
  if(!cell) return;
  cell.td.classList.add("sel");

  if(c+1>=rows[r].length) return;
  currentLine=[rows[r][c], rows[r][c+1]];
  draw();
}

// ===== DRAW AFTER RESULT =====
function draw(){
  const after=document.getElementById("after");
  after.innerHTML="";
  if(!currentLine) return;

  const out={};
  for(let r=0;r<rows.length-mode;r++){
    for(let c=0;c<rows[r].length-1;c++){
      if(rows[r][c]===currentLine[0] &&
         rows[r][c+1]===currentLine[1]){
        const next=rows[r+mode][c];
        out[next]=(out[next]||0)+1;
      }
    }
  }

  if(Object.keys(out).length===0){
    after.innerHTML="<div class='empty'>No past result found</div>";
    return;
  }

  Object.keys(out).forEach(k=>{
    const d=document.createElement("div");
    d.className="box";
    d.innerHTML=`<span>${k}</span><span>${out[k]} times</span>`;
    after.appendChild(d);
  });
}

// ===== AUTO CHECK LINES (LAST DAY) =====
const checkLines=document.getElementById("checkLines");
if(rows.length){
  const last=rows[rows.length-1];
  for(let i=0;i<last.length-1;i++){
    const a=last[i], b=last[i+1];
    const d=document.createElement("div");
    d.className="check";
    d.innerHTML=`<span>${a}-${b}</span>
      <button onclick="currentLine=[${a},${b}];draw()">Check</button>`;
    checkLines.appendChild(d);
  }
}
</script>

</body>
</html>
