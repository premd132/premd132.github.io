<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔥 iSmart Photo-Logic Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f4f4;
  margin:0;
  padding:10px;
}
h1{
  text-align:center;
  margin:10px 0;
}
textarea{
  width:100%;
  height:140px;
  font-family:monospace;
  font-size:14px;
}
button{
  padding:10px 14px;
  margin:5px 3px;
  font-size:14px;
  cursor:pointer;
}
.table-wrap{
  position:relative;
  overflow:auto;
  background:#fff;
}
table{
  border-collapse:collapse;
  width:100%;
}
th,td{
  border:1px solid #999;
  padding:6px;
  text-align:center;
  min-width:46px;
  cursor:pointer;
  user-select:none;
}
th{
  background:#111;
  color:#fff;
}
td.blank{
  background:#eee;
  color:#999;
}
td.mark{
  background:#ffe6e6;
  box-shadow: inset 0 0 0 2px red;
}
td.focus{
  box-shadow: inset 0 0 0 3px blue;
}
.vertical-line{
  position:absolute;
  top:0;
  bottom:0;
  width:4px;
  background:blue;
  pointer-events:auto;
  cursor:pointer;
}
.controls{
  margin:10px 0;
  text-align:center;
}

/* POPUP */
#popup{
  position:fixed;
  inset:5%;
  background:#fff;
  border:4px solid #000;
  z-index:9999;
  display:none;
  overflow:auto;
}
#popupHeader{
  background:#000;
  color:#fff;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
#popupHeader button{
  background:red;
  color:#fff;
  border:none;
  padding:6px 10px;
  font-size:16px;
}
#popupContent{
  padding:10px;
}
</style>
</head>

<body>

<h1>🔥 iSmart Analyzer (PHOTO LOGIC)</h1>

<textarea id="dataInput" placeholder="Excel se copy-paste data yahan karo"></textarea>

<div class="controls">
  <button onclick="generate()">Generate</button>
  <button onclick="addBlankRow()">Add Blank Row</button>
  <button onclick="saveData()">Save</button>
  <button onclick="clearAll()">Clear</button>
</div>

<div class="table-wrap" id="wrap">
  <table id="chart"></table>
</div>

<!-- POPUP -->
<div id="popup">
  <div id="popupHeader">
    <div id="popupTitle"></div>
    <button onclick="closePopup()">X</button>
  </div>
  <div id="popupContent"></div>
</div>

<script>
const days=["Mon","Tue","Wed","Thu","Fri","Sat"];
let grid=[];
let matches=[];

function generate(){
  const raw=document.getElementById("dataInput").value.trim().split("\n");
  grid=[];
  raw.forEach(r=>{
    let row=r.trim().split(/\s+/);
    while(row.length<6) row.push("**");
    grid.push(row);
  });
  drawTable();
}

function drawTable(){
  const t=document.getElementById("chart");
  t.innerHTML="";
  document.querySelectorAll(".vertical-line").forEach(l=>l.remove());
  matches=[];

  let tr=document.createElement("tr");
  days.forEach(d=>{
    let th=document.createElement("th");
    th.textContent=d;
    tr.appendChild(th);
  });
  t.appendChild(tr);

  grid.forEach((r,ri)=>{
    let tr=document.createElement("tr");
    r.forEach((v,ci)=>{
      let td=document.createElement("td");
      td.textContent=v;
      if(v==="**") td.classList.add("blank");
      td.onclick=()=>cellClick(ri,ci);
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
}

function addBlankRow(){
  grid.push(["**","**","**","**","**","**"]);
  drawTable();
}

function cellClick(r,c){
  clearMarks();
  if(grid[r][c]==="**"){
    blankBoxSearch(r,c);
  }else{
    showPopupSingle(r,c);
  }
}

function blankBoxSearch(row,col){
  const basePattern=getPattern(row,col);
  if(basePattern.length<6){
    alert("Pattern ke liye data kam hai");
    return;
  }

  for(let r=0;r<=grid.length-basePattern.length;r++){
    let ok=true;
    for(let k=0;k<basePattern.length;k++){
      if(grid[r+k][col]==="**"){ ok=false; break; }
      if(!patternMatch(basePattern[k],grid[r+k][col])){ ok=false; break; }
    }
    if(ok){
      matches.push({start:r,col,pattern:basePattern});
      drawVerticalLine(col,r,basePattern.length);
      markCells(r,col,basePattern.length);
    }
  }
}

function getPattern(r,c){
  let p=[];
  for(let i=r-1;i>=0 && p.length<10;i--){
    if(grid[i][c]!=="**"){
      p.unshift(grid[i][c]);
    }
  }
  for(let i=r+1;i<grid.length && p.length<10;i++){
    if(grid[i][c]!=="**"){
      p.push(grid[i][c]);
    }
  }
  return p;
}

function patternMatch(a,b){
  const da=Math.abs(a[0]-a[1]);
  const db=Math.abs(b[0]-b[1]);
  return da===db || (a[0]===b[0] || a[1]===b[1]);
}

function markCells(start,col,len){
  const t=document.getElementById("chart");
  for(let i=0;i<len;i++){
    const cell=t.rows[start+1+i].cells[col];
    cell.classList.add("mark");
  }
}

function drawVerticalLine(col,start,len){
  const wrap=document.getElementById("wrap");
  const t=document.getElementById("chart");
  const cellTop=t.rows[start+1].cells[col].getBoundingClientRect();
  const cellBottom=t.rows[start+len].cells[col].getBoundingClientRect();
  const base=wrap.getBoundingClientRect();

  let line=document.createElement("div");
  line.className="vertical-line";
  line.style.left=(cellTop.left-base.left+cellTop.width/2-2)+"px";
  line.style.top=(cellTop.top-base.top)+"px";
  line.style.height=(cellBottom.bottom-cellTop.top)+"px";

  line.onclick=()=>showPopupPattern(col,start,len);
  wrap.appendChild(line);
}

function showPopupPattern(col,start,len){
  const t=document.getElementById("chart").cloneNode(true);
  for(let i=0;i<len;i++){
    t.rows[start+1+i].cells[col].classList.add("mark","focus");
  }
  openPopup(`Pattern | ${days[col]}`,t);
}

function showPopupSingle(r,c){
  const t=document.getElementById("chart").cloneNode(true);
  t.rows[r+1].cells[c].classList.add("focus");
  openPopup(`Jodi ${grid[r][c]} | ${days[c]} | Row ${r+1}`,t);
}

function openPopup(title,content){
  document.getElementById("popupTitle").textContent=title;
  const box=document.getElementById("popupContent");
  box.innerHTML="";
  box.appendChild(content);
  document.getElementById("popup").style.display="block";
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}

function clearMarks(){
  document.querySelectorAll("td").forEach(td=>{
    td.classList.remove("mark","focus");
  });
  document.querySelectorAll(".vertical-line").forEach(l=>l.remove());
}

function saveData(){
  localStorage.setItem("ismartPhotoData",document.getElementById("dataInput").value);
  alert("Data saved");
}
function clearAll(){
  localStorage.removeItem("ismartPhotoData");
  location.reload();
}

window.onload=()=>{
  const d=localStorage.getItem("ismartPhotoData");
  if(d){
    document.getElementById("dataInput").value=d;
    generate();
  }
}
</script>

</body>
</html>
