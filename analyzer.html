<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🔥 iSmart Analyzer – Photo Line</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>🔥 iSmart Analyzer (Blue Line + Popup)</h2>

<textarea id="dataInput"
placeholder="Excel se copy-paste data yahan karo"></textarea><br><br>

<button onclick="generate()">Generate</button>
<button onclick="saveData()">Save</button>
<button onclick="clearAll()">Clear</button>

<div style="position:relative">
  <table id="chart"></table>
  <canvas id="lineCanvas"></canvas>
</div>

<!-- POPUP -->
<div id="popup">
  <button onclick="closePopup()">X</button>
  <div id="popupContent"></div>
</div>

<script>
const days=["Mon","Tue","Wed","Thu","Fri","Sat"];
let grid=[];
let activeLines=[];

/* =====================
   GENERATE
===================== */
function generate(){
  let raw=dataInput.value.trim().split("\n");
  grid=[];
  raw.forEach(r=>{
    let row=r.trim().split(/\s+/);
    while(row.length<6) row.push("**");
    grid.push(row);
  });
  drawTable();
  resizeCanvas();
}

/* =====================
   TABLE
===================== */
function drawTable(){
  chart.innerHTML="";
  let tr=document.createElement("tr");
  days.forEach(d=>{
    let th=document.createElement("th");
    th.textContent=d;
    tr.appendChild(th);
  });
  chart.appendChild(tr);

  grid.forEach((r,i)=>{
    let tr=document.createElement("tr");
    r.forEach((v,j)=>{
      let td=document.createElement("td");
      td.textContent=v;
      if(v==="**") td.classList.add("blank");
      td.onclick=()=>cellClick(i,j);
      tr.appendChild(td);
    });
    chart.appendChild(tr);
  });
}

/* =====================
   FAMILY / CUT LOGIC
===================== */
function familySet(j){
  let a=parseInt(j[0]), b=parseInt(j[1]);
  return new Set([
    j,
    ""+((a+9)%10)+b,
    ""+a+((b+9)%10),
    ""+((a+1)%10)+b,
    ""+a+((b+1)%10)
  ]);
}

/* =====================
   CELL CLICK
===================== */
function cellClick(r,c){
  clearMarks();
  clearCanvas();

  if(grid[r][c]==="**"){
    blankPatternSearch(r,c);
  }else{
    markCell(r,c);
    showPopup("Jodi clicked: "+grid[r][c]);
  }
}

/* =====================
   MARK CELL (PHOTO STYLE)
===================== */
function markCell(r,c){
  let td=chart.rows[r+1].cells[c];
  td.classList.add("mark-circle","mark-underline");
}

/* =====================
   BLANK BOX SEARCH
===================== */
function blankPatternSearch(r,c){
  let pattern=[];
  for(let i=r-1;i>=0 && pattern.length<10;i--){
    if(grid[i][c]!=="**") pattern.push(grid[i][c]);
  }

  if(pattern.length<4){
    alert("Pattern ke liye data kam hai");
    return;
  }

  searchWholeRecord(pattern,c,r);
}

/* =====================
   SEARCH & LINE DRAW
===================== */
function searchWholeRecord(pattern,col,clickedRow){
  activeLines=[];
  for(let r=0;r<=grid.length-pattern.length;r++){
    let ok=true;

    for(let k=0;k<pattern.length;k++){
      if(grid[r+k][col]==="**"){ ok=false; break; }
      let f1=familySet(pattern[k]);
      let f2=familySet(grid[r+k][col]);
      if(![...f1].some(x=>f2.has(x))){
        ok=false; break;
      }
    }

    if(ok){
      for(let k=0;k<pattern.length;k++){
        markCell(r+k,col);
      }
      drawBlueLine(r,col,r+pattern.length-1,col);
    }
  }

  showPopup("Pattern found & BLUE LINE drawn");
}

/* =====================
   CANVAS LINE
===================== */
function resizeCanvas(){
  let c=lineCanvas;
  let t=chart;
  c.width=t.offsetWidth;
  c.height=t.offsetHeight;
}

function drawBlueLine(r1,c1,r2,c2){
  let ctx=lineCanvas.getContext("2d");
  let p1=center(r1,c1);
  let p2=center(r2,c2);

  ctx.strokeStyle="blue";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(p1.x,p1.y);
  ctx.lineTo(p2.x,p2.y);
  ctx.stroke();

  activeLines.push({p1,p2});
}

/* =====================
   LINE CLICK → POPUP
===================== */
lineCanvas.addEventListener("click",()=>{
  popupContent.innerHTML=chart.outerHTML;
  popup.style.display="block";
});

/* =====================
   UTILS
===================== */
function center(r,c){
  let cell=chart.rows[r+1].cells[c];
  let rect=cell.getBoundingClientRect();
  let base=chart.getBoundingClientRect();
  return {
    x:rect.left-base.left+rect.width/2,
    y:rect.top-base.top+rect.height/2
  };
}

function clearMarks(){
  document.querySelectorAll(".mark-circle,.mark-underline")
    .forEach(td=>{
      td.classList.remove("mark-circle","mark-underline");
    });
}

function clearCanvas(){
  let ctx=lineCanvas.getContext("2d");
  ctx.clearRect(0,0,lineCanvas.width,lineCanvas.height);
}

function showPopup(msg){
  popupContent.innerHTML="<h3>"+msg+"</h3>";
  popup.style.display="block";
}

function closePopup(){
  popup.style.display="none";
}

function saveData(){
  localStorage.setItem("ismartData",dataInput.value);
  alert("Saved");
}

function clearAll(){
  localStorage.removeItem("ismartData");
  location.reload();
}

window.onload=()=>{
  let d=localStorage.getItem("ismartData");
  if(d){
    dataInput.value=d;
    generate();
  }
};
</script>

</body>
</html>
