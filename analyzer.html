<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pattern Analyzer – Persistent & Editable Data</title>

<style>
body{margin:0;font-family:Arial;background:#f1d18a}
h2{text-align:center;margin:10px}
#top{text-align:center;padding:10px}
button{padding:6px 10px;margin:4px}

#wrap{display:flex;gap:10px;padding:10px}
#chartWrap{height:80vh;overflow:auto;border:3px solid #000;background:#fff}
canvas{background:#fff}

#right{width:30%;max-height:80vh;overflow:auto}

#editor{
 width:40%;
 max-height:80vh;
 overflow:auto;
 background:#fff;
 border:3px solid #000;
 padding:6px;
}

table{border-collapse:collapse;width:100%}
td,th{border:1px solid #999;padding:4px;text-align:center;font-size:12px}
td[contenteditable]{background:#fff7cc}
.del{color:red;cursor:pointer;font-weight:bold}

.check{
 background:#fff;
 margin:6px;
 padding:6px;
 border-left:5px solid red;
 cursor:pointer;
 font-size:13px
}
</style>
</head>

<body>

<h2>📊 Pattern Analyzer (Saved + Editable Records)</h2>

<div id="top">
<input type="file" id="csv">
<button onclick="clearAll()">Clear Data</button>
<button onclick="addRow()">+ Add Row</button>
</div>

<div id="wrap">

 <div id="chartWrap">
  <canvas id="chart"></canvas>
 </div>

 <div id="right">
  <b>Pattern Check Lines</b>
 </div>

 <div id="editor">
  <b>Editable Record Table</b>
  <div id="tableBox"></div>
 </div>

</div>

<script>
/* ===== GLOBAL ===== */
let headers=[],grid=[];
let userPath=[],found=[];
const cellW=80,cellH=30;

const cvs=document.getElementById("chart");
const ctx=cvs.getContext("2d");

/* ===== LOAD SAVED DATA ===== */
window.onload=()=>{
 let saved=localStorage.getItem("savedCSV");
 if(saved) loadCSV(saved);
};

/* ===== CSV UPLOAD ===== */
csv.onchange=e=>{
 let r=new FileReader();
 r.onload=()=>{
  localStorage.setItem("savedCSV",r.result);
  loadCSV(r.result);
 };
 r.readAsText(e.target.files[0]);
};

/* ===== LOAD CSV ===== */
function loadCSV(txt){
 let lines=txt.trim().split("\n");
 headers=lines.shift().split(",");
 grid=lines.map(l=>l.split(","));
 drawAll();
 renderEditor();
}

/* ===== CLEAR ALL ===== */
function clearAll(){
 if(!confirm("Pura record delete karna hai?")) return;
 localStorage.removeItem("savedCSV");
 grid=[];
 headers=[];
 ctx.clearRect(0,0,cvs.width,cvs.height);
 document.getElementById("right").innerHTML="<b>Pattern Check Lines</b>";
 document.getElementById("tableBox").innerHTML="";
}

/* ===== ADD ROW ===== */
function addRow(){
 if(!headers.length) return alert("Pehle CSV load karo");
 let row=headers.map(()=>"--");
 grid.push(row);
 saveGrid();
 drawAll();
 renderEditor();
}

/* ===== SAVE GRID ===== */
function saveGrid(){
 let txt=headers.join(",")+"\n"+grid.map(r=>r.join(",")).join("\n");
 localStorage.setItem("savedCSV",txt);
}

/* ===== DRAW ALL ===== */
function drawAll(){
 cvs.width=headers.length*cellW+100;
 cvs.height=grid.length*cellH+60;
 drawChart();
}

/* ===== DRAW CHART ===== */
function drawChart(){
 ctx.clearRect(0,0,cvs.width,cvs.height);
 ctx.font="12px Arial";
 headers.forEach((h,i)=>ctx.fillText(h,80+i*cellW,20));
 grid.forEach((r,ri)=>{
  r.forEach((v,ci)=>{
   let x=60+ci*cellW,y=40+ri*cellH;
   ctx.strokeRect(x,y,cellW,cellH);
   ctx.fillText(v,x+cellW/2-8,y+18);
  });
 });
}

/* ===== EDITOR ===== */
function renderEditor(){
 let html="<table><tr>";
 headers.forEach(h=>html+=`<th>${h}</th>`);
 html+="<th>❌</th></tr>";

 grid.forEach((r,ri)=>{
  html+="<tr>";
  r.forEach((v,ci)=>{
   html+=`<td contenteditable onblur="editCell(${ri},${ci},this.innerText)">${v}</td>`;
  });
  html+=`<td class="del" onclick="deleteRow(${ri})">X</td></tr>`;
 });

 html+="</table>";
 document.getElementById("tableBox").innerHTML=html;
}

/* ===== EDIT CELL ===== */
function editCell(r,c,val){
 grid[r][c]=val.trim();
 saveGrid();
 drawAll();
}

/* ===== DELETE ROW ===== */
function deleteRow(r){
 if(!confirm("Is row ko delete kare?")) return;
 grid.splice(r,1);
 saveGrid();
 drawAll();
 renderEditor();
}
</script>

</body>
</html>
