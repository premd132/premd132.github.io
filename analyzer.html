<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔥 Jodi Line Analyzer (FINAL)</title>
<style>
body{font-family:Arial;margin:10px;background:#fafafa}
textarea{width:100%;height:140px}
button{padding:8px 14px;margin:5px 5px 5px 0}
table{border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:4px 6px;text-align:center;font-size:13px}
th{background:#f0f0f0}
.match{background:#ffeaa7;cursor:pointer}
#results{margin-top:15px}
.popup{
 position:fixed;top:0;left:0;width:100%;height:100%;
 background:rgba(0,0,0,.6);display:none;
 align-items:center;justify-content:center
}
.popup-content{
 background:#fff;padding:15px;max-width:90%;
 border-radius:6px
}
</style>
</head>

<body>

<h3>🔥 Jodi Line Analyzer (FINAL)</h3>

<p>Format example:</p>
<pre>
Mon 52 96 53 11 70
Tue 91 97 67 79 09
Wed 78 52 12 72 64
Thu 16 43 78 91 27
Fri 64 30 97 55 97
Sat 33 38 53 32 84
</pre>

<textarea id="input"></textarea><br>
<button onclick="analyze()">Generate Chart</button>

<div id="chart"></div>
<div id="results"></div>

<!-- POPUP -->
<div class="popup" id="popup" onclick="this.style.display='none'">
  <div class="popup-content" onclick="event.stopPropagation()">
    <div id="popupData"></div>
  </div>
</div>

<script>
const FAMILY = {
  1:6,6:1,2:7,7:2,3:8,8:3,4:9,9:4,5:0,0:5
};

function isFamily(a,b){
  return FAMILY[a]==b;
}

function parseData(){
  let lines = document.getElementById("input").value.trim().split("\n");
  let days=[], grid=[];
  lines.forEach(l=>{
    let p=l.trim().split(/\s+/);
    if(p.length<2) return;
    days.push(p[0]);
    grid.push(p.slice(1).map(v=>v==="**"?null:v));
  });
  return {days,grid};
}

function analyze(){
  const {days,grid}=parseData();
  if(grid.length===0) return;

  // transpose to day-wise columns
  let rows = Math.max(...grid.map(r=>r.length));
  let table=[];
  for(let r=0;r<rows;r++){
    table[r]=[];
    for(let c=0;c<grid.length;c++){
      table[r][c]=grid[c][r]||null;
    }
  }

  drawTable(days,table);
  findTrends(days,table);
}

function drawTable(days,table){
  let html="<table><tr>";
  days.forEach(d=>html+="<th>"+d+"</th>");
  html+="</tr>";
  table.forEach(r=>{
    html+="<tr>";
    r.forEach(v=>html+="<td>"+(v??"")+"</td>");
    html+="</tr>";
  });
  html+="</table>";
  document.getElementById("chart").innerHTML=html;
}

function findTrends(days,table){
  let lastRow=table.length-1;
  let trends=[];

  for(let c=0;c<days.length;c++){
    let base=table[lastRow][c];
    if(!base) continue;

    let a=parseInt(base[0]), b=parseInt(base[1]);

    // check angles
    let angles=[[ -1,-1 ],[ -1,1 ],[ -2,-2 ],[ -2,2 ]];

    angles.forEach(([dr,dc])=>{
      let hits=[];
      for(let r=0;r<table.length;r++){
        let nr=r+dr, nc=c+dc;
        if(nr<0||nc<0||nc>=days.length) continue;
        let v=table[r][c];
        let t=table[nr]?.[nc];
        if(!v||!t) continue;

        let x=parseInt(v[0]), y=parseInt(v[1]);
        let p=parseInt(t[0]), q=parseInt(t[1]);

        if(
          (x===a && y===b) ||
          (isFamily(x,a)&&isFamily(y,b))
        ){
          hits.push({r,c,nr,nc,val:v});
        }
      }
      if(hits.length>1){
        trends.push({base,day:days[c],angle:`${dr},${dc}`,count:hits.length,hits});
      }
    });
  }

  showResults(trends);
}

function showResults(trends){
  let box=document.getElementById("results");
  if(trends.length===0){
    box.innerHTML="<b>No family trend found</b>";
    return;
  }
  let html="<h4>Trend List</h4><ul>";
  trends.forEach((t,i)=>{
    html+=`<li class="match" onclick="showPopup(${i})">
      Base ${t.base} | Day ${t.day} | Angle ${t.angle} | Count ${t.count}
    </li>`;
  });
  html+="</ul>";
  box.innerHTML=html;
  window._TRENDS=trends;
}

function showPopup(i){
  let t=_TRENDS[i];
  let html=`<b>Base Jodi:</b> ${t.base}<br>
            <b>Day:</b> ${t.day}<br>
            <b>Angle:</b> ${t.angle}<br>
            <b>Total:</b> ${t.count}<hr>`;
  t.hits.forEach(h=>{
    html+=`Row ${h.r+1} → ${h.val}<br>`;
  });
  document.getElementById("popupData").innerHTML=html;
  document.getElementById("popup").style.display="flex";
}
</script>

</body>
</html>
