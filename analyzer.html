<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔥 iSmart Analyzer – Full Version</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f4f4;
  padding:10px;
}
h1{ text-align:center; }

textarea{
  width:100%;
  height:140px;
  font-family:monospace;
  font-size:14px;
}

button{
  padding:10px 14px;
  margin:5px;
  cursor:pointer;
  font-size:14px;
}

table{
  border-collapse:collapse;
  width:100%;
  background:#fff;
  margin-top:10px;
}
th,td{
  border:1px solid #999;
  padding:6px;
  text-align:center;
  cursor:pointer;
  user-select:none;
}
th{ background:#222; color:#fff; }
td.blank{ background:#eee; color:#999; }

td.highlight{ background:#ffe066; }
td.trend{ background:#90caf9; }

#popup{
  display:none;
  position:fixed;
  top:5%;
  left:5%;
  right:5%;
  bottom:5%;
  background:#fff;
  border:2px solid #000;
  z-index:9999;
  overflow:auto;
  padding:10px;
}
#popupClose{
  float:right;
  font-size:18px;
  cursor:pointer;
  color:red;
}

canvas{
  border:1px solid #000;
  margin-top:10px;
}
</style>
</head>

<body>

<h1>🔥 iSmart Analyzer (AI + Trend)</h1>

<textarea id="dataInput" placeholder="Mon Tue Wed Thu Fri Sat
51 29 50 18 84 17
99 96 33 96 67 26
** 17 88 99 28 96"></textarea>

<br>
<button onclick="generate()">Generate</button>
<button onclick="saveData()">Save</button>
<button onclick="clearData()">Clear</button>

<div id="tableArea"></div>

<canvas id="trendCanvas" width="1200" height="400"></canvas>

<!-- POPUP -->
<div id="popup">
  <span id="popupClose" onclick="closePopup()">✖</span>
  <h3>Trend / Check-Line View</h3>
  <div id="popupContent"></div>
</div>

<script>
let tableData=[];

function generate(){
  const raw=document.getElementById("dataInput").value.trim();
  if(!raw){ alert("Data paste karo"); return; }

  const lines=raw.split(/\n+/);
  tableData=[];
  for(let i=1;i<lines.length;i++){
    tableData.push(lines[i].trim().split(/\s+/));
  }
  drawTable();
}

function drawTable(){
  let html='<table><tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr>';
  tableData.forEach((row,r)=>{
    html+='<tr>';
    for(let c=0;c<6;c++){
      let val=row[c] || "**";
      let cls=(val==="**")?'blank':'';
      html+=`<td class="${cls}" onclick="cellClick(${r},${c})">${val}</td>`;
    }
    html+='</tr>';
  });
  html+='</table>';
  document.getElementById("tableArea").innerHTML=html;
}

function cellClick(r,c){
  const val=tableData[r][c];
  if(val==="**" || !val){
    blankBoxAI(r,c);
  }else{
    showTrend(r,c);
  }
}

function family(j){
  if(j==="**") return [];
  const a=j[0],b=j[1];
  return [a+b,b+a];
}

function showTrend(r,c){
  const base=tableData[r][c];
  const fam=family(base);
  let matches=[];
  tableData.forEach((row,i)=>{
    if(i===r) return;
    if(fam.includes(row[c])) matches.push({row:i,val:row[c]});
  });

  if(matches.length===0){
    alert("Pattern ke liye data kam hai");
    return;
  }

  drawTrendLine(r,c,matches);
  popupTrend(base,matches);
}

function drawTrendLine(r,c,matches){
  const canvas=document.getElementById("trendCanvas");
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="blue";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(50+c*180,50+r*30);
  matches.forEach(m=>{
    ctx.lineTo(50+c*180,50+m.row*30);
  });
  ctx.stroke();
}

function popupTrend(base,matches){
  let html=`<b>Base Jodi:</b> ${base}<br><br>`;
  matches.forEach(m=>{
    html+=`Row ${m.row+1} → ${m.val}<br>`;
  });
  document.getElementById("popupContent").innerHTML=html;
  document.getElementById("popup").style.display="block";
}

function blankBoxAI(r,c){
  // AI logic (rule-based)
  let freq={};
  tableData.forEach(row=>{
    const v=row[c];
    if(v && v!=="**"){
      freq[v]=(freq[v]||0)+1;
    }
  });
  let sorted=Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0,4);
  let html="<b>AI Strong Jodi Suggestion:</b><br>";
  sorted.forEach(j=>{
    html+=j+" (family: "+family(j).join(", ")+")<br>";
  });
  document.getElementById("popupContent").innerHTML=html;
  document.getElementById("popup").style.display="block";
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}

function saveData(){
  localStorage.setItem("ismartData",document.getElementById("dataInput").value);
  alert("Data Saved");
}
function clearData(){
  localStorage.removeItem("ismartData");
  location.reload();
}

window.onload=function(){
  const d=localStorage.getItem("ismartData");
  if(d) document.getElementById("dataInput").value=d;
};
</script>

</body>
</html>
