<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔥 iSmart Real Chart Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:10px}
h1{text-align:center}
textarea{width:100%;height:120px;font-size:14px}
button{padding:10px 14px;margin:5px;font-size:14px;cursor:pointer}
table{border-collapse:collapse;width:100%;background:#fff;margin-top:10px}
th,td{border:1px solid #ccc;padding:6px;text-align:center;position:relative}
th{background:#222;color:#fff}
td.jodi{cursor:pointer;font-weight:bold}
td.blank{background:#eee;cursor:pointer}
td.active{background:#ffe082}
svg{position:absolute;top:0;left:0;pointer-events:none}
#popup{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.6);display:none;z-index:999
}
#popupContent{
  background:#fff;margin:5%;padding:10px;position:relative
}
.close{position:absolute;top:5px;right:10px;cursor:pointer;font-size:18px}
.line{stroke:blue;stroke-width:3}
.circle{fill:none;stroke:red;stroke-width:3}
</style>
</head>

<body>

<h1>🔥 iSmart REAL Chart Analyzer</h1>

<textarea id="input">
Mon Tue Wed Thu Fri Sat
51 29 50 18 84 17
99 96 33 96 67 26
** 17 88 99 28 96
86 16 63 94 53 **
</textarea>

<button onclick="generate()">Generate</button>
<button onclick="saveData()">Save</button>
<button onclick="addRow()">Add Blank Row</button>

<div id="tableWrap"></div>

<div id="popup">
  <div id="popupContent">
    <span class="close" onclick="closePopup()">✖</span>
    <h3>Trend Preview</h3>
    <div id="popupChart"></div>
  </div>
</div>

<script>
const days=["Mon","Tue","Wed","Thu","Fri","Sat"];
const family={1:6,2:7,3:8,4:9,5:0,6:1,7:2,8:3,9:4,0:5};

let grid=[];

function generate(){
  grid=[];
  const lines=document.getElementById("input").value.trim().split("\n");
  for(let i=1;i<lines.length;i++){
    grid.push(lines[i].split(/\s+/));
  }
  render();
}

function render(){
  let html='<table><tr>';
  days.forEach(d=>html+=`<th>${d}</th>`);
  html+='</tr>';

  grid.forEach((row,r)=>{
    html+='<tr>';
    row.forEach((v,c)=>{
      const cls=(v==="**"?"blank":"jodi");
      html+=`<td class="${cls}" onclick="cellClick(${r},${c})">${v}</td>`;
    });
    html+='</tr>';
  });
  html+='</table>';
  document.getElementById("tableWrap").innerHTML=html;
}

function cellClick(r,c){
  document.querySelectorAll("td").forEach(td=>td.classList.remove("active"));
  const td=document.querySelectorAll("tr")[r+1].children[c];
  td.classList.add("active");

  if(grid[r][c]==="**"){
    showSuggestions(r,c);
  }else{
    drawTrend(r,c);
  }
}

function drawTrend(r,c){
  let pts=[];
  let val=grid[r][c];
  for(let i=r-1;i>=0;i--){
    if(grid[i][c]===val || grid[i][c]==family[val[0]]+family[val[1]]){
      pts.push([i,c]);
    }
  }
  openPopup(pts);
}

function showSuggestions(r,c){
  let base=[];
  for(let i=r-1;i>=0 && base.length<4;i--){
    let v=grid[i][c];
    if(v!=="**") base.push(v);
  }
  alert("Strong Jodi Suggestion:\n"+base.join(", "));
}

function openPopup(points){
  const wrap=document.getElementById("popupChart");
  wrap.innerHTML=document.getElementById("tableWrap").innerHTML;
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("width","100%");
  svg.setAttribute("height","100%");
  svg.style.position="absolute";

  const cells=wrap.querySelectorAll("td");
  let prev=null;
  points.forEach(p=>{
    const cell=cells[(p[0])*6+p[1]];
    const r=cell.getBoundingClientRect();
    if(prev){
      const line=document.createElementNS(svg.namespaceURI,"line");
      line.setAttribute("x1",prev.x);
      line.setAttribute("y1",prev.y);
      line.setAttribute("x2",r.left+r.width/2);
      line.setAttribute("y2",r.top+r.height/2);
      line.setAttribute("class","line");
      svg.appendChild(line);
    }
    prev={x:r.left+r.width/2,y:r.top+r.height/2};
    const cir=document.createElementNS(svg.namespaceURI,"circle");
    cir.setAttribute("cx",prev.x);
    cir.setAttribute("cy",prev.y);
    cir.setAttribute("r",12);
    cir.setAttribute("class","circle");
    svg.appendChild(cir);
  });
  wrap.appendChild(svg);
  document.getElementById("popup").style.display="block";
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}

function saveData(){
  localStorage.setItem("chart",JSON.stringify(grid));
  alert("Data Saved");
}

function addRow(){
  grid.push(["**","**","**","**","**","**"]);
  render();
}

window.onload=()=>{
  const s=localStorage.getItem("chart");
  if(s){grid=JSON.parse(s);render();}
};
</script>

</body>
</html>
