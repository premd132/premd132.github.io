<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jodi Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6fb;
  margin:0;
  padding:10px;
}
h2{text-align:center}

#bubbleWrap{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin:15px 0;
}

.bubble{
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

#tableWrap{
  position:relative;
  margin-top:20px;
  overflow-x:auto;
}

table{
  border-collapse:collapse;
  margin:auto;
  background:#fff;
}

td{
  border:1px solid #ccc;
  width:45px;
  height:35px;
  text-align:center;
  font-weight:bold;
}

td.selected{
  background:#3b82f6;
  color:#fff;
}

svg{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
</style>
</head>

<body>

<h2 id="title">Analyzer</h2>

<div id="bubbleWrap"></div>

<div id="tableWrap">
  <svg id="lines"></svg>
</div>

<script>
// ================= GAME & RECORD LOAD =================
const game = localStorage.getItem("currentGame") || "kalyan";
document.getElementById("title").innerText =
  game.replace("_"," ").toUpperCase();

const recordText =
  localStorage.getItem("record_" + game) || "";

// ================= GLOBAL =================
let rows = [];
let cells = [];
let current = null;

const bubbleWrap = document.getElementById("bubbleWrap");
const tableWrap  = document.getElementById("tableWrap");
const lines      = document.getElementById("lines");

// ================= PARSE RECORD =================
function parse(){
  rows = [];
  recordText.trim().split("\n").forEach(line=>{
    const p = line.trim().split(/\s+/);
    if(p.length > 1){
      rows.push(p.slice(1).map(Number));
    }
  });
}

// ================= BUILD TABLE =================
function buildTable(){
  tableWrap.innerHTML = "";
  cells = [];

  const table = document.createElement("table");

  rows.forEach((row,r)=>{
    const tr = document.createElement("tr");
    row.forEach((num,c)=>{
      const td = document.createElement("td");
      td.innerText = num;

      cells.push({
        td: td,
        val: num,
        row: r,
        col: c
      });

      tr.appendChild(td);
    });
    table.appendChild(tr);
  });

  tableWrap.appendChild(table);
  tableWrap.appendChild(lines);
}

// ================= BUILD BUBBLES =================
function buildBubbles(){
  bubbleWrap.innerHTML = "";
  const freq = {};

  rows.flat().forEach(n=>{
    freq[n] = (freq[n] || 0) + 1;
  });

  Object.keys(freq).forEach(k=>{
    const size = 40 + freq[k] * 8;
    const b = document.createElement("div");
    b.className = "bubble";
    b.style.width = b.style.height = size + "px";
    b.style.background = `hsl(${k*4},70%,50%)`;
    b.innerText = k;
    b.onclick = ()=> selectJodi(Number(k));
    bubbleWrap.appendChild(b);
  });
}

// ================= SELECT JODI =================
function selectJodi(jodi){
  current = jodi;
  draw();
}

// ================= DRAW HIGHLIGHT & LINE =================
function draw(){
  document.querySelectorAll("td").forEach(td=>{
    td.classList.remove("selected");
  });
  lines.innerHTML = "";

  if(current === null) return;

  const hits = cells.filter(c => c.val === current);

  hits.forEach(h=>{
    h.td.classList.add("selected");
  });

  for(let i=0;i<hits.length-1;i++){
    connect(hits[i].td, hits[i+1].td);
  }
}

// ================= CONNECT CURVE =================
function connect(a,b){
  const r1 = a.getBoundingClientRect();
  const r2 = b.getBoundingClientRect();
  const p  = tableWrap.getBoundingClientRect();

  const x1 = r1.left + r1.width/2  - p.left;
  const y1 = r1.top  + r1.height/2 - p.top;
  const x2 = r2.left + r2.width/2  - p.left;
  const y2 = r2.top  + r2.height/2 - p.top;

  const path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute(
    "d",
    `M ${x1} ${y1} C ${x1+80} ${y1}, ${x2-80} ${y2}, ${x2} ${y2}`
  );
  path.setAttribute("stroke","#dc2626");
  path.setAttribute("stroke-width","3");
  path.setAttribute("fill","none");
  lines.appendChild(path);
}

// ================= INIT =================
parse();
buildTable();
buildBubbles();
</script>

</body>
</html>
