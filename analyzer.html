<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>👑 Jodi Analyzer – PRO MAX</title>
<style>
body{font-family:Arial;background:#f4f6fb;margin:0;padding:10px}
h2{text-align:center}
textarea{width:100%;height:140px;font-size:14px}
button{padding:10px 14px;margin:5px;border:0;border-radius:6px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:15px}
.cell{background:#fff;padding:8px;text-align:center;border-radius:6px;border:1px solid #ccc;cursor:pointer}
.cell.active{background:#ffe0e0;border:2px solid red}
svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.bubbles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:15px 0}
.bubble{border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:15px;background:#fff}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#222;color:#fff}
.prediction{background:#dff0d8;padding:10px;margin-top:10px;border-radius:6px}
</style>
</head>

<body>

<h2>👑 Jodi Analyzer – PRO MAX</h2>

<textarea id="record">
27/10/25 59 44 59 42 90
03/11/25 55 02 93 00 05
10/11/25 91 10 84 20 84
17/11/25 52 96 53 11 70
24/11/25 91 07 67 79 09
01/12/25 78 52 12 72 64
08/12/25 16 43 78 91 27
15/12/25 64 30 97 55 97
22/12/25 33 38 53 32 84
</textarea>

<button onclick="load()">Load Record</button>

<div style="position:relative">
<svg id="lines"></svg>
<div id="grid" class="grid"></div>
</div>

<h3 style="text-align:center">AI Generated Bubbles</h3>
<div id="bubbles" class="bubbles"></div>

<h3 style="text-align:center">Check Line</h3>
<table id="table">
<tr>
<th>Base Jodi</th>
<th>Touch</th>
<th>After Result</th>
<th>Times</th>
</tr>
</table>

<div id="prediction" class="prediction"></div>

<script>
let rows=[],cells=[],current=null;

function load(){
  const raw=document.getElementById('record').value.trim().split('\n');
  rows=raw.map(r=>r.trim().split(/\s+/).slice(1));
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  cells=[];
  rows.forEach((r,ri)=>{
    r.forEach((v,ci)=>{
      const d=document.createElement('div');
      d.className='cell';
      d.textContent=v;
      d.onclick=()=>select(v,ri,ci,d);
      grid.appendChild(d);
      cells.push({el:d,val:v,row:ri,col:ci});
    });
  });
}

function select(val,ri,ci,el){
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('lines').innerHTML='';
  document.getElementById('bubbles').innerHTML='';
  document.getElementById('table').innerHTML=
    '<tr><th>Base Jodi</th><th>Touch</th><th>After Result</th><th>Times</th></tr>';
  document.getElementById('prediction').innerHTML='';
  draw(val);
}

function draw(val){
  const hits=cells.filter(c=>c.val===val).slice(-3); // LINE LIMIT 3
  const after=[];
  hits.forEach((h,i)=>{
    const nextRow=h.row+1;
    if(rows[nextRow]){
      const next=rows[nextRow][h.col];
      after.push({touch:i+1,val:next});
      line(h.el,nextCell(h.row+1,h.col));
    }
  });
  bubbles(after);
  table(val,after);
}

function nextCell(r,c){
  return cells.find(x=>x.row===r && x.col===c)?.el;
}

function line(a,b){
  if(!a||!b)return;
  const r1=a.getBoundingClientRect();
  const r2=b.getBoundingClientRect();
  const svg=document.getElementById('lines');
  const p=document.createElementNS("http://www.w3.org/2000/svg","path");
  const d=`M ${r1.x+r1.width/2} ${r1.y+r1.height/2}
           Q ${(r1.x+r2.x)/2} ${(r1.y+r2.y)/2-40}
           ${r2.x+r2.width/2} ${r2.y+r2.height/2}`;
  p.setAttribute("d",d);
  p.setAttribute("stroke","red");
  p.setAttribute("fill","none");
  p.setAttribute("stroke-width","2");
  svg.appendChild(p);
}

function bubbles(after){
  const freq={};
  after.forEach(a=>freq[a.val]=(freq[a.val]||0)+1);
  const box=document.getElementById('bubbles');
  Object.keys(freq).forEach(v=>{
    const b=document.createElement('div');
    const size=40+freq[v]*15;
    b.className='bubble';
    b.style.width=b.style.height=size+'px';
    b.style.background='hsl('+v*4+',70%,50%)';
    b.innerText=v;
    b.title=`Value ${v} – ${freq[v]} times`;
    box.appendChild(b);
  });
}

function table(base,after){
  const freq={};
  after.forEach(a=>freq[a.val]=(freq[a.val]||0)+1);
  const t=document.getElementById('table');
  Object.keys(freq).forEach(v=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${base}</td><td>After Result</td><td>${v}</td><td>${freq[v]}</td>`;
    t.appendChild(tr);
  });
  predict(freq);
}

function predict(freq){
  let max=0,best='';
  Object.keys(freq).forEach(v=>{
    if(freq[v]>max){max=freq[v];best=v;}
  });
  if(best){
    document.getElementById('prediction').innerHTML=
      `🔥 <b>Strong Prediction:</b> ${best} <br> Appeared <b>${max}</b> times after same line`;
  }
}
</script>

</body>
</html>
