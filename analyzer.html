<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DPBOSS Style Line Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:12px;
  font-family:Arial,sans-serif;
  background:#f4f6fb;color:#000;
}
h2,h3{text-align:center;margin:8px 0}
.note{text-align:center;color:#b91c1c;font-size:12px}

/* Table */
#wrap{
  background:#fff;padding:10px;
  overflow-x:auto;border-radius:8px;
}
table{border-collapse:collapse;min-width:640px;margin:auto}
td{
  border:1px solid #111;
  width:44px;height:34px;
  text-align:center;font-weight:bold;
  cursor:pointer;
}
td.sel{background:#2563eb;color:#fff}

/* Bubbles */
#bubbleBox{
  display:flex;gap:10px;
  flex-wrap:wrap;justify-content:center;
  margin:12px 0;
}
.bubble{
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:bold;
}

/* After list */
#after{
  max-width:420px;margin:12px auto;
}
.box{
  background:#e5e7eb;
  padding:8px;margin:6px 0;
  border-radius:6px;
  display:flex;justify-content:space-between;
}
.empty{text-align:center;color:#555}
</style>
</head>

<body>

<h2 id="title">ANALYZER</h2>
<div class="note">Past record based reference only</div>

<h3>Record Table</h3>
<div id="wrap"></div>

<h3>Line ke baad jo aaya (Bubbles)</h3>
<div id="bubbleBox"></div>

<h3>Detail List</h3>
<div id="after"></div>

<script>
// ===== LOAD GAME & RECORD =====
const game = localStorage.getItem("currentGame") || "kalyan";
document.getElementById("title").innerText =
  game.replace("_"," ").toUpperCase();

const text = localStorage.getItem("record_"+game) || "";

// ===== PARSE RECORD =====
let rows=[];
text.split("\n").forEach(l=>{
  const p=l.trim().split(/\s+/);
  if(p.length>1) rows.push(p.slice(1).map(Number));
});

// ===== BUILD TABLE =====
const wrap=document.getElementById("wrap");
if(!rows.length){
  wrap.innerHTML="<div class='empty'>No record found</div>";
}
const table=document.createElement("table");
rows.forEach((r,ri)=>{
  const tr=document.createElement("tr");
  r.forEach((n,ci)=>{
    const td=document.createElement("td");
    td.innerText=n;
    td.onclick=()=>selectLine(ri,ci,td);
    tr.appendChild(td);
  });
  table.appendChild(tr);
});
wrap.appendChild(table);

// ===== SELECT LINE =====
function selectLine(r,c,td){
  document.querySelectorAll("td").forEach(x=>x.classList.remove("sel"));
  td.classList.add("sel");

  if(c+1>=rows[r].length) return;
  const line=[rows[r][c], rows[r][c+1]];
  analyzeLine(line);
}

// ===== ANALYZE LINE =====
function analyzeLine(line){
  const resultCount={};

  for(let r=0;r<rows.length-1;r++){
    for(let c=0;c<rows[r].length-1;c++){
      if(rows[r][c]===line[0] && rows[r][c+1]===line[1]){
        const next=rows[r+1][c];
        resultCount[next]=(resultCount[next]||0)+1;
      }
    }
  }

  showAfterList(resultCount);
  showBubbles(resultCount);
}

// ===== SHOW LIST =====
function showAfterList(obj){
  const after=document.getElementById("after");
  after.innerHTML="";
  if(Object.keys(obj).length===0){
    after.innerHTML="<div class='empty'>No past result</div>";
    return;
  }
  Object.keys(obj).forEach(k=>{
    const d=document.createElement("div");
    d.className="box";
    d.innerHTML=`<span>${k}</span><span>${obj[k]} times</span>`;
    after.appendChild(d);
  });
}

// ===== SHOW BUBBLES (ONLY AFTER CLICK) =====
function showBubbles(obj){
  const bubbleBox=document.getElementById("bubbleBox");
  bubbleBox.innerHTML="";

  Object.keys(obj).forEach(k=>{
    const size=36 + obj[k]*8;
    const b=document.createElement("div");
    b.className="bubble";
    b.style.width=b.style.height=size+"px";
    b.style.background="linear-gradient(135deg,#2563eb,#1e40af)";
    b.innerText=k;
    bubbleBox.appendChild(b);
  });
}
</script>

</body>
</html>
