<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔥 iSmart Analyzer – Photo Style Trend</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f4f4f4}
h1{text-align:center}
textarea{width:100%;height:140px;font-family:monospace}
button{padding:10px 14px;margin:5px;font-size:14px;cursor:pointer}

table{border-collapse:collapse;width:100%;background:white;position:relative;z-index:5}
th,td{
  border:1px solid #999;
  padding:6px;
  text-align:center;
  min-width:42px;
  cursor:pointer;
}
th{background:#222;color:#fff}
td.blank{background:#eee}

canvas{
  position:absolute;
  top:0;left:0;
  z-index:0;
  pointer-events:none;
}

#popup{
  position:fixed;
  inset:5%;
  background:white;
  border:4px solid #000;
  display:none;
  z-index:9999;
  overflow:auto;
}
#popupClose{
  position:fixed;
  top:6%;right:6%;
  background:red;color:white;
  font-size:18px;
}
</style>
</head>

<body>

<h1>🔥 iSmart Analyzer (Photo Style)</h1>

<textarea id="dataInput" placeholder="Excel se copy-paste yahan karo"></textarea>
<button onclick="generate()">Generate</button>
<button onclick="saveData()">Save</button>
<button onclick="clearAll()">Clear</button>

<div style="position:relative">
  <table id="chart"></table>
  <canvas id="canvas"></canvas>
</div>

<div id="popup">
  <button id="popupClose" onclick="closePopup()">X</button>
  <div id="popupContent"></div>
</div>

<script>
const days=["Mon","Tue","Wed","Thu","Fri","Sat"];
let grid=[],rows=0,cols=6;
let activeLines=[];

function clean(v){
  if(!v) return "**";
  v=v.toString().trim();
  if(v.includes("*")||isNaN(v)) return "**";
  return v.padStart(2,"0");
}

function generate(){
  grid=[];
  let raw=dataInput.value.trim().split("\n");
  raw.forEach(r=>{
    let row=r.split(/\s+/).map(clean);
    while(row.length<6) row.push("**");
    grid.push(row);
  });
  rows=grid.length;
  drawTable();
  resizeCanvas();
}

function drawTable(){
  chart.innerHTML="";
  let h=document.createElement("tr");
  days.forEach(d=>{let th=document.createElement("th");th.textContent=d;h.appendChild(th)});
  chart.appendChild(h);

  grid.forEach((r,i)=>{
    let tr=document.createElement("tr");
    r.forEach((v,j)=>{
      let td=document.createElement("td");
      td.textContent=v;
      if(v==="**") td.classList.add("blank");
      td.onclick=()=>cellClick(i,j);
      tr.appendChild(td);
    });
    chart.appendChild(tr);
  });
}

function resizeCanvas(){
  canvas.width=chart.offsetWidth;
  canvas.height=chart.offsetHeight;
}

function family(n){
  let a=+n[0],b=+n[1];
  return [a,b,(a+b)%10,(a+9)%10,(b+9)%10];
}

function match(a,b){
  if(a==="**"||b==="**") return false;
  let fa=family(a),fb=family(b);
  return fa.some(x=>fb.includes(x));
}

function cellClick(r,c){
  clearCanvas();
  if(grid[r][c]==="**") blankTrend(r,c);
  else jodiPopup(r,c);
}

function blankTrend(r,c){
  let pattern=[];
  for(let i=r-1;i>=0&&pattern.length<10;i--){
    if(grid[i][c]!=="**") pattern.push(grid[i][c]);
  }
  if(pattern.length<4){alert("Pattern ke liye data kam hai");return;}
  search(pattern,c);
}

function search(pat,col){
  for(let r=0;r<rows-pat.length;r++){
    let ok=true;
    for(let k=0;k<pat.length;k++){
      if(!grid[r+k]||!match(pat[k],grid[r+k][col])){ok=false;break;}
    }
    if(ok) drawZigZag(r,col,pat.length);
  }
}

function drawZigZag(r,c,len){
  let ctx=canvas.getContext("2d");
  ctx.strokeStyle="blue";
  ctx.lineWidth=3;
  ctx.beginPath();
  for(let i=0;i<=len;i++){
    let p=center(r+i,c);
    if(i==0) ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();
}

function center(r,c){
  let cell=chart.rows[r+1].cells[c];
  let cr=cell.getBoundingClientRect();
  let tr=chart.getBoundingClientRect();
  return {x:cr.left-tr.left+cr.width/2,y:cr.top-tr.top+cr.height/2};
}

function clearCanvas(){
  canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
}

function jodiPopup(r,c){
  popupContent.innerHTML=chart.outerHTML;
  popup.style.display="block";
}

function closePopup(){popup.style.display="none"}

function saveData(){
  localStorage.setItem("ismart",dataInput.value);
  alert("Saved");
}
function clearAll(){
  localStorage.removeItem("ismart");
  location.reload();
}

window.onload=()=>{
  let d=localStorage.getItem("ismart");
  if(d){dataInput.value=d;generate();}
}
</script>

</body>
</html>
