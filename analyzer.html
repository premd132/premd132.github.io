<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🔥 Jodi Analyzer – PRO MAX X8</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
header{
  position:sticky;top:0;background:#111;color:#fff;
  padding:10px;text-align:center;font-weight:bold;z-index:10
}
.container{padding:10px}
textarea,input,select,button{
  width:100%;padding:10px;margin:6px 0;font-size:16px
}
button{background:#222;color:#fff;border:none;border-radius:4px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{
  border:1px solid #777;padding:6px;text-align:center;
  min-width:40px;font-weight:bold
}
th{background:#ddd}
td.hit{background:#ffe066}
#wrapper{position:relative}
#svg{position:absolute;top:0;left:0;pointer-events:none}

.bubble{
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:50%;background:#444;color:#fff;
  margin:4px;font-size:14px;font-weight:bold
}
.box{
  background:#fff;border:2px solid #333;
  padding:10px;margin-top:10px
}
.badge{background:#000;color:#fff;padding:4px 8px;border-radius:4px}
.safe{background:#0a7}
.star{color:red}
</style>
</head>

<body>

<header>🔥 Jodi Analyzer – PRO MAX (6•7•8)</header>

<div class="container">

<select id="game">
  <option value="milan">Milan Day</option>
  <option value="kalyan">Kalyan</option>
  <option value="rajdhani">Rajdhani Night</option>
</select>

<input type="file" accept=".csv" onchange="importCSV(this)">
<textarea id="input" placeholder="Paste record OR upload CSV"></textarea>

<input id="pattern" placeholder="Pattern filter (example: 4-5, 6-7)">
<button onclick="generate()">Generate</button>

<div id="wrapper">
  <svg id="svg"></svg>
  <table id="tbl"></table>
</div>

<div id="after" class="box" style="display:none"></div>
<div id="finalBox" class="box" style="display:none"></div>

</div>

<script>
let grid=[],cells=[],selected=null;

function importCSV(f){
  const file=f.files[0];
  if(!file) return;
  const r=new FileReader();
  r.onload=e=>{
    const lines=e.target.result.trim().split(/\n+/);
    lines.shift(); // remove header
    input.value=lines.map(l=>l.replace(/,/g," ")).join("\n");
  };
  r.readAsText(file);
}

function generate(){
  grid=[];cells=[];tbl.innerHTML="";svg.innerHTML="";
  after.style.display="none";finalBox.style.display="none";

  input.value.trim().split("\n").forEach(r=>{
    grid.push(r.trim().split(/\s+/));
  });

  const days=["Mon","Tue","Wed","Thu","Fri","Sat"];
  let tr=document.createElement("tr");
  days.forEach(d=>{let th=document.createElement("th");th.innerText=d;tr.appendChild(th)});
  tbl.appendChild(tr);

  grid.forEach((row,ri)=>{
    let tr=document.createElement("tr");
    row.forEach((v,ci)=>{
      let td=document.createElement("td");
      td.innerText=v;
      td.onclick=()=>selectJodi(v);
      cells.push({td,ri,ci,val:v});
      tr.appendChild(td);
    });
    tbl.appendChild(tr);
  });
}

function matchPattern(v){
  const p=pattern.value.trim();
  if(!p) return true;
  const [a,b]=p.split("-");
  return v[0]==a && v[1]==b;
}

function selectJodi(v){
  selected=v;
  cells.forEach(c=>c.td.classList.remove("hit"));
  svg.innerHTML="";
  if(!matchPattern(v)) return;

  let hits=cells.filter(c=>c.val===v && matchPattern(v));
  hits.forEach(h=>h.td.classList.add("hit"));

  const colors=["red","blue","green"];
  for(let i=0;i<Math.min(3,hits.length-1);i++){
    draw(hits[i],hits[i+1],colors[i]);
  }
  analyze(hits);
}

function draw(a,b,color){
  let r1=a.td.getBoundingClientRect();
  let r2=b.td.getBoundingClientRect();
  let p=wrapper.getBoundingClientRect();
  svg.setAttribute("width",p.width);
  svg.setAttribute("height",p.height);
  let l=document.createElementNS("http://www.w3.org/2000/svg","line");
  l.setAttribute("x1",r1.left+r1.width/2-p.left);
  l.setAttribute("y1",r1.top+r1.height/2-p.top);
  l.setAttribute("x2",r2.left+r2.width/2-p.left);
  l.setAttribute("y2",r2.top+r2.height/2-p.top);
  l.setAttribute("stroke",color);
  l.setAttribute("stroke-width","3");
  svg.appendChild(l);
}

function analyze(hits){
  let map={};
  hits.forEach(h=>{
    let n=grid[h.ri+1]?.[h.ci];
    if(n && n!=="**") map[n]=(map[n]||0)+1;
  });

  let arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  let out="<b>After Result</b><br>";
  arr.forEach(([k,v],i)=>{
    out+=`${i+1}. <span class="badge">${k}</span> → ${v}<br>`;
  });
  after.innerHTML=out;
  after.style.display="block";

  if(arr.length){
    let total=arr.reduce((s,[,v])=>s+v,0);
    let t=arr[0];
    finalBox.innerHTML=
      `<b>🔥 FINAL JODI</b><br>
       ⭐ <span class="badge">${t[0]}</span> (${((t[1]/total)*100).toFixed(1)}%)`;
    finalBox.style.display="block";
  }
}
</script>

</body>
</html>
