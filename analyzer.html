<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔥 iSmart Analyzer – Full Photo Logic</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f4f4f4;margin:0}
h2{text-align:center;margin:10px}
textarea{width:100%;height:140px;font-family:monospace}
button{padding:8px 14px;margin:4px;cursor:pointer}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{
  border:1px solid #999;
  padding:6px;
  text-align:center;
  min-width:42px;
  cursor:pointer;
  position:relative;
}
th{background:#222;color:#fff}
td.blank{background:#eee}
td.mark{
  outline:3px solid blue;
  border-radius:50%;
}
#canvas{
  position:absolute;
  top:0;left:0;
  pointer-events:none;
}
#popup{
  position:fixed;inset:0;
  background:#fff;
  display:none;z-index:9999;
  overflow:auto;
}
#popup header{
  background:#000;color:#fff;
  padding:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
#aiBox{
  padding:8px;
  background:#f0f0f0;
  border-bottom:2px solid #000;
}
</style>
</head>

<body>

<h2>🔥 iSmart Analyzer (Zig-Zag + AI + Export)</h2>

<textarea id="dataInput" placeholder="Excel se copy-paste data"></textarea>
<br>
<button onclick="generate()">Generate</button>
<button onclick="saveData()">Save</button>

<div style="position:relative">
  <table id="chart"></table>
  <canvas id="canvas"></canvas>
</div>

<div id="popup">
  <header>
    <span id="popupTitle"></span>
    <div>
      <button onclick="exportImage()">📸 Export</button>
      <button onclick="closePopup()">❌</button>
    </div>
  </header>
  <div id="aiBox"></div>
  <div id="popupBody"></div>
</div>

<script>
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat"];
let grid=[],rows=0;

function generate(){
  grid=[];
  clearAllLines();
  let raw=dataInput.value.trim().split("\n");
  raw.forEach(r=>{
    let a=r.trim().split(/\s+/);
    while(a.length<6) a.push("**");
    grid.push(a);
  });
  rows=grid.length;
  drawTable();
  resizeCanvas();
}

function drawTable(){
  let t=chart; t.innerHTML="";
  let tr=document.createElement("tr");
  DAYS.forEach(d=>{let th=document.createElement("th");th.textContent=d;tr.appendChild(th)});
  t.appendChild(tr);

  grid.forEach((r,i)=>{
    let tr=document.createElement("tr");
    r.forEach((v,j)=>{
      let td=document.createElement("td");
      td.textContent=v;
      if(v==="**") td.classList.add("blank");
      td.onclick=()=>cellClick(i,j);
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
}

function resizeCanvas(){
  canvas.width=chart.offsetWidth;
  canvas.height=chart.offsetHeight;
}

function family(j){
  let a=parseInt(j[0]),b=parseInt(j[1]);
  return [
    `${a}${b}`,
    `${(a+9)%10}${b}`,
    `${a}${(b+9)%10}`
  ];
}

function cellClick(r,c){
  if(grid[r][c]==="**") blankSearch(r,c);
  else openPopup(r,c);
}

/* 🔍 BLANK BOX SEARCH */
function blankSearch(r,c){
  clearAllLines();
  let base=[];
  for(let i=r-1;i>=0 && base.length<10;i--){
    if(grid[i][c]!=="**") base.push(grid[i][c]);
  }
  if(base.length<3){alert("Pattern kam hai");return;}

  let found=[];
  for(let i=0;i<rows;i++){
    let ok=true;
    for(let k=0;k<base.length;k++){
      if(!grid[i+k]||grid[i+k][c]==="**"){ok=false;break;}
      let f1=family(base[k]), f2=family(grid[i+k][c]);
      if(!f1.some(x=>f2.includes(x))){ok=false;break;}
    }
    if(ok) found.push(i);
  }

  found.forEach(start=>{
    mark(start,c,base.length);
    drawZigZag(start,c,base.length);
  });

  aiSuggest(base);
}

/* 🔵 MARK + LINE */
function mark(r,c,len){
  for(let i=0;i<len;i++)
    chart.rows[r+1+i].cells[c].classList.add("mark");
}

function drawZigZag(r,c,len){
  let ctx=canvas.getContext("2d");
  ctx.strokeStyle="blue"; ctx.lineWidth=4;
  ctx.beginPath();
  let p=center(r,c);
  ctx.moveTo(p.x,p.y);
  for(let i=1;i<len;i++){
    let n=center(r+i,c);
    ctx.lineTo(n.x,n.y);
  }
  ctx.stroke();
}

/* 🤖 AI SUGGESTION */
function aiSuggest(base){
  let score={};
  base.forEach(j=>{
    family(j).forEach(f=>{
      score[f]=(score[f]||0)+1;
    });
  });
  let top=Object.entries(score)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,4)
    .map(x=>x[0]);

  aiBox.innerHTML="<b>🤖 Strong Jodi Suggestion:</b> "+top.join(", ");
}

/* 📸 POPUP */
function openPopup(r,c){
  popupTitle.textContent=`Jodi ${grid[r][c]} | ${DAYS[c]} | Row ${r+1}`;
  popupBody.innerHTML="";
  popupBody.appendChild(chart.cloneNode(true));
  popup.style.display="block";
}

function exportImage(){
  let temp=document.createElement("canvas");
  temp.width=popupBody.scrollWidth;
  temp.height=popupBody.scrollHeight;
  let ctx=temp.getContext("2d");
  ctx.fillStyle="#fff";ctx.fillRect(0,0,temp.width,temp.height);
  html2canvas(popupBody).then(c=>{
    let a=document.createElement("a");
    a.href=c.toDataURL("image/png");
    a.download="ismart_pattern.png";
    a.click();
  });
}

function closePopup(){popup.style.display="none";}
function clearAllLines(){
  document.querySelectorAll(".mark").forEach(e=>e.classList.remove("mark"));
  canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
}
function center(r,c){
  let cell=chart.rows[r+1].cells[c].getBoundingClientRect();
  let base=chart.getBoundingClientRect();
  return{ x:cell.left-base.left+cell.width/2,
          y:cell.top-base.top+cell.height/2 };
}
function saveData(){
  localStorage.setItem("ismartData",dataInput.value);
  alert("Saved");
}
window.onload=()=>{
  let d=localStorage.getItem("ismartData");
  if(d){dataInput.value=d;generate();}
};
</script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</body>
</html>
