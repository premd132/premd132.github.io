<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🔥 iSmart Analyzer – REAL PATTERN LINE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#eee;margin:0}
h2{background:#111;color:#fff;margin:0;padding:8px;text-align:center}

textarea{width:100%;height:120px;font-family:monospace}
button,select,input{margin:4px;padding:6px}

table{border-collapse:collapse;width:100%;background:#fff}
th,td{
  border:1px solid #999;
  padding:6px;
  min-width:42px;
  text-align:center;
  user-select:none;
}
th{background:#222;color:#fff}

td.blank{background:#f0f0f0}
td.match{background:#ffe1e1}
td.main{outline:3px solid red}

#popup{
  position:fixed;inset:5%;
  background:#fff;
  border:4px solid #000;
  display:none;
  z-index:9999;
}
#ph{
  background:#000;color:#fff;padding:6px
}
#close{
  float:right;background:red;color:#fff;
  padding:4px 10px;cursor:pointer
}
</style>
</head>

<body>

<h2>🔥 iSmart Analyzer – Pattern LINE (Photo Logic)</h2>

<textarea id="input" placeholder="Excel se copy-paste data"></textarea>
<br>
<button onclick="generate()">Generate</button>
<button onclick="save()">Save</button>

<br>
<select id="daySel"></select>
<input id="rowSel" type="number" placeholder="Row">
<button onclick="manualSearch()">Search</button>

<table id="chart"></table>

<div id="popup">
  <div id="ph">
    <span id="pt"></span>
    <span id="close" onclick="popup.style.display='none'">X</span>
  </div>
  <div id="pb"></div>
</div>

<script>
const days=["Mon","Tue","Wed","Thu","Fri","Sat"];
let grid=[];

function generate(){
  grid=[];
  let raw=input.value.trim().split("\n");
  raw.forEach(r=>{
    let row=r.trim().split(/\s+/);
    while(row.length<6) row.push("**");
    grid.push(row);
  });
  // extra blank rows
  for(let i=0;i<10;i++) grid.push(["**","**","**","**","**","**"]);
  draw();
  fillDay();
}

function draw(){
  chart.innerHTML="";
  let tr=document.createElement("tr");
  days.forEach(d=>{
    let th=document.createElement("th");
    th.textContent=d;
    tr.appendChild(th);
  });
  chart.appendChild(tr);

  grid.forEach((r,i)=>{
    let tr=document.createElement("tr");
    r.forEach((v,j)=>{
      let td=document.createElement("td");
      td.textContent=v;
      if(v==="**") td.classList.add("blank");
      td.onclick=()=>cellClick(i,j);
      td.ondblclick=()=>edit(td,i,j);
      tr.appendChild(td);
    });
    chart.appendChild(tr);
  });
}

function edit(td,r,c){
  let v=prompt("Edit",grid[r][c]);
  if(v!==null){
    grid[r][c]=v;
    td.textContent=v;
  }
}

function cellClick(r,c){
  clearMarks();
  if(grid[r][c]==="**"){
    patternSearch(r,c);
  }else{
    showPopup(r,c);
  }
}

/* 🔥 MAIN LOGIC */
function patternSearch(r,c){
  let base=[];
  for(let i=r-1;i>=0 && base.length<9;i--){
    if(grid[i][c]!=="**") base.push(grid[i][c]);
  }
  if(base.length<4){
    alert("Pattern ke liye data kam hai");
    return;
  }

  for(let i=0;i<grid.length;i++){
    if(matchPattern(i,c,base)){
      markLine(i,c,base.length);
    }
  }
}

function matchPattern(r,c,base){
  for(let k=0;k<base.length;k++){
    if(!grid[r+k] || grid[r+k][c]==="**") return false;
    if(!sameType(grid[r+k][c],base[k])) return false;
  }
  return true;
}

/* Simple pattern rule (upgradeable) */
function sameType(a,b){
  if(a==="**"||b==="**") return false;
  let x=parseInt(a)%2;
  let y=parseInt(b)%2;
  return x===y; // odd-even flow
}

function markLine(r,c,len){
  for(let i=0;i<len;i++){
    let td=chart.rows[r+i+1].cells[c];
    td.classList.add("match");
    td.onclick=()=>showPopup(r+i,c);
  }
}

function showPopup(r,c){
  popup.style.display="block";
  pt.textContent=`Jodi ${grid[r][c]} | ${days[c]} | Row ${r+1}`;
  pb.innerHTML="";
  let t=document.createElement("table");

  for(let i=Math.max(0,r-6);i<=r+6;i++){
    if(!grid[i]) continue;
    let tr=document.createElement("tr");
    for(let j=0;j<6;j++){
      let td=document.createElement("td");
      td.textContent=grid[i][j];
      if(i===r && j===c) td.classList.add("main");
      if(chart.rows[i+1] && chart.rows[i+1].cells[j].classList.contains("match")){
        td.classList.add("match");
      }
      tr.appendChild(td);
    }
    t.appendChild(tr);
  }
  pb.appendChild(t);
}

function clearMarks(){
  document.querySelectorAll("td").forEach(td=>{
    td.classList.remove("match","main");
  });
}

function fillDay(){
  daySel.innerHTML="";
  days.forEach((d,i)=>{
    let o=document.createElement("option");
    o.value=i;o.textContent=d;
    daySel.appendChild(o);
  });
}

function manualSearch(){
  let r=rowSel.value-1;
  let c=daySel.value;
  if(grid[r] && grid[r][c]) showPopup(r,c);
}

function save(){
  localStorage.setItem("ismart",input.value);
  alert("Saved");
}

window.onload=()=>{
  let d=localStorage.getItem("ismart");
  if(d){input.value=d;generate();}
}
</script>

</body>
</html>
