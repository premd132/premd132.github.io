<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iSmart Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2 style="text-align:center">🔥 iSmart Analyzer (Photo Style)</h2>

<textarea id="dataInput" placeholder="Excel se copy-paste karo (Mon Tue Wed Thu Fri Sat)"></textarea>
<br>
<button onclick="generate()">Generate</button>
<button onclick="saveData()">Save</button>
<button onclick="addRow()">Add Blank Row</button>

<div class="table-wrap">
  <canvas id="canvas"></canvas>
  <table id="chart"></table>
</div>

<div class="popup" id="popup">
  <div class="popup-close" onclick="closePopup()">X</div>
  <div id="popupContent"></div>
</div>

<script>
/* ===== CONFIG ===== */
const days=["Mon","Tue","Wed","Thu","Fri","Sat"];
const familyMap={0:5,1:6,2:7,3:8,4:9,5:0,6:1,7:2,8:3,9:4};

let grid=[];

/* ===== UTIL ===== */
function clean(v){
  if(!v) return "**";
  v=v.toString().trim();
  if(v.includes("*") || isNaN(v)) return "**";
  return v.padStart(2,"0");
}
function family(n){
  return [
    n,
    familyMap[n[0]]+n[1],
    n[0]+familyMap[n[1]]
  ];
}
function match(a,b){
  if(a==="**"||b==="**") return false;
  return family(a).includes(b) || family(b).includes(a);
}

/* ===== GENERATE ===== */
function generate(){
  grid=[];
  let rows=dataInput.value.trim().split("\n");
  rows.forEach(r=>{
    let row=r.split(/\s+/).map(clean);
    while(row.length<6) row.push("**");
    grid.push(row);
  });
  drawTable();
  resizeCanvas();
}

function drawTable(){
  chart.innerHTML="";
  let tr=document.createElement("tr");
  days.forEach(d=>{
    let th=document.createElement("th");
    th.textContent=d;
    tr.appendChild(th);
  });
  chart.appendChild(tr);

  grid.forEach((r,i)=>{
    let tr=document.createElement("tr");
    r.forEach((v,j)=>{
      let td=document.createElement("td");
      td.textContent=v;
      td.className=(v==="**")?"blank":"";
      td.onclick=()=>cellClick(i,j);
      tr.appendChild(td);
    });
    chart.appendChild(tr);
  });
}

/* ===== CLICK HANDLER ===== */
function cellClick(r,c){
  clearCanvas();
  if(grid[r][c]==="**") blankTrend(r,c);
  else jodiPopup();
}

/* ===== BLANK TREND ===== */
function blankTrend(r,c){
  let pattern=[];
  for(let i=r-1;i>=0 && pattern.length<10;i--){
    if(grid[i][c]!=="**") pattern.push(grid[i][c]);
  }
  if(pattern.length<4){
    alert("Pattern ke liye data kam hai");
    return;
  }
  searchPattern(pattern,c);
}

/* ===== SEARCH + DRAW ===== */
function searchPattern(pat,col){
  for(let r=0;r<grid.length-pat.length;r++){
    let ok=true;
    for(let k=0;k<pat.length;k++){
      if(!grid[r+k] || !match(pat[k],grid[r+k][col])){
        ok=false;break;
      }
    }
    if(ok) drawLine(r,col,pat.length);
  }
}

function drawLine(r,c,len){
  let ctx=canvas.getContext("2d");
  ctx.strokeStyle="blue";
  ctx.lineWidth=3;
  ctx.beginPath();
  for(let i=0;i<=len;i++){
    let p=center(r+i,c);
    if(i==0) ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();
}

/* ===== HELPERS ===== */
function center(r,c){
  let cell=chart.rows[r+1].cells[c];
  let cr=cell.getBoundingClientRect();
  let tr=chart.getBoundingClientRect();
  return{
    x:cr.left-tr.left+cr.width/2,
    y:cr.top-tr.top+cr.height/2
  };
}
function resizeCanvas(){
  canvas.width=chart.offsetWidth;
  canvas.height=chart.offsetHeight;
}
function clearCanvas(){
  canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
}

/* ===== POPUP ===== */
function jodiPopup(){
  popupContent.innerHTML=chart.outerHTML;
  popup.style.display="block";
}
function closePopup(){ popup.style.display="none"; }

/* ===== DATA ===== */
function saveData(){
  localStorage.setItem("ismartData",dataInput.value);
  alert("Saved");
}
function addRow(){
  grid.push(["**","**","**","**","**","**"]);
  drawTable();
}

/* ===== LOAD ===== */
window.onload=()=>{
  let d=localStorage.getItem("ismartData");
  if(d){ dataInput.value=d; generate(); }
};
</script>

</body>
</html>
