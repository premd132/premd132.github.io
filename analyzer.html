<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🔥 iSmart Analyzer – Photo Style FINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial;
  background:#f2f2f2;
  margin:0;
}
h1{
  text-align:center;
  background:#111;
  color:#fff;
  margin:0;
  padding:10px;
}
textarea{
  width:100%;
  height:130px;
  font-family:monospace;
  font-size:14px;
}
button{
  padding:8px 14px;
  margin:4px;
  font-size:14px;
}
#wrap{
  position:relative;
  overflow:auto;
}
table{
  border-collapse:collapse;
  width:100%;
  background:#fff;
}
th,td{
  border:1px solid #999;
  padding:6px;
  text-align:center;
  min-width:44px;
  cursor:pointer;
  user-select:none;
}
th{
  background:#222;
  color:#fff;
}
td.blank{
  background:#eee;
}
td.mark{
  outline:3px solid red;
}
canvas{
  position:absolute;
  left:0;
  top:0;
  pointer-events:none;
}
#popup{
  position:fixed;
  inset:5%;
  background:#fff;
  border:4px solid #000;
  display:none;
  z-index:9999;
}
#popupHeader{
  background:#000;
  color:#fff;
  padding:8px;
}
#popupClose{
  float:right;
  background:red;
  color:#fff;
  padding:4px 8px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>🔥 iSmart Analyzer – Photo Style FINAL</h1>

<textarea id="input" placeholder="Excel se copy paste karo"></textarea>
<button onclick="generate()">Generate</button>
<button onclick="save()">Save</button>
<button onclick="addRow()">Add Row</button>

<div id="wrap">
<table id="chart"></table>
<canvas id="cv"></canvas>
</div>

<div id="popup">
  <div id="popupHeader">
    <span id="popupTitle"></span>
    <span id="popupClose" onclick="closePopup()">X</span>
  </div>
  <div id="popupBody"></div>
</div>

<script>
const days=["Mon","Tue","Wed","Thu","Fri","Sat"];
let grid=[];
let rows=0;

function generate(){
  let raw=input.value.trim().split("\n");
  grid=[];
  raw.forEach(r=>{
    let row=r.trim().split(/\s+/);
    while(row.length<6) row.push("**");
    grid.push(row);
  });
  rows=grid.length;
  drawTable();
  resizeCanvas();
}

function drawTable(){
  chart.innerHTML="";
  let tr=document.createElement("tr");
  days.forEach(d=>{
    let th=document.createElement("th");
    th.textContent=d;
    tr.appendChild(th);
  });
  chart.appendChild(tr);

  grid.forEach((r,i)=>{
    let tr=document.createElement("tr");
    r.forEach((v,j)=>{
      let td=document.createElement("td");
      td.textContent=v;
      if(v==="**") td.classList.add("blank");
      td.onclick=()=>cellClick(i,j);
      tr.appendChild(td);
    });
    chart.appendChild(tr);
  });
}

function resizeCanvas(){
  cv.width=chart.offsetWidth;
  cv.height=chart.offsetHeight;
}

function family(j){
  if(j==="**") return [];
  let a=parseInt(j[0]),b=parseInt(j[1]);
  return [a,b,(a+b)%10,(a+9)%10,(b+9)%10];
}

function cellClick(r,c){
  clearCanvas();
  if(grid[r][c]==="**"){
    blankSearch(r,c);
  }else{
    jodiPopup(r,c);
  }
}

function blankSearch(r,c){
  let pat=[];
  for(let i=r-1;i>=0 && pat.length<10;i--){
    if(grid[i][c]!=="**") pat.push(grid[i][c]);
  }
  if(pat.length<4){
    alert("Pattern ke liye data kam hai");
    return;
  }

  for(let rr=0;rr<rows-pat.length;rr++){
    let ok=true;
    for(let k=0;k<pat.length;k++){
      let f1=family(pat[k]);
      let f2=family(grid[rr+k][c]);
      if(!f1.some(x=>f2.includes(x))){ ok=false;break;}
    }
    if(ok){
      drawLine(rr,c,rr+pat.length-1,c,true);
    }
  }
}

function drawLine(r1,c1,r2,c2,clickable){
  let ctx=cv.getContext("2d");
  let p1=center(r1,c1);
  let p2=center(r2,c2);
  ctx.strokeStyle="blue";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(p1.x,p1.y);
  ctx.lineTo(p2.x,p2.y);
  ctx.stroke();
}

function center(r,c){
  let td=chart.rows[r+1].cells[c];
  let t=chart.getBoundingClientRect();
  let rct=td.getBoundingClientRect();
  return{
    x:rct.left-t.left+rct.width/2,
    y:rct.top-t.top+rct.height/2
  };
}

function clearCanvas(){
  cv.getContext("2d").clearRect(0,0,cv.width,cv.height);
}

function jodiPopup(r,c){
  popup.style.display="block";
  popupTitle.textContent=`Jodi ${grid[r][c]} | ${days[c]} | Row ${r+1}`;
  popupBody.innerHTML="";
  let tbl=document.createElement("table");
  tbl.style.width="100%";

  for(let i=Math.max(0,r-4);i<=Math.min(rows-1,r+5);i++){
    let tr=document.createElement("tr");
    for(let j=0;j<6;j++){
      let td=document.createElement("td");
      td.textContent=grid[i][j];
      if(i===r && j===c) td.classList.add("mark");
      if(family(grid[i][j]).some(x=>family(grid[r][c]).includes(x))){
        td.style.background="#ffe0e0";
      }
      tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }
  popupBody.appendChild(tbl);
}

function closePopup(){
  popup.style.display="none";
}

function save(){
  localStorage.setItem("ismart",input.value);
  alert("Saved");
}
function addRow(){
  input.value+="\n** ** ** ** ** **";
}

window.onload=()=>{
  let d=localStorage.getItem("ismart");
  if(d){ input.value=d; generate(); }
}
</script>

</body>
</html>
