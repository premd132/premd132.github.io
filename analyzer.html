<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iSmart Analyzer – Photo Style</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>📊 iSmart Analyzer (Photo Logic)</h2>

<textarea id="dataInput" placeholder="Excel se copy paste karo"></textarea>

<div class="btns">

  <button onclick="addBlankRow()">Add Blank Row</button>

  <canvas id="canvas"></canvas>

  <div id="popupHeader">
    <span id="popupTitle"></span>
    <button onclick="closePopup()">X</button>
  </div>
  <div id="popupBody"></div>
</div>

<script src="script.js"></script>
</body>
