<!DOCTYPE html>
<html>
<head>
<title>Select Game</title>
<style>
body{font-family:Arial;background:#020617;color:#fff;text-align:center}
.game{background:#1e293b;margin:15px;padding:20px;border-radius:10px;font-size:20px;cursor:pointer}
</style>
</head>
<body>

<h2>Select Game</h2>

<div class="game" onclick="go('milan_day')">Milan Day</div>
<div class="game" onclick="go('kalyan')">Kalyan</div>
<div class="game" onclick="go('rajdhani_night')">Rajdhani Night</div>

<script>
function go(g){
 localStorage.setItem("currentGame",g);
 location.href="analyzer.html";
}
</script>

</body>
</html>
