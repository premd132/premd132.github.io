<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iSmart Analyzer – CLICK FIXED</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  margin:0;
  padding:10px;
}
h2{text-align:center}

textarea{
  width:100%;
  height:140px;
  font-family:monospace;
  font-size:14px;
}

button{
  padding:10px 14px;
  margin:4px;
  font-size:14px;
}

table{
  border-collapse:collapse;
  width:100%;
  background:#fff;
}

th,td{
  border:1px solid #777;
  padding:6px;
  text-align:center;
  min-width:45px;
}

th{
  background:#111;
  color:#fff;
}

td.blank{
  background:#e0e0e0;
  font-weight:bold;
}

td.match{
  background:#ffd6d6;
}

#log{
  margin-top:10px;
  padding:8px;
  background:#000;
  color:#0f0;
  font-size:12px;
  max-height:140px;
  overflow:auto;
}
</style>
</head>

<body>

<h2>🔥 iSmart Analyzer (CLICK WORKING)</h2>

<textarea id="dataInput" placeholder="Excel se data paste karo"></textarea><br>

<button onclick="generate()">Generate</button>
<button onclick="addBlankRow()">Add Blank Row</button>

<div id="tableWrap"></div>

<div id="log">LOG:</div>

<script>
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat"];
let grid=[];

function log(msg){
  document.getElementById("log").innerHTML += "<br>"+msg;
}

function generate(){
  log("Generate clicked");
  grid=[];
  let lines=document.getElementById("dataInput").value.trim().split("\n");

  lines.forEach(line=>{
    let r=line.trim().split(/\s+/);
    while(r.length<6) r.push("**");
    grid.push(r);
  });

  drawTable();
}

function addBlankRow(){
  grid.push(["**","**","**","**","**","**"]);
  drawTable();
}

function drawTable(){
  let html="<table><tr>";
  DAYS.forEach(d=>html+="<th>"+d+"</th>");
  html+="</tr>";

  grid.forEach((row,r)=>{
    html+="<tr>";
    row.forEach((val,c)=>{
      let cls = val==="**" ? "blank":"";
      html+=`<td class="${cls}" data-r="${r}" data-c="${c}">${val}</td>`;
    });
    html+="</tr>";
  });

  html+="</table>";
  document.getElementById("tableWrap").innerHTML=html;

  // 🔥 ONE single event handler (FIX)
  document.querySelectorAll("td").forEach(td=>{
    td.addEventListener("click",onCellClick);
  });
}

function onCellClick(e){
  let td=e.target;
  let r=parseInt(td.dataset.r);
  let c=parseInt(td.dataset.c);
  let val=grid[r][c];

  clearMarks();

  if(val==="**"){
    log("Blank clicked → row "+r+" col "+c);
    blankPatternSearch(r,c);
  }else{
    log("Jodi clicked: "+val+" (row "+r+", col "+c+")");
    td.style.outline="3px solid red";
  }
}

function blankPatternSearch(r,c){
  let pattern=[];

  // 🔍 last 8 rows pattern
  for(let i=r-1;i>=0 && pattern.length<8;i--){
    if(grid[i][c]!=="**") pattern.push(grid[i][c]);
  }

  if(pattern.length<3){
    log("Pattern too small");
    return;
  }

  log("Pattern found: "+pattern.join(","));

  // 🔁 search same pattern everywhere
  for(let i=0;i<=grid.length-pattern.length;i++){
    let ok=true;
    for(let k=0;k<pattern.length;k++){
      if(grid[i+k][c]!==pattern[k]){
        ok=false; break;
      }
    }
    if(ok){
      markRows(i,pattern.length,c);
      log("Match at row "+i);
    }
  }
}

function markRows(start,len,c){
  for(let i=0;i<len;i++){
    let td=document.querySelector(`td[data-r="${start+i}"][data-c="${c}"]`);
    if(td) td.classList.add("match");
  }
}

function clearMarks(){
  document.querySelectorAll(".match").forEach(td=>td.classList.remove("match"));
  document.querySelectorAll("td").forEach(td=>td.style.outline="none");
}
</script>

</body>
</html>
