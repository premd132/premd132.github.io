<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iSmart Row Pattern Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  padding:10px;
}
h2{ text-align:center; }

textarea{
  width:100%;
  height:140px;
  font-family:monospace;
  font-size:14px;
}

button{
  padding:10px;
  margin:5px 2px;
  font-size:14px;
  cursor:pointer;
}

table{
  border-collapse:collapse;
  width:100%;
  background:#fff;
}
th,td{
  border:1px solid #999;
  padding:6px;
  text-align:center;
  min-width:45px;
}
th{
  background:#111;
  color:#fff;
}
td.blank{
  background:#eee;
  font-weight:bold;
  cursor:pointer;
}

.match{
  background:#ffdddd !important;
}

#log{
  margin-top:10px;
  background:#000;
  color:#0f0;
  padding:8px;
  font-size:12px;
  height:160px;
  overflow:auto;
}
</style>
</head>

<body>

<h2>🔥 iSmart – ROW PATTERN ENGINE (FOUNDATION)</h2>

<textarea id="dataInput" placeholder="Excel se copy-paste data yahan karo  
Blank ke liye ** use karo"></textarea>

<br>
<button onclick="generate()">Generate</button>
<button onclick="addBlankRow()">Add Blank Row</button>
<button onclick="saveData()">Save</button>

<table id="chart"></table>

<div id="log"></div>

<script>
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat"];
let grid = [];

/* ---------------- BASIC ---------------- */

function generate(){
  grid = [];
  let raw = document.getElementById("dataInput").value.trim().split("\n");
  raw.forEach(r=>{
    let row = r.trim().split(/\s+/);
    while(row.length<6) row.push("**");
    grid.push(row);
  });
  drawTable();
  log("Data loaded. Rows = " + grid.length);
}

function drawTable(){
  const table = document.getElementById("chart");
  table.innerHTML = "";

  let tr = document.createElement("tr");
  DAYS.forEach(d=>{
    let th = document.createElement("th");
    th.textContent = d;
    tr.appendChild(th);
  });
  table.appendChild(tr);

  grid.forEach((r,ri)=>{
    let tr = document.createElement("tr");
    r.forEach((v,ci)=>{
      let td = document.createElement("td");
      td.textContent = v;
      if(v==="**"){
        td.classList.add("blank");
        td.onclick = ()=>blankClick(ri,ci);
      }
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
}

/* ---------------- PATTERN ENGINE ---------------- */

/* JODI → STRUCTURE */
function jodiStructure(j){
  let a = parseInt(j[0]);
  let b = parseInt(j[1]);
  let sum = a+b;

  return {
    sumMod: sum % 10,
    parity: sum % 2,        // even/odd
    cut: Math.abs(a-b),
  };
}

/* ROW → SIGNATURE */
function rowSignature(row){
  let sig = [];
  row.forEach(v=>{
    if(v==="**"){
      sig.push("X");
    }else{
      let s = jodiStructure(v);
      sig.push(s.sumMod+"-"+s.parity+"-"+s.cut);
    }
  });
  return sig.join("|");
}

/* BLANK CLICK */
function blankClick(r,c){
  clearMarks();
  log("Blank clicked at row "+r+" col "+c);

  let depth = 9;
  let pattern = [];

  for(let i=r-1;i>=0 && pattern.length<depth;i--){
    if(grid[i][c] !== "**"){
      pattern.push(rowSignature(grid[i]));
    }
  }

  if(pattern.length < 4){
    log("❌ Pattern too small");
    return;
  }

  log("ROW PATTERN (TOP → DOWN):");
  pattern.forEach(p=>log(p));

  searchPattern(pattern);
}

/* SEARCH SAME ROW-PATTERN */
function searchPattern(pattern){
  log("Searching same pattern in full record...");
  let matches = 0;

  for(let i=0;i<=grid.length-pattern.length;i++){
    let ok = true;
    for(let k=0;k<pattern.length;k++){
      if(rowSignature(grid[i+k]) !== pattern[k]){
        ok=false; break;
      }
    }
    if(ok){
      matches++;
      markRows(i, pattern.length);
      log("✔ Match at row "+i);
    }
  }

  log("TOTAL MATCHES: "+matches);
}

/* ---------------- UI HELPERS ---------------- */

function markRows(start,len){
  let table = document.getElementById("chart");
  for(let i=0;i<len;i++){
    let tr = table.rows[start+i+1];
    if(tr) tr.classList.add("match");
  }
}

function clearMarks(){
  document.querySelectorAll(".match").forEach(e=>e.classList.remove("match"));
}

function log(msg){
  let l = document.getElementById("log");
  l.innerHTML += msg+"<br>";
  l.scrollTop = l.scrollHeight;
}

/* ---------------- STORAGE ---------------- */

function saveData(){
  localStorage.setItem("ismartData", document.getElementById("dataInput").value);
  alert("Saved");
}

function addBlankRow(){
  document.getElementById("dataInput").value += "\n** ** ** ** ** **";
}

window.onload = ()=>{
  let d = localStorage.getItem("ismartData");
  if(d){
    document.getElementById("dataInput").value = d;
    generate();
  }
}
</script>

</body>
</html>
