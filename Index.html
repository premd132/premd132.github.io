<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔥 iSmart Analyzer – Photo Style</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🔥 iSmart Analyzer (Photo-Style Line)</h1>

<textarea id="dataInput" placeholder="Excel se copy-paste data yahan karo"></textarea>

<div class="btns">
  <button onclick="generate()">Generate</button>
  <button onclick="addBlankRow()">Add Blank Row</button>
  <button onclick="saveData()">Save</button>
</div>

<div id="tableWrap">
  <table id="chart"></table>
  <canvas id="lineCanvas"></canvas>
</div>

<!-- POPUP -->
<div id="popup">
  <div id="popupHeader">
    <span id="popupTitle"></span>
    <button onclick="closePopup()">✖</button>
  </div>
  <div id="popupBody"></div>
</div>

<script src="script.js"></script>
</body>
</html>
