<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iSmart – Row Pattern + Family Logic</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial;
  background:#f2f2f2;
  margin:0;
  padding:10px;
}
h2{text-align:center}

textarea{
  width:100%;
  height:140px;
  font-family:monospace;
  font-size:14px;
}

button{
  padding:8px 12px;
  margin:4px;
  font-size:14px;
}

table{
  border-collapse:collapse;
  width:100%;
  background:#fff;
}
th,td{
  border:1px solid #999;
  padding:6px;
  text-align:center;
  min-width:45px;
}
th{
  background:#111;
  color:#fff;
}

td.blank{
  background:#e0e0e0;
  font-weight:bold;
  cursor:pointer;
}

td.mark{
  background:#ffdada;       /* PHOTO-STYLE UNDER MARK */
}

#lineLayer{
  position:absolute;
  top:0;left:0;
  pointer-events:none;
}

#log{
  margin-top:10px;
  background:#000;
  color:#0f0;
  font-size:12px;
  padding:8px;
  height:160px;
  overflow:auto;
}
</style>
</head>

<body>

<h2>🔥 iSmart – Family / Cut / Row-Pattern Engine</h2>

<textarea id="dataInput" placeholder="Excel se data paste karo  
Blank ke liye ** use karo"></textarea>

<br>
<button onclick="generate()">Generate</button>
<button onclick="addBlankRow()">Add Blank Row</button>

<div style="position:relative">
  <table id="chart"></table>
  <canvas id="lineLayer"></canvas>
</div>

<div id="log">LOG:</div>

<script>
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat"];
let grid=[];

/* ---------------- UTIL ---------------- */

function log(msg){
  let l=document.getElementById("log");
  l.innerHTML += msg+"<br>";
  l.scrollTop=l.scrollHeight;
}

/* ---------------- DATA ---------------- */

function generate(){
  grid=[];
  let raw=document.getElementById("dataInput").value.trim().split("\n");
  raw.forEach(r=>{
    let row=r.trim().split(/\s+/);
    while(row.length<6) row.push("**");
    grid.push(row);
  });
  drawTable();
  resizeCanvas();
  log("Data loaded. Rows="+grid.length);
}

function addBlankRow(){
  document.getElementById("dataInput").value += "\n** ** ** ** ** **";
}

/* ---------------- DRAW ---------------- */

function drawTable(){
  const t=document.getElementById("chart");
  t.innerHTML="";

  let tr=document.createElement("tr");
  DAYS.forEach(d=>{
    let th=document.createElement("th");
    th.textContent=d;
    tr.appendChild(th);
  });
  t.appendChild(tr);

  grid.forEach((r,ri)=>{
    let tr=document.createElement("tr");
    r.forEach((v,ci)=>{
      let td=document.createElement("td");
      td.textContent=v;
      td.dataset.r=ri;
      td.dataset.c=ci;

      if(v==="**"){
        td.classList.add("blank");
        td.onclick=()=>blankClick(ri,ci);
      }

      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
}

/* ---------------- FORMULA ---------------- */

/* Family + Cut */
function familySet(j){
  let a=parseInt(j[0]), b=parseInt(j[1]);
  return [
    a, b,
    (a+5)%10,
    (b+5)%10,
    Math.abs(a-b)
  ];
}

/* Row structure = GAME FLOW (number independent) */
function rowSignature(row){
  let sig=[];
  row.forEach(v=>{
    if(v==="**"){
      sig.push("X");
    }else{
      let a=parseInt(v[0]), b=parseInt(v[1]);
      sig.push(
        (a+b)%10 + "-" +           // sum mod
        (a>b?1:0) + "-" +          // direction
        Math.abs(a-b)              // cut
      );
    }
  });
  return sig.join("|");
}

/* ---------------- BLANK CLICK LOGIC ---------------- */

function blankClick(r,c){
  clearMarks();
  clearCanvas();

  log("Blank clicked at row "+r+" col "+c);

  let depth=9;
  let basePattern=[];

  for(let i=r-1;i>=0 && basePattern.length<depth;i--){
    if(grid[i][c]!=="**"){
      basePattern.push(rowSignature(grid[i]));
    }
  }

  if(basePattern.length<4){
    log("❌ Pattern too small");
    return;
  }

  log("ROW-PATTERN:");
  basePattern.forEach(p=>log(p));

  searchSamePattern(basePattern,c);
}

/* ---------------- SEARCH ---------------- */

function searchSamePattern(pattern,col){
  let matches=0;

  for(let i=0;i<=grid.length-pattern.length;i++){
    let ok=true;
    for(let k=0;k<pattern.length;k++){
      if(rowSignature(grid[i+k])!==pattern[k]){
        ok=false; break;
      }
    }
    if(ok){
      matches++;
      markBlock(i,pattern.length,col);
      drawLine(i,i+pattern.length-1,col);
      log("✔ Match at row "+i);
    }
  }

  log("TOTAL MATCHES = "+matches);
}

/* ---------------- MARKING ---------------- */

function markBlock(start,len,col){
  const t=document.getElementById("chart");
  for(let i=0;i<len;i++){
    t.rows[start+i+1].cells[col].classList.add("mark");
  }
}

/* ---------------- LINE (visual connector) ---------------- */

function resizeCanvas(){
  let c=document.getElementById("lineLayer");
  let t=document.getElementById("chart");
  c.width=t.offsetWidth;
  c.height=t.offsetHeight;
}

function clearCanvas(){
  let c=document.getElementById("lineLayer");
  c.getContext("2d").clearRect(0,0,c.width,c.height);
}

function drawLine(r1,r2,c){
  let ctx=document.getElementById("lineLayer").getContext("2d");
  let p1=center(r1,c);
  let p2=center(r2,c);
  ctx.strokeStyle="blue";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(p1.x,p1.y);
  ctx.lineTo(p2.x,p2.y);
  ctx.stroke();
}

function center(r,c){
  let t=document.getElementById("chart");
  let cell=t.rows[r+1].cells[c].getBoundingClientRect();
  let base=t.getBoundingClientRect();
  return {
    x:cell.left-base.left+cell.width/2,
    y:cell.top-base.top+cell.height/2
  };
}

/* ---------------- HELPERS ---------------- */

function clearMarks(){
  document.querySelectorAll(".mark").forEach(e=>e.classList.remove("mark"));
}
</script>

</body>
</html>
