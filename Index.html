<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jodi Trend Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f4f4;
  margin:0;
  padding:10px;
}
h1{
  text-align:center;
  color:#d60000;
}
button{
  padding:6px 10px;
  margin:2px;
  cursor:pointer;
}
table{
  border-collapse:collapse;
  width:100%;
  background:#fff;
}
th,td{
  border:1px solid #999;
  text-align:center;
  padding:4px;
  font-size:14px;
}
th{
  background:#eee;
}
td.jodi{
  cursor:pointer;
}
td.highlight{
  background:#ffeb3b;
}
td.family{
  background:#c8e6c9;
}
.line{
  outline:3px solid red;
}
.popup{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}
.popup-content{
  background:#fff;
  padding:15px;
  width:90%;
  max-height:80%;
  overflow:auto;
}
textarea{
  width:100%;
  height:120px;
}
</style>
</head>

<body>

<h1>🔥 Jodi Trend Analyzer (Manual)</h1>

<p><b>Manual Data (Day Row on Top):</b><br>
Format example:<br>
Mon 12 34 56 78 90<br>
Tue 23 45 67 89 01
</p>

<textarea id="inputData" placeholder="Enter manual record here..."></textarea>
<br>
<button onclick="generate()">Generate Chart</button>
<button onclick="clearData()">Clear</button>

<hr>

<div id="chart"></div>

<div class="popup" id="popup">
  <div class="popup-content">
    <h3>📌 Trend Details</h3>
    <div id="popupData"></div>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<script>
// ===== FAMILY SET =====
const familyMap = {
  "0":["0","5"],
  "1":["1","6"],
  "2":["2","7"],
  "3":["3","8"],
  "4":["4","9"],
  "5":["5","0"],
  "6":["6","1"],
  "7":["7","2"],
  "8":["8","3"],
  "9":["9","4"]
};

// ===== LOAD SAVED =====
window.onload=()=>{
  if(localStorage.getItem("jodiData")){
    document.getElementById("inputData").value =
      localStorage.getItem("jodiData");
    generate();
  }
};

function clearData(){
  localStorage.removeItem("jodiData");
  location.reload();
}

function generate(){
  const raw=document.getElementById("inputData").value.trim();
  if(!raw) return alert("Data enter karo");
  localStorage.setItem("jodiData",raw);

  const lines=raw.split("\n");
  let days=[];
  let rows=[];

  lines.forEach(l=>{
    let p=l.trim().split(/\s+/);
    days.push(p[0]);
    rows.push(p.slice(1));
  });

  let html="<table><tr><th>Day</th>";
  rows[0].forEach((_,i)=>html+=`<th>C${i+1}</th>`);
  html+="</tr>";

  rows.forEach((r,i)=>{
    html+=`<tr><th>${days[i]}</th>`;
    r.forEach((j,ci)=>{
      html+=`<td class="jodi" data-r="${i}" data-c="${ci}" onclick="analyze(${i},${ci})">${j}</td>`;
    });
    html+="</tr>";
  });
  html+="</table>";

  document.getElementById("chart").innerHTML=html;
}

// ===== ANALYSIS =====
function analyze(r,c){
  clearMarks();
  const cell=document.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
  const val=cell.innerText;
  cell.classList.add("highlight");

  let d1=val[0], d2=val[1];
  let fam=[...familyMap[d1],...familyMap[d2]];

  let matches=[];
  document.querySelectorAll(".jodi").forEach(td=>{
    let v=td.innerText;
    if(fam.includes(v[0]) && fam.includes(v[1])){
      td.classList.add("family");
      matches.push(`Row ${td.dataset.r+1}, Col ${+td.dataset.c+1} → ${v}`);
    }
  });

  showPopup(val,fam,matches);
}

function clearMarks(){
  document.querySelectorAll("td").forEach(td=>{
    td.classList.remove("highlight","family","line");
  });
}

function showPopup(val,fam,matches){
  let html=`<b>Selected Jodi:</b> ${val}<br>`;
  html+=`<b>Family Digits:</b> ${fam.join(", ")}<br><br>`;
  html+=`<b>Matches (${matches.length}):</b><br>`;
  matches.forEach(m=>html+=m+"<br>");
  document.getElementById("popupData").innerHTML=html;
  document.getElementById("popup").style.display="flex";
}
function closePopup(){
  document.getElementById("popup").style.display="none";
}
</script>

</body>
</html>
