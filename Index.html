<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pirates Jodi Trend Analyzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#eee;padding:8px}
h2{text-align:center;color:#b30000}
textarea{width:100%;height:120px}
button{padding:6px 10px;margin:4px}
table{border-collapse:collapse;background:#fff}
td,th{border:1px solid #777;padding:4px;font-size:13px;text-align:center}
td.jodi{cursor:pointer;position:relative}
.box{outline:3px solid red}
.circle{border-radius:50%;outline:3px solid blue}
.family{background:#c8f7c5}
canvas{position:absolute;left:0;top:0;pointer-events:none}

#zoomWrap{
  transform-origin: top left;
  transition: transform 0.2s ease;
}

.side{margin-top:8px;background:#fff;padding:6px}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
.popup-inner{background:#fff;padding:12px;width:92%;max-height:85%;overflow:auto}
</style>
</head>

<body>

<h2>🏴‍☠️ Pirates Multi-Trend Analyzer</h2>

<textarea id="data" placeholder="Mon 12 34 56 78
Tue 23 45 67 89"></textarea><br>

<button onclick="build()">Generate</button>
<button onclick="clearAll()">Clear</button>
<button onclick="zoomIn()">➕ Zoom</button>
<button onclick="zoomOut()">➖ Zoom</button>

<div id="zoomWrap" style="position:relative">
  <canvas id="cv"></canvas>
  <div id="grid"></div>
</div>

<div class="side">
<b>📊 Trend List</b>
<div id="trendList">Click any jodi</div>
</div>

<div class="popup" id="popup">
 <div class="popup-inner">
  <h3>📸 Photo Style Trend View</h3>
  <div id="pop"></div>
  <button onclick="closePop()">Close</button>
 </div>
</div>

<script>
/* ================= ZOOM ================= */
let zoom=1;
function zoomIn(){
  zoom+=0.1;
  document.getElementById("zoomWrap").style.transform=`scale(${zoom})`;
}
function zoomOut(){
  zoom=Math.max(0.5,zoom-0.1);
  document.getElementById("zoomWrap").style.transform=`scale(${zoom})`;
}

/* ================= FAMILY ================= */
const family={
0:["0","5"],1:["1","6"],2:["2","7"],3:["3","8"],4:["4","9"],
5:["5","0"],6:["6","1"],7:["7","2"],8:["8","3"],9:["9","4"]
};

let mat=[],cells=[],cols=0;
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");

/* ================= BUILD ================= */
function build(){
 localStorage.setItem("pirateData",data.value);
 const rows=data.value.trim().split("\n").map(r=>r.split(/\s+/));
 mat=rows.map(r=>r.slice(1)); cols=mat[0].length;

 let h="<table><tr><th>Day</th>";
 mat[0].forEach((_,i)=>h+=`<th>C${i+1}</th>`); h+="</tr>";

 rows.forEach((r,i)=>{
  h+=`<tr><th>${r[0]}</th>`;
  r.slice(1).forEach((v,j)=>{
   h+=`<td class="jodi" onclick="analyze(${i},${j})">${v}</td>`;
  });
  h+="</tr>";
 });
 h+="</table>";
 grid.innerHTML=h;
 cells=[...document.querySelectorAll(".jodi")];
 resize();
}

/* ================= CANVAS ================= */
function resize(){
 cv.width=grid.offsetWidth;
 cv.height=grid.offsetHeight;
 ctx.clearRect(0,0,cv.width,cv.height);
}

/* ================= ANALYZE ================= */
function analyze(r,c){
 ctx.clearRect(0,0,cv.width,cv.height);
 document.querySelectorAll("td").forEach(td=>td.className="jodi");

 let base=mat[r][c];
 let fam=[...family[base[0]],...family[base[1]]];
 let vertical=[],diag1=[],diag2=[];

 mat.forEach((row,i)=>{
  row.forEach((v,j)=>{
   if(fam.includes(v[0])&&fam.includes(v[1])){
    let td=cells[i*cols+j];
    td.classList.add("family");
    if(j===c) vertical.push(td);
    if(i-r===j-c) diag1.push(td);
    if(i-r===c-j) diag2.push(td);
   }
  });
 });

 draw(vertical,"blue");
 draw(diag1,"red");
 draw(diag2,"green");

 cells[r*cols+c].classList.add("box","circle");

 trendList.innerHTML=
  `🔵 Vertical: ${vertical.length}<br>
   🔴 Diagonal ↘: ${diag1.length}<br>
   🟢 Diagonal ↗: ${diag2.length}`;

 popup(base,fam,vertical,diag1,diag2);
}

/* ================= DRAW LINE ================= */
function draw(arr,color){
 if(arr.length<2)return;
 ctx.strokeStyle=color;
 ctx.lineWidth=2;
 ctx.beginPath();
 arr.forEach((td,i)=>{
  const r=td.getBoundingClientRect(),t=grid.getBoundingClientRect();
  let x=r.left-t.left+r.width/2;
  let y=r.top-t.top+r.height/2;
  if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 });
 ctx.stroke();
}

/* ================= POPUP ================= */
function popup(base,fam,v,d1,d2){
 pop.innerHTML=
 `<b>Selected:</b> ${base}<br>
 <b>Family:</b> ${fam.join(",")}<br><br>
 🔵 Vertical matches: ${v.length}<br>
 🔴 Diagonal ↘: ${d1.length}<br>
 🟢 Diagonal ↗: ${d2.length}<br>
 <hr>
 Same family + same angle = same pattern`;
 popup.style.display="flex";
}
function closePop(){popup.style.display="none"}

/* ================= LOAD ================= */
function clearAll(){localStorage.clear();location.reload()}
if(localStorage.pirateData){data.value=localStorage.pirateData;build()}
</script>

</body>
</html>
